function getArea(code) {
  const prefix = String(code).slice(0, 3);
  return AREA_MAP[prefix] || '未知';
}

function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  window.nowStr = `${h}:${m}`;
  return window.nowStr;
}

document.getElementById('keyword').addEventListener('input', function(e) {
  let kw = e.target.value.trim();
  const resultEl = document.getElementById('result');
  updateTime();

  if (!kw) {
    resultEl.textContent = '—';
    resultEl.className = 'result';
    return;
  }

  // 编号查询
  let code = kw.toUpperCase().replace(/^G-/, '');
  let pos = posIndex[code];
  let name = posNames[code] || '';

  // 名称模糊搜索
  if (!pos && kw.length >= 2) {
    let results = [];
    for (let k in posNames) {
      if (posNames[k].indexOf(kw) !== -1 && posIndex[k]) {
        results.push({code: k, name: posNames[k], pos: posIndex[k]});
      }
    }
    if (results.length === 0) {
      resultEl.textContent = nowStr + ' 未找到该站点';
      resultEl.className = 'result not-found';
      return;
    }
    if (results.length === 1) {
      pos = results[0].pos;
      code = results[0].code;
      name = results[0].name;
    } else if (results.length <= 8) {
      let html = '<div style="font-size:12px;color:#8aa8b8;margin-bottom:6px">匹配到 ' + results.length + ' 个站点：</div>';
      results.forEach(function(r) {
        html += '<div style="font-size:13px;padding:4px 0;border-top:1px solid #1a2a38">' +
          '<span style="color:#e0e0e0">' + r.name + '</span> ' +
          '<span style="color:#4ade80;font-size:11px">[' + r.code + '] → 派工' + getArea(r.pos) + '</span></div>';
      });
      resultEl.innerHTML = html;
      resultEl.className = 'result found';
      return;
    }
  }

  if (pos) {
    const area = getArea(pos);
    if (name) {
      resultEl.innerHTML = '<div style="font-size:16px;margin-bottom:4px;color:#8aa8b8">' + name + '</div><div style="font-size:12px;color:#5a7a8e">' + code + '</div><div style="font-size:28px;margin-top:4px">' + nowStr + ' 派工' + area + '</div>';
    } else {
      resultEl.textContent = nowStr + ' 派工' + area;
    }
    resultEl.className = 'result found';
  } else {
    resultEl.textContent = nowStr + ' 未找到该站点';
    resultEl.className = 'result not-found';
  }
});

document.getElementById('searchBtn').addEventListener('click', function() {
  document.getElementById('keyword').dispatchEvent(new Event('input'));
});

document.getElementById('keyword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('keyword').dispatchEvent(new Event('input'));
  }
});

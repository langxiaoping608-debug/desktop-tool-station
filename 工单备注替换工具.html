顾客卡号3100000998877661，2026-04-28 09:15租用车号888001，还车站点6028，望领导批准。工号：1141" rows="4"></textarea>

<script>
// ====== 派工区域规则 ======
const DISPATCH_RULES = [
  {prefix:['881','889'], area:'城东', cls:'area-east'},
  {prefix:['882'],       area:'城南', cls:'area-south'},
  {prefix:['883','886'], area:'城西', cls:'area-west'},
  {prefix:['884'],       area:'城北', cls:'area-north'},
];
function getDispatchArea(pos){
  const p = String(pos).slice(0,3);
  for(const r of DISPATCH_RULES){
    if(r.prefix.includes(p)) return {area:r.area, cls:r.cls};
  }
  return {area:'未知', cls:'area-east'};
}

// ====== 网点数据库 ======
let SITE_TO_POS = {};
let siteLoaded = false;
async function loadSiteData(){
  try{
    const res = await fetch('site_to_pos.json');
    if(res.ok){ SITE_TO_POS = await res.json(); siteLoaded = true; }
  }catch(e){ console.warn('网点库加载失败:', e.message); }
}

function getDispatchHtml(site){
  if(!siteLoaded || !SITE_TO_POS[site]) return '';
  const pos = SITE_TO_POS[site];
  const {area,cls} = getDispatchArea(pos);
  const t = nowTime();
  return `<span class="area-tag ${cls}">${t} 派工${area}</span>`;
}
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

// ====== 智能识别引擎 ======
// 按出现顺序提取：卡号/手机号 → 车号 → 租车时间 → 还车时间 → 网点
function smartExtract(text){
  const result = {
    dates: [],      // 所有日期时间（按出现顺序）
    cards: [],      // 卡号
    phones: [],     // 手机号
    bikes: [],      // 车号
    stations: [],   // 网点
    workids: [],    // 工号
    fees: []        // 费用
  };

  // 扫描全文，按位置顺序收集所有匹配
  const allMatches = [];

  // 日期时间 - 支持日期与时间无空格或跨行，统一转为 YYYY-MM-DD HH:MM:SS
  // 匹配顺序：先找 "日期 时间"（有空格），再找 "日期时间"（无空格/跨行）
  const dateRegex1 = /(\d{4}[-/年]\d{1,2}[-/月]\d{1,2}[日]?)\s+(\d{1,2}:\d{2}(?::\d{2})?)/g;
  const dateRegex2 = /(\d{4}[-/年]\d{1,2}[-/月]\d{1,2}[日]?)[\s]*?(\d{1,2}:\d{2}(?::\d{2})?)/g;
  [dateRegex1, dateRegex2].forEach(regex => {
    let m;
    while((m=regex.exec(text))!==null){
      let d = m[1].replace(/年/g,'-').replace(/月/g,'-').replace(/日/g,'') + ' ' + m[2];
      d = d.replace(/\s+/g,' ');
      // 如果日期和时间连在一起（无空格），修复
      d = d.replace(/(\d{4}-\d{2}-\d{2})(\d{2}:)/,'$1 $2');
      const parts = d.match(/^(\d+)-(\d+)-(\d+)\s+(\d+):(\d+):?(\d*)$/);
      if(parts){
        d = parts[1]+'-'+String(+parts[2]).padStart(2,'0')+'-'+String(+parts[3]).padStart(2,'0')+' '+
            String(+parts[4]).padStart(2,'0')+':'+parts[5]+':'+(parts[6]||'00');
      }
      allMatches.push({pos:m.index, type:'date', val:d, raw:m[1]+' '+m[2]});
    }
  });

  // 14-16位 → 卡号
  const cardRegex = /\b(\d{14,16})\b/g;
  while((m=cardRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'card', val:m[1]});
  }

  // 手机号
  const phoneRegex = /\b(1\d{10})\b/g;
  while((m=phoneRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'phone', val:m[1]});
  }

  // 工号
  const workidRegex = /工号[：:]\s*(\d{3,6})/g;
  while((m=workidRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'workid', val:m[1]});
  }

  // 费用
  const feeRegex = /(?:资费|费用|产生)(\d+)元/g;
  while((m=feeRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'fee', val:m[1]});
  }

  // 4位网点
  const stationRegex = /\b([1-9]\d{3})\b/g;
  while((m=stationRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'station', val:m[1]});
  }

  // 5-8位 → 车号候选
  const bikeRegex = /\b(\d{5,8})\b/g;
  while((m=bikeRegex.exec(text))!==null){
    allMatches.push({pos:m.index, type:'bike_raw', val:m[1]});
  }

  // 按出现位置排序
  allMatches.sort((a,b)=>a.pos-b.pos);

  // 去重并分配：同一位置只保留优先级最高的类型
  const usedPos = new Set();
  const typePriority = ['card','phone','bike_raw','date','station','workid','fee'];

  allMatches.forEach(item => {
    const posKey = item.pos;
    if(usedPos.has(posKey)) return;
    // 检查重叠（下一个匹配的pos是否在当前匹配范围内）
    // 直接加入（简单的去重）
    if(item.type === 'card'){ result.cards.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'phone'){ result.phones.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'bike_raw'){ result.bikes.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'date'){ result.dates.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'station'){ result.stations.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'workid'){ result.workids.push(item.val); usedPos.add(posKey); }
    else if(item.type === 'fee'){ result.fees.push(item.val); usedPos.add(posKey); }
  });

  return result;
}

// ====== 智能映射 ======
function smartMap(extracted, tplFields){
  const map = {};
  tplFields.forEach(f => {
    switch(f.key){
      case 'date1':  map[f.key] = extracted.dates[0]||null; break;
      case 'date2':  map[f.key] = extracted.dates[1]||null; break;
      case 'card':   map[f.key] = extracted.cards[0]||null; break;
      case 'phone':  map[f.key] = extracted.phones[0]||null; break;
      case 'bike':   map[f.key] = extracted.bikes[0]||null; break;
      case 'station':map[f.key] = extracted.stations[0]||null; break;
      case 'fee':    map[f.key] = extracted.fees[0]||null; break;
      case 'workid': map[f.key] = extracted.workids[0]||null; break;
    }
  });
  return map;
}

// ====== 模板 ======
const TEMPLATES = [
  {

    fields:[{label:'卡号',key:'card'},{label:'租车时间',key:'date1'},{label:'车号',key:'bike'},{label:'还车网点',key:'station'},{label:'工号',key:'workid'}]
  },
  {
    id:'tpl2', name:'📱 扫码租车超时费退款·手机号', desc:'扫码租车超时产生费用，顾客申请退还',
    text:'顾客手机号 17732070504，2024-01-12 22:22:19租用车号01914503 于2024-01-13 06:34:45还车成功产生5元租车费用。沟通中顾客对费用不认可，核实后出于人性化考虑，申请退还租车费用，望领导予以批准。工号：1141',
    fields:[{label:'手机号',key:'phone'},{label:'租车时间',key:'date1'},{label:'车号',key:'bike'},{label:'还车时间',key:'date2'},{label:'费用',key:'fee'},{label:'工号',key:'workid'}]
  },
  {
    id:'tpl3', name:'🅿️ 车位满·卡号', desc:'站点车位满无法还车，申请减免',
    text:'顾客卡号3100000037113771，2024-08-18 08:33:49 租用车号2402793，车辆出现时间2024-08-20 08:42:39。经核实，4954站点车位满导致其无法及时还车，现该车已有租还车记录，出于人性化考虑，帮其申请减免费用，望领导予以批准。工号：1141',
    fields:[{label:'卡号',key:'card'},{label:'租车时间',key:'date1'},{label:'车号',key:'bike'},{label:'车辆出现时间',key:'date2'},{label:'车位满站点',key:'station'},{label:'工号',key:'workid'}]
  },
  {
    id:'tpl4', name:'💳 资费退还·卡号', desc:'费用问题致电热线，申请返还资费5元',
    text:'顾客卡号13957155453 ,车号2302820,租车时间2024-08-18 21:49:35，车辆出现时间2024-08-19 07:15:31。其就费用问题致电热线，结合顾客所述情况，现申请返回其租车资费5元，望领导予以批准。工号：1141',
    fields:[{label:'卡号',key:'card'},{label:'车号',key:'bike'},{label:'租车时间',key:'date1'},{label:'车辆出现时间',key:'date2'},{label:'费用',key:'fee'},{label:'工号',key:'workid'}]

    fields:[{label:'卡号',key:'card'},{label:'车号',key:'bike'},{label:'还车未成功时间',key:'date1'},{label:'异常还车记录时间',key:'date2'},{label:'费用',key:'fee'}]

// ====== 状态 ======
let currentTpl = null;
let parsedFields = {};

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function renderTemplates(){
  const grid = document.getElementById('tplGrid');
  grid.innerHTML = '';
  TEMPLATES.forEach(tpl => {
    const btn = document.createElement('button');
    btn.className = 'tpl-btn';
    btn.id = 'tplbtn_'+tpl.id;
    btn.innerHTML = `<div class="tpl-name">${tpl.name}</div><div class="tpl-desc">${tpl.desc}</div>`;
    btn.onclick = () => selectTemplate(tpl.id);
    grid.appendChild(btn);
  });
}

function selectTemplate(id){
  currentTpl = TEMPLATES.find(t=>t.id===id);
  if(!currentTpl) return;
  document.querySelectorAll('.tpl-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tplbtn_'+id).classList.add('active');

  // 高亮原文
  const ext = smartExtract(currentTpl.text);
  let html = escHtml(currentTpl.text);
  const vals = [...ext.dates,...ext.cards,...ext.phones,...ext.bikes,...ext.stations,...ext.workids,...ext.fees];
  vals.forEach(v => { if(v) html = html.replace(new RegExp(escapeRegex(v),'g'), `<span class="hl">${escHtml(v)}</span>`); });
  document.getElementById('previewBox').innerHTML = html;
  document.getElementById('cardPreview').style.display = '';
  document.getElementById('cardNewInfo').style.display = '';
  document.getElementById('actionsBar').style.display = '';
  document.getElementById('cardResult').style.display = '';
  document.getElementById('resultBox').innerHTML = '<span class="empty-tip">结果将显示在这里…</span>';
  document.getElementById('statsLine').innerHTML = '';
  document.getElementById('analysisBox').style.display = 'none';
  document.getElementById('newInfoBox').value = '';
  document.getElementById('newInfoBox').focus();
  parsedFields = {};
}

function getTplFieldValue(tpl, key){
  const ext = smartExtract(tpl.text);
  const keyMap = {
    date1:'dates', date2:'dates', card:'cards', phone:'phones',
    bike:'bikes', station:'stations', workid:'workids', fee:'fees'
  };
  const extKey = keyMap[key] || key;
  // date2 用第2个日期（从后往前找对应的）
  if(key === 'date2'){
    if(ext.dates.length >= 2) return ext.dates[1];
    // 如果只有一个日期，尝试从模板文本中找"还车时间"前的日期
    const match = tpl.text.match(/(\d{4}-\d{2}-\d{2}[\s\S]{1,30}?还车[时间成功])|(\d{4}-\d{2}-\d{2}[\s\S]{1,50}?产生\d+元)/);
    if(match){
      const d = match[0].substring(0,19);
      return d;
    }
    return ext.dates[0] || null;
  }
  return ext[extKey] && ext[extKey].length > 0 ? ext[extKey][0] : null;
}

function normalizeDate(d){
  if(!d) return d;
  let nd = d.replace(/年/g,'-').replace(/月/g,'-').replace(/日/g,'').replace(/\s+/g,' ');
  // 如果日期和时间连在一起（无空格），插入空格
  nd = nd.replace(/(\d{4}-\d{2}-\d{2})(\d{2}:)/,'$1 $2');
  const parts = nd.match(/^(\d+)-(\d+)-(\d+)\s+(\d+):(\d+):?(\d*)$/);
  if(parts){
    nd = parts[1]+'-'+String(+parts[2]).padStart(2,'0')+'-'+String(+parts[3]).padStart(2,'0')+' '+
        String(+parts[4]).padStart(2,'0')+':'+String(+parts[5]).padStart(2,'0')+':'+String(parts[6]||'00').padStart(2,'0');
  }
  return nd;
}

function analyzeAndPreview(){
  if(!currentTpl) return;
  const newInfo = document.getElementById('newInfoBox').value.trim();
  if(!newInfo){ alert('请粘贴新信息！'); return; }

  const extracted = smartExtract(newInfo);
  parsedFields = smartMap(extracted, currentTpl.fields);

  let html = '';
  let hasChange = false;
  currentTpl.fields.forEach(f => {
    const oldVal = getTplFieldValue(currentTpl, f.key);
    const newVal = parsedFields[f.key];
    if(newVal && newVal !== oldVal){
      hasChange = true;
      html += `<span class="tag">${escHtml(f.label)}</span>`;
      html += `<span class="val-old">${escHtml(oldVal||'(未提取)')}</span> → `;
      html += `<span class="val-new">${escHtml(newVal)}</span>`;
      if(f.key==='station') html += ' '+getDispatchHtml(newVal);
      html += '<br>';
    } else if(newVal){
      html += `<span class="tag">${escHtml(f.label)}</span>`;
      html += `<span style="color:#999">${escHtml(newVal)}</span>`;
      if(f.key==='station') html += ' '+getDispatchHtml(newVal);
      html += `<span class="same-tag">（相同）</span><br>`;
    }
  });

  const box = document.getElementById('analysisBox');
  if(hasChange) box.innerHTML = '🔍 <strong>识别到以下变化：</strong><br>'+html;
  else if(html) box.innerHTML = 'ℹ️ <strong>识别的字段（无变化）：</strong><br>'+html;
  else box.innerHTML = '<span class="no-change">未识别到任何数值，请检查格式。</span>';
  box.style.display = '';
}

function doReplace(){
  if(!currentTpl) return;
  const newInfo = document.getElementById('newInfoBox').value.trim();
  if(!newInfo){ alert('请粘贴新信息！'); return; }
  if(Object.keys(parsedFields).length===0) analyzeAndPreview();

  // 占位符法：先替换成唯一占位符，再统一替换成新值，避免交叉污染
  let result = currentTpl.text;
  let count = 0;
  const replaced = [];
  const placeholderMap = []; // {placeholder, newVal, label}

  // 第一步：收集所有需要替换的字段，生成唯一占位符
  const debugRows = [];
  const replacements = [];
  currentTpl.fields.forEach(f => {
    const rawOldVal = getTplFieldValue(currentTpl, f.key);
    const newVal = parsedFields[f.key];
    const oldVal = (f.key==='date1'||f.key==='date2') ? normalizeDate(rawOldVal) : rawOldVal;
    const willReplace = !!(newVal && oldVal && newVal!==oldVal && result.includes(oldVal));
    debugRows.push({label:f.label, key:f.key, rawOldVal, newVal, oldVal, willReplace});
    if(willReplace){
      count++;
      replaced.push({label:f.label, from:oldVal, to:newVal});
      const placeholder = `\x00TPL${f.key}\x00`; // 不可见分隔符作为占位符
      replacements.push({oldVal, placeholder, newVal, label:f.label});
    }
  });

  // 第二步：用占位符替换旧值（每个旧值只替换第一次出现）
  replacements.forEach(r => {
    const idx = result.indexOf(r.oldVal);
    if(idx !== -1){
      result = result.substring(0, idx) + r.placeholder + result.substring(idx + r.oldVal.length);
    }
  });

  // 第三步：将占位符替换为新值
  replacements.forEach(r => {
    result = result.split(r.placeholder).join(r.newVal);
  });

  let out = escHtml(result);
  replaced.forEach(p=>{
    out = out.replace(new RegExp(escapeRegex(p.to),'g'), `<span class="hl">${escHtml(p.to)}</span>`);
  });

  document.getElementById('resultBox').innerHTML = out;
  document.getElementById('cardResult').style.display = '';
  if(count>0){
    document.getElementById('statsLine').innerHTML = `共替换 <span>${count}</span> 处（${replaced.map(p=>p.label).join('、')}）`;
  } else {
    document.getElementById('statsLine').innerHTML = `<span style="color:#fa8c16">未检测到变化</span>`;
  }
  document.getElementById('cardResult').scrollIntoView({behavior:'smooth',block:'start'});

  // 显示调试信息
  const dbg = document.getElementById('debugBox');
  let dbgHtml = '<strong style="color:#ffd700">🔍 调试信息</strong><br>';
  dbgHtml += '<table style="width:100%;border-collapse:collapse;"><tr style="color:#ffd700"><th>字段</th><th>模板原始值</th><th>新值(用户输入)</th><th>结果</th></tr>';
  debugRows.forEach(r => {
    const status = r.willReplace ? '✅ 将替换' : (r.newVal ? '⚠️ 未替换' : '❌ 未提取到');
    const color = r.willReplace ? '#7fff7f' : (r.newVal ? '#ffaa00' : '#ff8080');
    dbgHtml += `<tr><td>${r.label}(${r.key})</td><td>${r.rawOldVal||'(空)'}</td><td>${r.newVal||'(空)'}</td><td style="color:${color}">${status}</td></tr>`;
  });
  dbgHtml += '</table>';
  dbg.innerHTML = dbgHtml;
  dbg.style.display = '';
}

function copyResult(){
  const text = document.getElementById('resultBox').innerText || document.getElementById('resultBox').textContent;
  const btn = document.getElementById('btnCopy');
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='已复制 ✓'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='复制';btn.classList.remove('copied');},2000);
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent='已复制 ✓'; setTimeout(()=>{btn.textContent='复制';},2000);
  });
}

function resetAll(){
  document.getElementById('newInfoBox').value='';
  document.getElementById('resultBox').innerHTML='<span class="empty-tip">结果将显示在这里…</span>';
  document.getElementById('statsLine').innerHTML='';
  document.getElementById('analysisBox').style.display='none';
  parsedFields={};
}

renderTemplates();
loadSiteData();
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>杭州公交 · 线路查询</title>
<style>
:root{
  --bg:#080e14; --surface:#0f1722; --card:#131d29;
  --border:rgba(255,255,255,0.06); --border-hover:rgba(255,255,255,0.1);
  --text:#dfe6ed; --text-dim:#74889a; --text-subtle:#4a5d6e;
  --accent:#3ddc84; --accent-dim:rgba(61,220,132,0.10); --accent-glow:rgba(61,220,132,0.20);
  --danger:#ff6b6b; --danger-dim:rgba(255,107,107,0.10);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --shadow:0 2px 12px rgba(0,0,0,0.3);
  --transition:220ms cubic-bezier(0.22,0.61,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; justify-content:center;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(61,220,132,0.04) 0%,transparent 60%);
}
.app{width:100%;max-width:1040px;padding:48px 24px 80px}

/* Header */
.header{text-align:center;margin-bottom:40px}
.header .icon{display:inline-block;width:52px;height:52px;background:var(--accent-dim);border:1px solid var(--accent-glow);border-radius:16px;margin-bottom:16px;line-height:52px;font-size:24px}
.header h1{font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--text);letter-spacing:-0.5px;margin-bottom:6px}
.header h1 span{color:var(--accent)}
.header p{font-size:15px;color:var(--text-dim);font-weight:400}
.stats-row{display:flex;justify-content:center;gap:32px;margin-top:20px;flex-wrap:wrap}
.stat{text-align:center;padding:0 20px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat .num{font-size:28px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.stat .unit{font-size:13px;color:var(--text-subtle);margin-top:2px}

/* Search */
.search-wrap{position:relative;max-width:680px;margin:0 auto 36px}
.search-bar{
  display:flex;align-items:center;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:border-color var(--transition),box-shadow var(--transition)
}
.search-bar:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-dim),0 8px 32px rgba(0,0,0,0.4)
}
.search-bar .prefix{
  padding-left:20px;color:var(--text-subtle);font-size:18px;user-select:none
}
.search-bar input{
  flex:1;background:transparent;border:none;color:var(--text);font-size:17px;
  padding:18px 12px;outline:none;font-family:inherit;letter-spacing:0.3px
}
.search-bar input::placeholder{color:var(--text-subtle);opacity:0.6}
.search-bar .btn-search{
  padding:18px 32px;border:none;font-size:16px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#28a060);color:#fff;
  font-family:inherit;transition:opacity var(--transition);white-space:nowrap
}
.search-bar .btn-search:hover{opacity:0.9}
.search-bar .btn-search:active{opacity:0.8}
.hint{text-align:center;margin-top:10px;font-size:13px;color:var(--text-subtle);opacity:0.7}

/* Result */
.result{margin-top:8px}
.empty-state{text-align:center;padding:80px 20px}
.empty-state .ico{font-size:48px;margin-bottom:12px;opacity:0.3}
.empty-state .msg{font-size:16px;color:var(--text-subtle)}

/* Card */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
  box-shadow:var(--shadow);transition:border-color var(--transition)
}
.card:hover{border-color:var(--border-hover)}

.card-header{padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.card-header .line-info{display:flex;align-items:center;gap:14px}
.card-header .line-number{
  font-size:36px;font-weight:800;color:var(--text);letter-spacing:-0.5px;line-height:1
}
.card-header .line-sub{font-size:14px;color:var(--text-dim);margin-top:4px}
.status-badge{
  padding:6px 16px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap
}
.status-active{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-glow)}
.status-stopped{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,107,107,0.2)}
.status-new{background:rgba(96,165,250,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.2)}

.card-divider{height:1px;background:var(--border);margin:0 28px}

/* Info Grid */
.info-section{padding:28px 28px 24px}
.info-section:first-of-type{padding-top:28px}
.section-title{
  font-size:13px;font-weight:700;color:var(--text-subtle);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;
  display:flex;align-items:center;gap:8px
}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px
}
.info-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px 18px;
  transition:border-color var(--transition),transform var(--transition)
}
.info-item:hover{border-color:var(--border-hover);transform:translateY(-1px)}
.info-item .label{
  font-size:12px;font-weight:600;color:var(--text-subtle);
  text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px
}
.info-item .value{
  font-size:20px;font-weight:700;color:var(--text);word-break:break-all;line-height:1.3
}
.info-item .value.mono{
  font-family:"SF Mono","JetBrains Mono","Consolas",monospace;
  letter-spacing:0.5px;font-size:18px
}
.info-item .value.sub{font-size:15px;color:var(--text-dim);font-weight:500;margin-top:4px}

/* Alert */
.alert{
  padding:16px 20px;border-radius:var(--radius-sm);
  font-size:14px;line-height:1.6;margin-bottom:12px
}
.alert-stopped{background:var(--danger-dim);border:1px solid rgba(255,107,107,0.2);color:#fca5a5}
.alert-stopped strong{color:var(--danger)}

/* Depot Table */
.depot-wrap{padding:0 28px 28px}
.depot-table{width:100%;border-collapse:collapse;font-size:14px}
.depot-table thead th{
  text-align:left;padding:10px 14px;color:var(--text-subtle);
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
  border-bottom:1px solid var(--border)
}
.depot-table tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-dim)}
.depot-table tbody tr{transition:background var(--transition)}
.depot-table tbody tr:hover{background:rgba(255,255,255,0.02)}
.depot-table .dn{color:var(--text);font-weight:600}
.depot-table .da{color:var(--text-dim);font-size:13px}

/* Assembly */
.assembly-wrap{padding:0 28px 28px}
.assembly-list{display:flex;flex-direction:column;gap:10px}
.assembly-item{
  padding:14px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-xs);transition:border-color var(--transition)
}
.assembly-item:hover{border-color:var(--border-hover)}
.assembly-item .ad{font-size:14px;color:var(--text-dim);line-height:1.6}
.assembly-item .ad time{font-size:12px;color:var(--text-subtle);margin-left:8px;white-space:nowrap}

/* Responsive */
@media(max-width:640px){
  .app{padding:24px 12px 60px}
  .header{margin-bottom:28px}
  .header .icon{width:44px;height:44px;line-height:44px;font-size:20px}
  .stats-row{gap:16px}
  .stat{padding:0 12px}
  .stat .num{font-size:22px}
  .search-bar input{font-size:15px;padding:14px 8px}
  .search-bar .prefix{padding-left:14px;font-size:16px}
  .search-bar .btn-search{padding:14px 20px;font-size:14px}
  .card-header{padding:18px 20px}
  .card-header .line-number{font-size:28px}
  .info-section{padding:20px}
  .info-grid{grid-template-columns:1fr 1fr;gap:10px}
  .info-item{padding:14px 16px}
  .info-item .value{font-size:17px}
  .depot-wrap,.assembly-wrap{padding:0 20px 20px}
  .depot-table{font-size:13px}
  .depot-table thead th,.depot-table tbody td{padding:8px 10px}
}

.mode-tab{padding:10px 28px;border:1px solid var(--border);border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition);color:var(--text-dim);background:transparent;font-family:inherit}
.mode-tab:hover{border-color:var(--border-hover);color:var(--text)}
.mode-tab.active{background:var(--accent-dim);border-color:var(--accent-glow);color:var(--accent)}

<body>
<div class="app">
<header class="header">
  <div class="icon">🚌</div>
  <h1>杭州公交<span>线路查询</span></h1>
  <p>公司 · 车队 · 场站 · 公告 一站检索</p>
  <div class="stats-row">
    <div class="stat" id="statLines"><div class="num">-</div><div class="unit">条线路</div></div>
    <div class="stat"><div class="num" id="statCo">-</div><div class="unit">家公司</div></div>
    <div class="stat"><div class="num" id="statDp">-</div><div class="unit">个场站</div></div>
    <div class="stat"><div class="num" id="statAn">-</div><div class="unit">条公告</div></div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-bar">
    <span class="prefix">🔍</span>
    <input type="text" id="q" placeholder="输入线路号，如 147、312、1702..." onkeydown="if(event.key==='Enter')doQuery()" autofocus autocomplete="off">
    <button class="btn-search" onclick="doQuery()">查询</button>
  </div>
  <div class="hint">支持模糊搜索 · 回车即查</div>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" onclick="switchMode('line',this)">线路查询</button>
  <button class="mode-tab" onclick="switchMode('fulltext',this)">全文搜索</button>
</div>

<div id="result"></div>
<div class="empty-state" id="init">
  <div class="ico">📋</div>
  <div class="msg">输入线路号开始查询</div>
</div>
</div>

日起）：147路停驶、312路调整为刘文村北至城站火车站、350路调至德胜东村总站、7032路调整走向、380路调至草庵公交总站、512(B)路改经夏莲路地铁桃源街站","source":"集团","date":"2026-05-21"},{"id":37,"type":"施工","desc":"崇杭街封闭施工公交调整（5月23日起，地铁15号线崇贤站）：7439路临时绕改经来贤路、前村街、崇超南路；\"石塘南\"更名为\"大花桥\"","source":"集团客运管理部","date":"2026-05-21"},{"id":38,"type":"线路","desc":"新增7179路\"5分钟接驳巴士\"（西浦路地铁站至丁香中心）、试运营北山街接驳线（黄龙洞→北山街→黄龙洞，双休节假日开行）、126路调至武林广场东、225路走高架快速路、8193路调至武林广场西-里山桥、1110路调至珠埠里、546/596路增站、5483路恢复、5704路调至地铁客运中心站D口、停驶60C路","source":"集团","date":"2026-05-21"},{"id":39,"type":"站点","desc":"公交停靠站点名称调整（5月25日起）：\"良渚邱家坞\"→\"中国历代绘画大系典藏馆\"（372/1221路）、\"武林广场\"→\"武林广场东\"（8192路）、8259路恢复原线路","source":"集团","date":"2026-05-21"}],"md_docs":{"全部内容汇总":{"sections":[{"title":"杭州公交全部内容汇总","text":"\n> 合并日期：2026-05-08\n> 包含：重要文件汇编 + 近期通知汇总 + 实时调度记录\n\n---\n"},{"title":"第一部分：杭州公交集团2026年度重要文件汇编","text":"\n更新时间：2026-04-26（自动更新）\n\n---\n"},{"title":"一、集团重要会议与战略部署","text":"\n### 1.1 2026年度工作会（2026年1月23日）\n\n杭州市公共交通集团召开2026年度工作、基层党组织书记述职暨\"两保一优\"工作会议。\n\n**参会人员**：集团公司领导班子全体成员、市属国企外部董事、副处级及以上干部、全体中层干部、各分公司（余杭、萧山、钱塘、富阳、临安公司）领导班子成员、杭德公司负责人、受表彰的先进代表及职工代表等。\n\n**主要内容**：\n- 表彰2025年度先进集体与个人\n- 电车分公司、余杭公司、传媒集团党组织书记进行述职\n- 党委委员、副总经理陶雪军作《固本强基提素质 智慧护航新征程 奋力提升企业本质安全水平》安全工作报告\n- 党委副书记、总经理周琮辉作《承压奋进布新局 实干担当开新篇》年度工作报告，围绕五个方向部署2026年工作：\n  - 恪守为民本心，推动品质服务与品牌形象双向升级\n  - 强化精准施策，实现精益管理与产业协同双轮驱动\n  - 稳健运营治理，夯实存量物业与资产盘活双线\n  - 聚焦科技驱动，推进智慧转型与数据价值双翼齐飞\n  - 筑牢思想根基，强化党建引领与人才优势双核赋能\n- 党委书记、董事长孔利华从政治引领、巡察整改、主责主业、改革创新、作风建设、凝心聚力六个方面肯定2025年成绩，提出2026年五点要求\n\n### 1.2 新春第一会（2026年3月3日）\n\n市公交集团召开新春第一会，传达省市\"新春第一会\"精神，部署开局攻坚工作。\n\n**会议主持**：党委副书记、副董事长、总经理周琮辉\n\n**核心部署（\"三个进一步\"）**：\n- 主责主业提质增效，筑牢品质公交民生根基\n- 推动产业协同互促共进，激活生态公交造血动能\n- 深化数智赋能创新突破，打造智慧公交强劲引擎\n- 坚持党建引领强基固本，凝聚保障公交奋进合力\n\n### 1.3 孔利华：2026年发展目标和具体举措（2026年2月6日）\n\n杭州市城投集团党委委员、副总经理，市公交集团党委书记、董事长孔利华接受\"对话一把手\"栏目采访，阐述2026年规划：\n\n**三大关键突破领域**：\n- **产业强企**：科技集团推进轻资产转型；传媒集团深化\"公交+广告+文旅\"融合；出租集团构建\"降本增效、激发活力、拓展边界\"新格局；物产集团深耕物业核心业务\n- **创新立势**：\"5分钟巴士\"扩容至100条线路；推出\"2026公交准时计划\"；推广\"云公交3.0\"（无固定区域、全时段响应模式）；升级车厢内外电子屏，构建实时信息网\n- **改革破局**：完善公司治理结构；推动全流程精益化；做好巡察整改\"后半篇文章\"；深化全面预算管理\n\n**一季度\"开门红\"行动**：\n- \"2026公交准时计划\"作为年度首项重点任务\n- \"5分钟巴士\"一季度末线路规模达65条（全年目标100条）\n- 在萧山、富阳、临安等区域推出20条\"班次时刻化\"线路\n\n**服务品质提升**：\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%；2026年全网推行\n- 适老化适幼化服务：更新无障碍车辆、改造站台设施\n- 智慧出行：迭代\"杭州公共交通\"APP，推出\"公交碳积分\"激励机制\n\n---\n"},{"title":"二、重大采购与招标","text":"\n### 2.1 1208辆纯电动公交车采购项目\n\n**发布时间**：2026年2月4日（招标公告）\n\n**项目规模**：\n- 762辆8米级纯电动城市公交客车及其8年全生命周期维保服务\n- 446辆10米级纯电动城市公交客车及其8年全生命周期维保服务\n- 共计1208辆\n- **总预算超10亿元**\n\n**中标结果**（2026年3月13日发布公示）：\n- **中标候选人**：吉利四川商用车有限公司\n- **中标金额**：约9.58亿元（投标报价95805万元）\n\n### 2.2 杭州之江汽车销售有限公司出租车车载顶灯采购项目（第三次）\n\n**发布时间**：2026年1月19日\n\n---\n"},{"title":"三、运营服务动态","text":"\n### 3.1 春运保障（2026年春节期间）\n\n**夜间服务延长**（2026年2月9日起）：\n- **杭州东站**：33路、43路、93路、108路、123路延长夜间服务；8028路、8179路加班运营（春节前2月9-10日、2月12-15日；春节后2月21-25日）\n- **杭州站（城站）**：290路、8251路延长夜间服务\n- **杭州西站**：468路、8203路延长夜间服务\n\n**\"西站暖巴\"春运服务**：\n- 接站服务：良渚仁和线、闲林线、古荡黄龙线（预约制，通过\"杭州公共交通APP\"预约，最长等待时间不超过30分钟）\n- 送站服务：良渚线、仁和线\n\n### 3.2 春节公交运营（2026年春节期间）\n\n**西湖景区客流数据**：\n- 春节假期（截至2月23日）累计运送乘客330.35万人次，日均客流量为去年同期114.13%\n- 连续刷新客流纪录：\n  - 2月19日（年初三）：45.54万人次\n  - 2月20日（年初四）：48.37万人次\n  - 2月21日（年初五）：50.14万人次\n\n**特色服务**：\n- 推出3条\"跟着《太平年》游杭州\"主题公交线，串联历史景点与特色街区\n- 主题线路累计服务9.8万人次，社交媒体曝光量超8000万次\n\n### 3.3 清明祭扫公交保障（2026年3月起）\n\n**龙居寺扫墓专线**（2026年3月21日起开通）：\n- 起点：地铁3号线华鹤街站D口\n- 终点：龙居寺（千桃园）\n- 票价：1元\n- 运营时间（仅双休日）：\n  - 华鹤街地铁站→龙居寺：首班7:00，末班14:00\n  - 龙居寺→华鹤街地铁站：首班9:00，末班15:30\n- 陵园内设有免费接驳车，为行动不便市民提供上山接送服务\n- 服务热线：851919122\n\n**第二公墓地铁接驳线**：\n- 地铁石马站↔第二公墓\n- 首末班：7:00-15:00 / 7:20-15:20\n- 票价：1元\n\n### 3.4 太子湾郁金香赏花接驳线（2026年3月6日—4月12日）\n\n**郁金香接驳线基础版**（2026年3月3日发布）：\n- **起点**：候潮门地铁站（雄镇楼）\n- **终点**：苏堤南口（雷峰塔）\n- **走向**：候潮门地铁站→江城路→上仓桥路→严官巷→万松岭隧道→美术馆街→南山路→苏堤南口\n- 沿途停靠：净寺（单向，仅开往苏堤南口方向）\n- **运营时间**：候潮门地铁站8:30-15:00；苏堤南口11:00-17:30\n- **票价**：2元/人次，支持IC卡及移动支付\n\n**太子湾3条赏花接驳专线（3月11日增开，与地铁编号对应）**：\n- **太子湾接驳1号线**（周末及节假日）：龙翔桥公交总站（地铁1号线）→苏堤南口，9:30-15:30/10:30-18:30，票价2元\n- **太子湾接驳5号线**（全周开行）：雄镇楼（地铁5号线候潮门站）→苏堤南口，8:30-15:30/11:00-17:30，票价2元\n- **太子湾接驳7号线**（周末及节假日）：吴山广场总站（地铁7号线）→苏堤南口，9:00-15:30/9:30-18:30，票价2元\n\n**出行建议**：工作日可通过地铁5号线换乘接驳5号线，周末建议错峰，亦可选4路、139路等常规公交。\n\n### 3.5 大型活动交通保障（2026年3月22日）\n\n**2026西湖半程马拉松**（3月22日）：\n- 部分道路3月21日22时起管控\n- 赛道管控：3月22日6时起分段管控黄龙路、曙光路、保俶路、北山街、孤山路等\n- 倡议市民优先选择公交出行\n\n**2026临平半程马拉松**（3月22日）：\n- 部分道路3月21日12时起管控\n- 涉及望梅路、迎宾路、藕花洲大街、邱山隧道、荷禹路等\n\n---\n\n### 3.6 周杰伦「烟花杭州·嘉年华」演唱会公交+文旅配套方案（2026年4月1日）\n\n**发文单位：** 杭州公交集团有限公司\n**联动单位：** 杭州市文化广电旅游局\n**活动背景：** 抢抓\"演艺经济\"发展机遇，创新文旅服务供给，助力杭州打造\"演艺之都\"和高水平国际旅游目的地\n\n#### 一、演唱会嗨巴（火车东站直达奥体专线）\n\n| 项目 | 内容 |\n|------|------|\n| **主题车辆** | 浙A06485D（主车）、浙A07150D（备用车） |\n| **始发站** | 杭州火车东站东广场公交总站 |\n| **终点站** | 科技馆街飞鸿路口公交站（奥体中心周边） |\n| **线路走向** | 火车东站东广场公交总站 → 新塘路 → 东宁路 → 昙花庵路 → 空港大道 → 彭埠大桥 → 空港大道 → 平澜路 → 滨盛路隧道 → 扬帆路 → 丹枫路 → 科技馆街飞鸿路口 |\n| **运营日期** | 4月3日、4日、5日（周杰伦杭州演唱会期间，共三天） |\n| **发车时间** | 每日15:00、16:30两个班次定点发车 |\n| **运营特点** | 中途不停站，直达演唱会场馆，\"下高铁到场馆\"无缝衔接 |\n| **推出方** | 杭州公交集团联合杭州市文化广电旅游局 |\n\n#### 二、杰迷专属西湖夜游定制过山车Pro主题观光巴士\n\n| 项目 | 内容 |\n|------|------|\n| **主题车辆** | 浙A05715D、浙A07926D |\n| **始发站** | 奥体开元名都酒店 |\n| **终点站** | 胜利剧院 |\n| **线路走向** | 奥体开元名都酒店 → 奔竞大道 → 江南大道 → 复兴大桥 → 万松岭隧道 → 南山路 → 杨公堤 → 曙光路 → 浙大路 → 玉古路 → 求是路 → 曙光路 → 杨公堤 → 南山路 → 西湖大道 → 延安路 → 开元路 → 浣纱路 → 庆春路 → 延安路 → 胜利剧院 |\n| **运营日期** | 4月3日、4日、5日（周杰伦杭州演唱会期间，共三天） |\n| **发车时间** | 每日晚上22:00左右（提前购票歌迷全上车后发车） |\n| **覆盖亮点** | 西湖夜景精华：杨公堤、南山路、西湖大道、延安路商圈；贯穿万松岭隧道连接奥体与西湖 |\n\n#### 三、与清明保障叠加分析（4月4-6日）\n\n**客流叠加区域：**\n- **奥体中心**：演唱会三天（4月3-5日）与清明假期（4月4-6日）重叠，预计4月4-5日客流量达峰值\n- **杭州东站**：演唱会散场返程客流 + 清明祭扫返程客流叠加；33/43/93/108/123/8028/8179路已加密备勤\n- **西湖景区**：夜游巴士覆盖南山路、杨公堤等路段，预计清明旅游客流较高\n\n**演唱基本信息（补充）：**\n- **演出时间：** 2026年4月3日、4日、5日（清明小长假三天）\n- **演出地点：** 杭州奥体中心体育场（\"大莲花\"）\n- **演出主题：** 「烟花杭州·嘉年华」2026世界巡回演唱会\n- **门票：** 780元-2380元；2月25日开票，24万张1分钟内售罄\n\n#### 四、531M路临时调整通知（2026年4月3日）\n\n**调整原因：** 扬帆路、科技馆街演唱会封道\n\n**调整后路线：** 新中北家园中 ⇆ 扬帆路丹枫路口北\n\n**新中北家园中往科技馆街飞虹路口方向：**\n- 绕道：丹枫路 → 机场城市大道 → 滨盛路 → 循原线路\n- **临时撤销站点：** 扬帆路丹枫路口北、奥体街飞虹路口、科技馆街飞虹路口（共3个站点）\n\n**科技馆街飞虹路口方向往新中北家园中方向：**\n- 循原线路开行\n- **临时撤销站点：** 科技馆街飞虹路口、奥体街飞虹路口（共2个站点）\n\n**执行日期：** 2026年4月3日至5日（演唱会期间）\n\n---\n"},{"title":"四、智慧公交与科技创新","text":"\n### 4.1 自动驾驶公交\n\n**杭州公交大模型**：\n- 杭州市公交集团于2025年建成全国首个公交大模型，依托杭州城投基座模型，接入多维度专有数据\n- 实现安全画像生成、下客客流精准分析等功能\n\n**钱塘区自动驾驶公交**（2026年3月19日起试运行）：\n- 杭州市首批持证上路的载客自动驾驶公交\n- 开通2条线路，投入5辆自动驾驶巴士\n  - 一条工作日开行\n  - 一条双休日及节假日开行\n- 预约方式：现场扫码或小程序搜索\"钱塘区智能网联巴士\"预约\n- 票价：免费\n- 计划增设3条新线路，覆盖文旅景区、高教园区等区域\n\n**滨江白马湖线智能环线**（2026年2月10日正式载客运营）：\n- 线路里程：8.6公里\n- 运营时间：每日8:30-18:30\n- 核心站点：白马湖南站、白马湖北站、地铁聚才路D口公交站、滨康路长江路口站\n- 车辆：3台L4级无人小巴循环运行\n- 自动驾驶覆盖率：85%以上路段\n- 背景：2025年10月起空车测试，累计安全运行超8000公里、488小时\n\n**战略合作**（2026年3月20日）：\n- 武汉元光与杭州数知梦订立战略合作框架协议，在公交自动驾驶领域开展深度合作\n\n### 4.2 智慧服务升级\n\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%\n- \"云公交3.0\"：无固定区域、全时段响应模式\n- 车厢内外电子屏升级：构建\"车外—车内—站台—掌上\"实时信息网\n- \"公交碳积分\"激励机制\n\n---\n"},{"title":"五、公交线网优化","text":"\n### 5.1 2026年主要优化方向\n\n- \"5分钟巴士\"全年目标100条线路（一季度65条）\n- \"班次时刻化\"线路：萧山、富阳、临安等区域推出20条，实现班次可查可预期\n- 响应式停靠：2026年全网推行，对10公里以上长线路实行\"分区段计时\"机制\n\n### 5.2 历年延续服务\n\n- 每年清明、冬至期间开通多条扫墓地铁接驳线和扫墓快线\n- \"西站暖巴\"等定制客运服务持续运营\n\n---\n"},{"title":"六、政策与行业规划","text":"\n### 6.1 杭州市交通运输局2026年工作重点（与公交相关）\n\n- **公交优先**：构建\"地铁+快速接驳线+高频骨干线\"多元网络，优化地铁接驳线，新增\"类地铁\"公交线路\n- **交旅融合**：打造杭黄跨省航线，升级景区直达、高校假日等定制客运服务\n- **智慧交通**：持续推进\"人工智能+交通运输\"，深化智能网联汽车试点\n- **绿色交通**：全面推广新能源交通工具，创建\"交能融合示范区\"\n- **低空经济**：设立低空交通运行管理机构，推进无人机公共起降场建设\n\n---\n"},{"title":"七、2026年3月-4月线路具体调整明细","text":"\n### 7.1 3月26日线路调整\n\n**发布日期**：2026年3月24日\n\n**新开通：**\n- **1418路**（\"5分钟巴士\"，工作日高峰运营）\n  - 起讫点：燕庐巷口/地铁科海路站 ↔ 地铁科海路站/青蓝路北\n  - 早高峰：燕庐巷口出发，6:45-9:00，间隔约7分钟\n  - 晚高峰：地铁科海路站出发，17:05-19:00，间隔约7分钟\n  - 票价：1元\n\n**调整线路：**\n- **3路**（大关小区总站↔南落马营总站）：终点延伸至南落马营总站，新增西湖文化广场、候潮东路秋涛路口等停靠站；21时后短途折返至市三医院北\n- **9路**（火车东站西↔化仙桥南）：走向调整，经皋塘二路口折返后绕行，撤销皋塘东等站，新增骏塘名庭北/南等站\n- **345路**：\"欢中路临丁路口\"与\"长睦锦苑\"之间新增\"周杨村\"双向停靠站\n- **533路**：撤销往浙医二院方向的\"浙医二院正门\"单向停靠站\n\n### 7.2 3月28日线路调整\n\n**发布日期**：2026年3月25日\n\n**新开通：**\n- **1102H路**（仅限青少年宫上课期间运营）\n  - 起讫点：地铁独城生态公园站 ↔ 杭州青少年宫半山分中心\n  - 走向：经平炼东路、康园南路、炼铁街运行，途经杭钢公园1号高炉\n  - 运营时段：8:00-10:00，12:40-16:20（地铁侧）；8:10-9:50，12:30-16:30（青少年宫侧）\n  - 票价：1元\n  - 背景：配合大运河杭钢公园杭州青少年宫半山分中心启用\n\n**调整线路：**\n- **1213路**（三墩景溪南苑总站↔浙江医院三墩院区）：撤销开往三墩景溪南苑总站方向\"广业街墩池路口\"1只单向停靠站\n\n### 7.3 3月27日线路调整（施工临时绕行）\n\n**发布日期**：2026年3月26日\n\n**调整线路：**\n- **96路**（将军路东 ↔ 西陵路南环路口）：因江陵路跨铁立交桥施工，江陵路南环路口交通组织调整\n  - 将军路东出发方向：原线行驶至江陵路后，改经聚园路→聚业路→南环路→西陵路南环路口\n  - 返程方向不变\n  - 沿途站点均不撤销\n  - **背景**：江陵路跨铁立交桥施工期间临时调整\n  - **生效日期**：2026年3月27日起（长期）\n\n### 7.4 3月28日、4月10日清江路施工临时调整\n\n**发布日期**：2026年3月27日\n\n**调整线路：**\n- **64路**（大关小区总站 ↔ 近江一园）：3月28日23:00至次日06:00\n  - 绕行：解放东路 → 富春路 → 婺江路 → 之江路 → 衢江路\n  - 撤销：地铁市民中心站N口、景江城市花园东门、之江路衢江路口\n  - 雨天顺延\n\n- **9路**（火车东站西 ↔ 化仙桥南）：4月10日-12日每日23:00至次日06:00\n  - 绕行：钱江路 → 城星路 → 富春路 → 衢江路\n  - 撤销：钱江路城星路口、钱江路衢江路口\n  - 雨天顺延\n\n- **29路**（艮山门东站 ↔ 候潮东路富春路口）：4月10日-12日每日23:00至次日06:00\n  - 绕行：清江路 → 秋涛路 → 婺江路 → 富春路\n  - 撤销（单向）：观音塘思安坊、清静弄、近江小区、近江六园\n  - 雨天顺延\n\n- **执行要求**：二公司负责4月11日-13日05:30起现场管理（钱江路城星路口、秋涛路清江路口）\n\n### 7.5 3月29日起线路调整\n\n**发布日期**：2026年3月27日\n\n**调整线路：**\n- **398路**（翁梅公交总站 ↔ 笕桥公交总站）：2026年3月29日起恢复\n  - 原因：葛家车村保通便道具备通车功能\n  - 撤销：五星村、和睦村（2对站）\n  - 增设11对/只站：西何家（下行）、博卡路何家（下行）、葛家车十五组、葛家车村口、老葛家村、吴家车、葛家车村、大井、和睦桥路口、五星村工业园区、青石庙\n  - 线路长度：下行13.6KM，上行12.5KM\n\n- **青少年宫地铁接驳专线**：2026年3月30日起调整发车时间\n  - 起点：青少年宫北门（双休、节假日运营）\n  - 发车间隔：\n    - 8:10-10:10：≤15分\n    - 10:10-11:30：≤10分\n    - 11:30-16:30：≤15分\n    - 16:30-18:20：≤10分\n  - 末班时间：18:20\n\n### 7.6 2026年清明假期公交运营保障\n\n**发文单位：** 杭州市公共交通集团有限公司\n**发文日期：** 2026年3月26日\n**假期时间：** 4月4日至4月6日\n**客流预测：** 全市预计运送乘客500万人次，较去年同期增长1.03%\n**天气：** 晴好，气温舒适宜人\n**客流特点：** 祭扫客流集中、旅游客流暴涨、短途出行密集\n**高峰时段：** 墓区早7点至中午12点；景区全天高峰\n\n**重点景区：** 太子湾公园、雷峰塔、杨公堤、灵隐寺、龙井、九溪、翁家山、梅家坞、龙坞\n\n#### 重点保障区域与责任分工\n\n| 区域 | 责任单位 | 重点任务 |\n|------|----------|----------|\n| 龙井/梅家坞 | 汽一分公司 | 增开龙井至古墩路地铁站接驳线 |\n| 闸口/黄龙洞 | 汽二分公司 | 87路双区间运力、103/1314路区间平衡 |\n| 灵隐/雷峰塔 | 电车分公司 | WE1314路、西湖外环线、灵隐至雷峰塔专线加密 |\n| 太子湾/苏堤 | 汽五分公司 | 太子湾接驳1号线、龙翔桥至苏堤运力 |\n\n#### 扫墓公交接驳线（11条，覆盖9座公墓）\n\n**地铁接驳线（6条）：**\n\n| 序号 | 线路 | 起讫点 | 首末班 | 间隔 | 票价 | 开行日期 | 经营单位 |\n|------|------|--------|--------|------|------|----------|----------|\n| 1 | 钱江陵园地铁接驳线 | 地铁双浦站-钱江陵园 | 7:15-14:30 | 30分 | 0-11:30：发车间隔不大于10分\n    - 11:30-16:30：发车间隔不大于15分\n    - 16:30-18:20：发车间隔不大于10分\n  - 青少年北门末班时间调整为18:20\n"},{"title":"4. 关于临时调整清江路部分路线走向的通知","text":"\n- **来源**: 关于临时调整清江路部分路线走向的通知.doc\n- **生效日期**:\n  - 64路：2026年3月28日23时至次日6时\n  - 9路、29路：2026年4月10日-12日每天23时至次日6时\n- **原因**: 清江路之江路口、清江路钱江路口高架桥梁拆卸施工\n- **调整方案**:\n  - **64路**（3月28日23时至次日6时）:\n    - 大关小区总站始发：临时撤销地铁市民中心站N口、景江城市花园东门、之江路衢江路口3只停靠站\n  - **9路**（4月10日-12日每天23时至次日6时）:\n    - 临时撤销钱江路城星路口、钱江路衢江路口2对停靠站\n  - **29路**（4月10日-12日每天23时至次日6时）:\n    - 临时撤销观音塘思安坊、清静弄、近江小区、近江六园4只单向停靠站\n- **相关要求**:\n  1. 加强宣传，做好安全行车和优质服务工作，让司机熟悉路线\n  2. 加强宣传引导，落实车厢通告\n  3. 二公司落实4月11日-13日5:30至施工结束钱江路城星路口、秋涛路清江路口2个点位现场管理\n\n---\n"},{"title":"第四部分：实时调度系统页面记录","text":"\n*来源：实时调度页面记录.md，记录时间: 2026-04-08 00:36*\n**URL**: https://dispatching-new.ibuscloud.com/?_orgId=21\n**登录账号**: 邱滨彬（杭州公交集团公司）\n"},{"title":"页面结构","text":"\n### 顶部导航/标签\n- 实时监控\n- 数据统计\n- 参数配置\n- 操作日志\n- 智能调度\n\n### 线路配置（左侧线路列表）\n\n```\n35路、111路、1771路、1702路、1612路、1605路、1709路、298路、8071、1009路、5701路、8212路、圣奥望月府专线、邵逸夫医院双菱院区至钱塘院区接驳线、邵逸夫医院下沙院区、庆春邵逸夫专线、7029路、8210路、305路、1793路、225路、1706路、1710路、325路、358路、394路、文海实验求知专线、下沙云滨湾小区至文清小学、文澜中学求知专线、动物园至地铁水澄桥、龙翔桥站专线（五）、五公司交通车、九华路海普路口至宣家埠三区临时通勤线、三村农贸市场至九堡临时接驳线\n```\n\n### 行车记录表（主内容区）\n\n**数据分类筛选**：全部 / 营运 / 非营运 / 加班 / 故障 / 已完成 / 未完成 / 缺班 / 非缺班\n**搜索框**：搜索班别/车辆/司机\n**当前选中车队**：802车队\n\n**表头字段**：班别 | 车辆 | 车长 | 司机 | 到本站 | 停站时间 | 间隔 | 计划发车 | 调度发车 | 实际发车 | 正点 | 实际间隔 | 实际单程时间 | 准点 | 调度单程时间 | 发车/完成 | 调度措施 | 调度到达 | 实际到达 | 起点站 | 终点站 | 操作人 | 定额里程 | 运送人次 | 车牌号\n\n### 行车记录示例（35路-802车队）\n\n#### 去程（上行）：九和路公交停车场 → 吴山广场北②\n\n| 班别 | 车辆 | 车长 | 司机 | 计划发车 | 调度发车 | 实际发车 | 正点 | 实际间隔 | 实际单程 | 起点站 | 终点站 | 定额里程 | 运送人次 | 车牌号 |\n|------|------|------|------|----------|----------|----------|------|----------|----------|---------|---------|----------|----------|--------|\n| 2 | 8-6226 | 8米 | 李现鹏 | 05:20 | 05:20 | 05:15 | +5 | 32 | 40 | 九和路公交停车场 | 吴山广场北② | 15.3 | 0 | 浙A05610D |\n| 8 | 8-6232 | 8米 | 王新亮 | 05:21 | 05:21 | 05:01 | +20 | 8 | 9 | 九和路公交停车场 | 开创街药香路口 | 3.3 | 0 | 浙A05368D |\n| 8 具体举措（2026年2月6日）\n\n杭州市城投集团党委委员、副总经理，市公交集团党委书记、董事长孔利华接受\"对话一把手\"栏目采访，阐述2026年规划：\n\n**三大关键突破领域**：\n- **产业强企**：科技集团推进轻资产转型；传媒集团深化\"公交+广告+文旅\"融合；出租集团构建\"降本增效、激发活力、拓展边界\"新格局；物产集团深耕物业核心业务\n- **创新立势**：\"5分钟巴士\"扩容至100条线路；推出\"2026公交准时计划\"；推广\"云公交3.0\"（无固定区域、全时段响应模式）；升级车厢内外电子屏，构建实时信息网\n- **改革破局**：完善公司治理结构；推动全流程精益化；做好巡察整改\"后半篇文章\"；深化全面预算管理\n\n**一季度\"开门红\"行动**：\n- \"2026公交准时计划\"作为年度首项重点任务\n- \"5分钟巴士\"一季度末线路规模达65条（全年目标100条）\n- 在萧山、富阳、临安等区域推出20条\"班次时刻化\"线路\n\n**服务品质提升**：\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%；2026年全网推行\n- 适老化适幼化服务：更新无障碍车辆、改造站台设施\n- 智慧出行：迭代\"杭州公共交通\"APP，推出\"公交碳积分\"激励机制\n\n---\n"},{"title":"二、重大采购与招标","text":"\n### 2.1 1208辆纯电动公交车采购项目\n\n**发布时间**：2026年2月4日（招标公告）\n\n**项目规模**：\n- 762辆8米级纯电动城市公交客车及其8年全生命周期维保服务\n- 446辆10米级纯电动城市公交客车及其8年全生命周期维保服务\n- 共计1208辆\n- **总预算超10亿元**\n\n**中标结果**（2026年3月13日发布公示）：\n- **中标候选人**：吉利四川商用车有限公司\n- **中标金额**：约9.58亿元（投标报价95805万元）\n\n### 2.2 杭州之江汽车销售有限公司出租车车载顶灯采购项目（第三次）\n\n**发布时间**：2026年1月19日\n\n---\n"},{"title":"三、运营服务动态","text":"\n### 3.1 春运保障（2026年春节期间）\n\n**夜间服务延长**（2026年2月9日起）：\n- **杭州东站**：33路、43路、93路、108路、123路延长夜间服务；8028路、8179路加班运营（春节前2月9-10日、2月12-15日；春节后2月21-25日）\n- **杭州站（城站）**：290路、8251路延长夜间服务\n- **杭州西站**：468路、8203路延长夜间服务\n\n**\"西站暖巴\"春运服务**：\n- 接站服务：良渚仁和线、闲林线、古荡黄龙线（预约制，通过\"杭州公共交通APP\"预约，最长等待时间不超过30分钟）\n- 送站服务：良渚线、仁和线\n\n### 3.2 春节公交运营（2026年春节期间）\n\n**西湖景区客流数据**：\n- 春节假期（截至2月23日）累计运送乘客330.35万人次，日均客流量为去年同期114.13%\n- 连续刷新客流纪录：\n  - 2月19日（年初三）：45.54万人次\n  - 2月20日（年初四）：48.37万人次\n  - 2月21日（年初五）：50.14万人次\n\n**特色服务**：\n- 推出3条\"跟着《太平年》游杭州\"主题公交线，串联历史景点与特色街区\n- 主题线路累计服务9.8万人次，社交媒体曝光量超8000万次\n\n### 3.3 清明祭扫公交保障（2026年3月起）\n\n**龙居寺扫墓专线**（2026年3月21日起开通）：\n- 起点：地铁3号线华鹤街站D口\n- 终点：龙居寺（千桃园）\n- 票价：1元\n- 运营时间（仅双休日）：\n  - 华鹤街地铁站→龙居寺：首班7:00，末班14:00\n  - 龙居寺→华鹤街地铁站：首班9:00，末班15:30\n- 陵园内设有免费接驳车，为行动不便市民提供上山接送服务\n- 服务热线：851919122\n\n**第二公墓地铁接驳线**：\n- 地铁石马站↔第二公墓\n- 首末班：7:00-15:00 / 7:20-15:20\n- 票价：1元\n\n### 3.4 太子湾郁金香赏花接驳线（2026年3月6日—4月12日）\n\n**郁金香接驳线基础版**（2026年3月3日发布）：\n- **起点**：候潮门地铁站（雄镇楼）\n- **终点**：苏堤南口（雷峰塔）\n- **走向**：候潮门地铁站→江城路→上仓桥路→严官巷→万松岭隧道→美术馆街→南山路→苏堤南口\n- 沿途停靠：净寺（单向，仅开往苏堤南口方向）\n- **运营时间**：候潮门地铁站8:30-15:00；苏堤南口11:00-17:30\n- **票价**：2元/人次，支持IC卡及移动支付\n\n**太子湾3条赏花接驳专线（3月11日增开，与地铁编号对应）**：\n- **太子湾接驳1号线**（周末及节假日）：龙翔桥公交总站（地铁1号线）→苏堤南口，9:30-15:30/10:30-18:30，票价2元\n- **太子湾接驳5号线**（全周开行）：雄镇楼（地铁5号线候潮门站）→苏堤南口，8:30-15:30/11:00-17:30，票价2元\n- **太子湾接驳7号线**（周末及节假日）：吴山广场总站（地铁7号线）→苏堤南口，9:00-15:30/9:30-18:30，票价2元\n\n**出行建议**：工作日可通过地铁5号线换乘接驳5号线，周末建议错峰，亦可选4路、139路等常规公交。\n\n### 3.5 大型活动交通保障（2026年3月22日）\n\n**2026西湖半程马拉松**（3月22日）：\n- 部分道路3月21日22时起管控\n- 赛道管控：3月22日6时起分段管控黄龙路、曙光路、保俶路、北山街、孤山路等\n- 倡议市民优先选择公交出行\n\n**2026临平半程马拉松**（3月22日）：\n- 部分道路3月21日12时起管控\n- 涉及望梅路、迎宾路、藕花洲大街、邱山隧道、荷禹路等\n\n**2026富阳半程马拉松**（4月19日周日）：\n- 赛事规模：约10000人\n- 比赛路线（21.0975公里）：富阳区文化中心(起点)→江滨西大道→恩波大道→桂花路→花坞路→龙浦街→富春江第一大桥→大桥南路→洋浦路→江滨南大道→江滨南大道(折返)→望江路辅道→富阳大桥→江滨西大道→富阳区文化中心(终点)\n\n**赛道管制时间（参考）**：\n| 路段 | 管控开始 | 预计解除 |\n|------|----------|----------|\n| 江连街（依江路至江滨西大道） | 4月18日18时 | 赛事结束后 |\n| 江滨西大道（惠泽街至望波街） | 4月18日20时 | 赛事结束后 |\n| 恩波大道（富春街至桂花路） | 4月19日6:30 | 8:35 |\n| 富春江第一大桥 | 4月19日7:20 | 9:20 |\n| 江滨南大道（洋浦路至望江路辅路） | 4月19日7:30 | 10:28 |\n\n**涉及调整线路**：28条（25条调整+3条停运）\n\n**4月18日15时起（江连街南口封闭，3条）：**\n- 611路：鹳山公园始发，自14:20起调整为循原线至江波街，经江滨西大道后循原线至富阳区文化中心。富阳区文化中心始发不变。\n- 615路：富阳区第一人民医院始发，自14:30起调整为循原线至依江路，经江波街、江滨西大道后循原线至富阳区文化中心。富阳区文化中心始发不变。\n- 628路：富阳客运南站始发，自16:00起调整为循原线至江波街，经江滨西大道后循原线至富阳区文化中心。富阳区文化中心始发不变。\n\n**4月18日18时起（江连街全幅管制，5条）：**\n- 611路：自17:10开始始发站富阳区文化中心调整为依江路江连街口富阳区行政服务中心。鹳山公园始发，循原线至依江路，经依江路至依江路江连街口富阳区行政服务中心。依江路江连街口富阳区行政服务中心（北向南方向）始发，经依江路、江波街、龙江路、望波街后循原线至鹳山公园。\n- 615路：自17:00开始富阳区第一人民医院至富阳区文化中心调整为富阳区第一人民医院至依江路北口（富阳区文化中心不发车）。富阳区第一人民医院始发，循原线至依江路北口。依江路北口始发，经依江路、金鹿路、江滨西大道后循原线（富阳区文化中心→富阳区第一人民医院）至富阳区第一人民医院。\n- 619路：自17:00开始永和大厦至富阳区文化中心调整为永和大厦至江波街依江路口（富阳区文化中心不发车）。永和大厦始发，循原线至江波街依江路口。江波街依江路口始发，经江波街、江滨西大道、惠泽街、依江路后循原线（富阳区文化中心→永和大厦）至永和大厦。\n- 626路：自17:05开始文居街公交站至富阳区文化中心调整为文居街公交站至东吴小学（富阳区文化中心不发车）。文居街公交站始发，循原线至东吴小学。东吴小学始发，经龙江路、江枫路、依江路、儒风街、龙江路后，循原线（富阳区文化中心→文居街公交站）至文居街公交站。\n- 655路：自16:50开始东洲公交总站至富阳区文化中心调整为东洲公交总站至江滨西大道金鹿路口（富阳区文化中心不发车）。东洲公交总站始发，循原线至江滨西大道金鹿路口。江滨西大道金鹿路口始发，经江滨西大道、望波街、依江路、江滨西大道后，循原线（富阳区文化中心→东洲公交总站）至东洲公交总站。\n\n**4月19日赛道管控期间（26条，23条调整+3条停运）：**\n\n1. 500路：城站火车站始发，自首班起调整为循原线至站点大坞坑后，在江滨东大道红绿灯处掉头折返，循原线（富阳客运南站→城站火车站）至城站火车站。在站点大坞坑（双向）蓄车等待开往城站火车站。富阳客运南站6:50后不发车。\n   - 撤销建设村、大桥南路永济路口2对站点及富阳客运南站首末站。\n\n2. 601路：大青油树坞始发，自首班起调整为循原线至站点桂花西路西堤路口后，在桂花西路与苋浦路交叉口处掉头后，循原线（鹳山公园→大青油树坞）至大青油树坞；鹳山公园始发方向6:10后不发车。\n   - 撤销恩波二桥（单边）、恩波广场（单边）、郁达夫公园、富阳区实验小学4对（只）站点及鹳山公园首末站。\n   - 601B路（富阳实验中学5:50起调整走向）、富阳区第三人民医院接驳线（鹳山公园7:30不发车）与601路调整方式一致。\n\n3. 602路：富阳客运西站始发，自首班起调整为循原线至龙浦街，经达夫路、大桥路、花坞桥、龙浦街后，循原线（鹳山公园→富阳客运西站）至富阳客运西站；鹳山公园始发方向6:10后不发车。\n   - 撤销龙浦街达夫路口（单边）、龙浦街幸福北路口（单边）、富阳区影剧院、富阳区中医院4对（只）站点及鹳山公园首末站；新增小垄桥（单边）、花坞桥（单边）2只站点。\n\n4. 605路：富阳客运西站始发，自首班起调整为循原线至龙浦街，经达夫路、大桥路、花坞桥、龙浦街后，循原线（富阳客运南站→富阳客运西站）至富阳客运西站；高铁富阳站始发方向7:00后不发车。\n   - 撤销龙浦街达夫路口（单边）、龙浦街幸福北路口（单边）、江南中学（中沙村）、建设村、大桥南路永济路口、民主村、富阳客运南站、春江街道办、省人民医院富阳院区、大桥南路同登路口10对（只）站点及高铁富阳站首末站；新增小垄桥（单边）、花坞桥（单边）2只站点。\n\n5. 606路：富阳区第一人民医院始发，自首班起调整为循原线至站点花坞桥后，在大桥路与花坞路交叉口处掉头后，循原线（高铁富阳站→富阳区第一人民医院）至富阳区第一人民医院；高铁富阳站始发，自6:20起调整为循原线至站点民主村后，在大桥南路与永济路交叉口处掉头后，循原线（富阳区第一人民医院→高铁富阳站）至高铁富阳站。\n   - 撤销江南中学（中沙村）、建设村、大桥南路永济路口（单边）3对（只）站点。\n\n6. 607路：富阳客运西站始发，自6:30起调整为循原线至龙浦街，经达夫街、大桥路、花坞桥、龙浦街后，循原线（富阳客运南站→富阳客运西站）至富阳客运西站；富阳客运南站始发方向7:00不发车。\n   - 撤销龙浦街达夫路口（单边）、龙浦街幸福北路口（单边）、江南中学（中沙村）、建设村、大桥南路永济路口、民主村6对（只）站点及富阳客运南站首末站；新增小垄桥（单边）、花坞桥（单边）2只站点。\n\n7. 611路：自首班起，始发站富阳区文化中心调整为依江路江连街口富阳区行政服务中心。依江路江连街口富阳区行政服务中心（北向南方向）始发，经依江路、江波街、龙江路、望波街后循原线至站点桂花西路西堤路口后，在桂花西路与苋浦路交叉口处掉头后，循原线（鹳山公园→富阳区文化中心）至金鹿路，经依江路至依江路江连街口富阳区行政服务中心。鹳山公园始发方向不发车。\n   - 撤销富阳区中医院、富阳区政府、江连街江滨西大道口（招呼站）、依江路江连街口富阳区行政服务中心（单边）、富阳区门球馆（单边）、富阳大桥西（单边）、龙江路江波街口（单边）7对（只）站点及富阳区文化中心、鹳山公园2只首末站。新增东吴社区（单边）1只站点及依江路江连街口富阳区行政服务中心首末站。\n\n8. 611B路：自首班起调整为水印林语西始发，循原线至站点二贸市场后，在桂花西路与苋浦路交叉口处掉头后，循原线（鹳山公园→水印林语西）至水印林语西。\n   - 撤销富阳区政府1对站点及鹳山公园首末站。\n\n9. 612路：自首班起调整为阳陂湖公交站始发，循原线至站点桂花西路西堤路口后，在桂花西路与苋浦路交叉口处掉头后，循原线（小花坞公交站→阳陂湖公交站）至阳陂湖公交站；小花坞公交站始发方向不发车。\n   - 撤销富阳区政府、富阳区影剧院2对站点及小花坞公交站首末站。\n\n10. 614路：自首班起调整为永和大厦始发、循原线至文教路，经华庭路、鹿山大道、江枫路至江滨西大道后循原线至汤家埠；汤家埠始发循原线至江滨西大道，经江枫路、鹿山大道、华庭路、文教路后循原线至永和大厦。\n    - 撤销富阳区文化中心、富阳区门球馆（单边）、江滨西大道金鹿路口、江滨西大道依江路口、东吴公园、华庭路文教路口6对（只）站点；新增谢家溪、场口中学、陆家村桥头、陆家村、鹿山大道华庭路口5对（只）站点。\n\n11. 615路：自首班起调整为富阳区第一人民医院始发，循原线至西堤南路，经华庭路、鹿山大道、望波街、依江路、江波街、鹿山大道、华庭路、西堤南路后循原线（富阳区文化中心→富阳区第一人民医院）至富阳区第一人民医院。富阳区文化中心始发方向不发车。\n    - 撤销东吴公园、江滨西大道依江路口、依江路北口、富阳大桥西（单边）、江连街江滨西大道口（招呼站）、富阳区门球馆（单边）6对（只）站点及富阳区文化中心首末站。新增依江路江连街口富阳区行政服务中心（单边）、场口中学北门（单边）、场口中学（单边）、陆家村桥头（单边）、陆家村、鹿山大道华庭路口6对（只）站点。\n\n12. 616路：富阳客运西站始发，循原线至大浦闸站点后，在恩波大道与桂花西路交叉口处掉头折返，循原线（鹳山公园→富阳客运西站）至富阳客运西站；鹳山公园始发方向6:10后不发车。\n    - 撤销富阳区政府、富阳区中医院2对站点及鹳山公园首末站。\n\n13. 618路：自首班起调整为富阳公交总站始发，循原线至站点花坞桥后，在大桥路与花坞桥交叉口处掉头折返，循原线（鸣翠桃源→富阳公交总站）至富阳公交总站；鸣翠桃源始发方向不发车。\n    - 撤销富阳区影剧院、富阳区中医院、鹳山公园、富阳区实验小学、郁达夫公园、恩波二桥、陈家弄口、江滨西大道江堤路口、春江花园南（单边）、天河富春湾南（单边）、天河花苑南、华庭路文教路口12对（只）站点及鸣翠桃源首末站。\n\n14. 619路：自首班起调整为永和大厦始发，循原线至文教路，经华庭路、鹿山大道、望波街、依江路、江波街、鹿山大道、华庭路、文教路后，循原线（富阳区文化中心→永和大厦）至永和大厦。富阳区文化中心始发方向不发车。\n    - 撤销华庭路文教路口、东吴公园、江滨西大道依江路口、依江路北口、富阳大桥西（单边）、依江路江连街口富阳区行政服务中心（单边）、江波街依江路口7对站点及富阳区文化中心首末站。新增场口中学北门（单边）、场口中学（单边）、陆家村桥头（单边）、陆家村、鹿山大道华庭路口5对（只）站点。\n\n15. 623路：自首班起调整为富阳客运西站始发，循原线至站点场口中学后，在鹿山大道与江波街交叉口处掉头折返，循原线（高铁富阳站→富阳客运西站）至富阳客运西站；高铁富阳站始发，循原线至站点临江西后在无名路掉头折返，随后循原线（富阳客运西站→高铁富阳站）至高铁富阳站。\n    - 撤销富阳大桥南、富源、富阳大桥西、依江路江连街口富阳区行政服务中心、场口中学北门5对站点。\n\n16. 626路：自首班起调整为文居街公交站始发，循原线至金桥南路，经鹿山大道、望波街、依江路、江枫路、龙江路、望波街、鹿山大道、金桥南路后循原线（富阳区文化中心→文居街公交站）至文居街公交站。富阳区文化中心始发方向不发车。\n    - 撤销富阳区水厂（建设局）、天河富春湾西（单边）、春江花园南（单边）、天河花苑南、东吴公园、江滨西大道依江路口、依江路北口、东吴小学（单边）、龙江路江波街口（单边）、东吴社区（单边）10对（只）站点及富阳区文化中心首末站。新增金桥南路天河路口（单边）、鹿山大道华庭路口、陆家村、富阳大桥西（单边）、依江路江连街口富阳区行政服务中心（单边）5对（只）站点。\n\n17. 627路：自首班起调整为民康街西环北路口始发，循原线至站点大浦闸后，在恩波大道与桂花西路交叉口处掉头折返，循原线（鹳山公园→民康街西环北路口）至民康街西环北路口；鹳山公园始发方向6:15后不发车。\n    - 撤销恩波广场（单边）、郁达夫公园、富阳区实验小学3对（只）站点及鹳山公园首末站。\n\n18. 628路：自首班起调整为富阳客运南站始发，循原线至田丰新村站点后，在田建线掉头折返，循原线（富阳区文化中心→富阳客运南站）至富阳客运南站；富阳区文化中心始发方向不发车。\n    - 撤销东吴社区、龙江路江波街口、依江路江连街口富阳区行政服务中心3对站点及富阳区文化中心首末站。\n\n19. 637路：自6:30后调整为灵桥公交站始发，循原线至站点民主村后，在大桥南路与永济路交叉口处掉头后，循原线（富阳客运西站→灵桥公交站）至灵桥公交站。富阳客运西站始发方向6:40不发车。\n    - 撤销大桥南路永济路口（单边）、建设村、江南中学（中沙村）、富阳区影剧院、富阳区中医院、鹳山公园、富阳区实验小学、郁达夫公园、恩波二桥、陈家弄口、体育馆路回春路口、体育馆路田园路口、文教西苑、金桥南路（单边）、地铁桂花西路站C口（单边）、地铁桂花西路站（B·C）、富阳区妇保医院17对（只）站点及富阳客运西站首末站。\n\n20. 638路快线：自首班起调整为灵桥公交站始发，循原线至站点富阳客运南站后，在大桥南路与春南路交叉口掉头后，循原线（文居街东兴路口→灵桥公交站）至灵桥公交站；文居街东兴路口始发方向不发车。\n    - 撤销龙浦街幸福北路口、龙浦街达夫路口、富阳区商业城（单边）、恩波大道光明路口、恩波大道孙权路口5对（只）站点及文居街东兴路口首末站。\n\n21. 640路：自首班起调整为受降公交站始发，循原线至望波街，经依江路、金鹿路后循原线（富阳区文化中心→受降公交站）至受降公交站。富阳区文化中心始发方向不发车（富阳区文化中心首班7:00调整至金鹿路依江路口发车至受降公交站，其余班次均不发车）。\n    - 撤销富阳大桥西（单边）及富阳区文化中心首末站。\n\n22. 654路：自首班起调整为东洲公交总站始发，循原线至站点大坞坑后，在江滨东大道红绿灯处掉头折返，循原线（高铁富阳站→东洲公交总站）至东洲公交总站；高铁富阳站始发方向不发车。\n    - 撤销江南中学（中沙村）、建设村、大桥南路永济路口、民主村、富阳客运南站、春江街道办、省人民医院富阳院区、大桥南路同登路口8对站点及高铁富阳站首末站。\n\n23. 659路：自首班起调整为富阳客运西站始发，循原线至龙浦街，经花坞路、大桥路、江滨东大道后循原线至东洲公交总站；东洲公交总站始发，循原线至江滨东大道，经大桥路、花坞路、龙浦街后循原线至富阳客运西站。（不涉及站点调整）\n\n24. 655路停驶。\n\n25. 2117路停驶。\n\n26. 604路停驶。\n\n**接驳保障**：\n- 桂花西路地铁站C口蓄车7辆（运动员上车站点）\n- 文化中心停车场（运动员完赛终点）\n- 儒风街蓄车点：40辆运动员接驳车+7辆志愿者接驳车+6辆短驳车\n\n---\n\n### 3.6 线路站点调整（2026年4月）\n\n**来源：** 集团客运管理部《关于调整57、68、85路等线路的通知》（2026年4月21日）\n\n#### 57路（调整日期：2026年4月23日）\n在\"管家塘东/冯家浜路通运路口北\"和\"三里洋/江家桥\"之间增设**\"金昌路通益路口\"**1对双向停靠站，其余不变。\n\n#### 85路（调整日期：2026年4月23日）\n- **增设站点：**\n  - 环丁路公交站至二纺机总厂方向：在\"地铁桃花湖公园站（B·D）\"和\"高地上\"之间增设**\"丁城路明珠街口\"**1只单向停靠站\n  - 二纺机总厂至环丁路公交站方向：在\"高地上\"和\"地铁桃花湖公园站（B·D）\"之间增设**\"明珠街丁城路口\"**1只单向停靠站\n- **站名更名：**\n  - \"环丁路公交站\"→**\"丁桥环丁路总站\"**\n  - \"石桥公交停车场北\"→**\"旦万桥东\"**\n  - \"丁桥公交站\"→**\"丁桥公交总站外\"**\n  - \"三塘竹苑\"→**\"三塘竹园\"**\n\n#### 68路（调整日期：2026年4月23日）\n焦家村公交总站（水务大厦）至饮马井巷方向，在\"焦家村公交总站（水务大厦）\"至\"流水北苑\"之间增设**\"焦家村\"**1只单向停靠站。\n\n#### 324H路（调整日期：2026年4月25日）\n- **调整前：** 地铁枫桦西路站（B·C）至灵隐东\n- **调整后：** 地铁枫桦西路站（B·C）至上茅家埠（仅双休、节假日运营）\n- **线路走向：** 下行经梅灵南路、梅灵北路至上茅家埠；上行经梅灵北路、龙井路、灵隐路、双峰路、梅灵北路循原线返回\n- **撤销：** 灵隐东始发站；**增设：** 灵隐东、黄泥岭（上行）、立马回头（上行）3对（只）停靠站及上茅家埠始发站\n- **服务时间：** 灵隐东8:00-19:00，地铁枫桦西路站（B·C）不变\n- **线路长度：** 下行13.4KM，上行16.6KM\n\n#### 地铁西浦站D口至贝遨大厦接驳线→丁香中心南门（调整日期：2026年4月22日）\n- **调整后终点：** 地铁西浦路站D口/光云大厦 至 丁香中心南门/地铁西浦路站D口\n- **线路走向：**\n  - 下行：地铁西浦路站D口始发，经滨文路、西浦路、坚塔街、堤东路、生地街、潮涌路、潘曹街至丁香中心南门\n  - 上行：光云大厦始发，经坚塔街、堤东路、生地街、潮涌路、潘曹街、闻涛路、滨文路至地铁西浦路站D口\n- **增设：** 丁香中心南门1只停靠站\n- **服务时间：** 下行7:50-9:30（间隔约7分钟），上行17:30-19:00（间隔约7分钟）\n- **线路长度：** 下行2.2KM，上行3.4KM\n\n#### 长河历史街区接驳线（调整日期：2026年4月22日）\n- **调整前终点：** 长河公交站\n- **调整后终点：** 白马湖北\n- **线路走向：**\n  - 下行：白马湖北始发，经长江路后循原线至江边（地铁长河站C口）\n  - 上行：江边（地铁长河站C口）始发，循原线至长江路，经白马湖路、腾龙路、天马路、长江路至白马湖北\n- **撤销：** 长河公交站始发站；**增设：** 白马湖北始发站\n- **服务时间：**\n  - 江边（地铁长河站C口）：7:15-19:15（共9班）\n  - 白马湖北：6:30-18:30（共9班）\n- **线路长度：** 下行6.1KM，上行8.9KM\n\n"},{"title":"四、智慧公交与科技创新","text":"\n### 4.1 自动驾驶公交\n\n**杭州公交大模型**：\n- 杭州市公交集团于2025年建成全国首个公交大模型，依托杭州城投基座模型，接入多维度专有数据\n- 实现安全画像生成、下客客流精准分析等功能\n\n**钱塘区自动驾驶公交**（2026年3月19日起试运行）：\n- 杭州市首批持证上路的载客自动驾驶公交\n- 开通2条线路，投入5辆自动驾驶巴士\n  - 一条工作日开行\n  - 一条双休日及节假日开行\n- 预约方式：现场扫码或小程序搜索\"钱塘区智能网联巴士\"预约\n- 票价：免费\n- 计划增设3条新线路，覆盖文旅景区、高教园区等区域\n\n**滨江白马湖线智能环线**（2026年2月10日正式载客运营）：\n- 线路里程：8.6公里\n- 运营时间：每日8:30-18:30\n- 核心站点：白马湖南站、白马湖北站、地铁聚才路D口公交站、滨康路长江路口站\n- 车辆：3台L4级无人小巴循环运行\n- 自动驾驶覆盖率：85%以上路段\n- 背景：2025年10月起空车测试，累计安全运行超8000公里、488小时\n\n**战略合作**（2026年3月20日）：\n- 武汉元光与杭州数知梦订立战略合作框架协议，在公交自动驾驶领域开展深度合作\n\n### 4.2 智慧服务升级\n\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%\n- \"云公交3.0\"：无固定区域、全时段响应模式\n- 车厢内外电子屏升级：构建\"车外—车内—站台—掌上\"实时信息网\n- \"公交碳积分\"激励机制\n\n**电子路牌发车预告上线**（2026年4月15日起，首批26条线路）：\n- 利用现有公交车前/中/后三处车载电子路牌LED屏，动态显示\"X路 本班XX:XX发车\"\n- 覆盖主城区+余杭+钱塘+富阳+临安，共26条线路、近300辆车\n- 属于\"公交安心达\"行动，破解始发站\"盲等\"痛点\n- 后续将全网推进\"响应式停靠\"，升级\"杭州公共交通\"APP换乘预测功能\n- 4月16日杭州公交官号后续报道以46路六公园始发站为试点案例\n\n**首批26条\"电子路牌发车预告\"线路及站点汇总表**：\n\n| 序号 | 线路 | 可显示\"预计发车时间\"的站点 |\n|------|------|--------------------------|\n| 1 | 2路 | 武林门北 |\n| 2 | 9路 | 化仙桥南 |\n| 3 | 10路 | 平海路岳王路口、政苑公交总站 |\n| 4 | 11路 | 公园路 |\n| 5 | 21路 | 大通桥河下、稻香园 |\n| 6 | 22路 | 百井坊巷 |\n| 7 | 35路 | 吴山广场北、开创街药香路口 |\n| 8 | 45路 | 长板巷 |\n| 9 | 46路 | 六公园 |\n| 10 | 49路 | 城站火车站 |\n| 11 | 71路 | 浣纱路南 |\n| 12 | 77路 | 府苑新村 |\n| 13 | 80路 | 雷霆路望江东路口 |\n| 14 | 126路 | 武林广场西 |\n| 15 | 151路 | 雄镇楼 |\n| 16 | K155路 | 城站火车站 |\n| 17 | 183路 | 地铁城站站 |\n| 18 | 533路 | 浙医二院 |\n| 19 | 356路 | 西溪医院 |\n| 20 | 365路 | 九昌路红普路口 |\n| 21 | 410路 | 三号桥 |\n| 22 | 478路 | 地铁创景路站 |\n| 23 | 612路 | 小花坞公交站 |\n| 24 | 2352路 | 古蕫科技 |\n| 25 | 2913路 | 阳川 |\n| 26 | 2914路 | 昱岭关 |\n\n---\n"},{"title":"五、公交线网优化","text":"\n### 5.1 2026年主要优化方向\n\n- \"5分钟巴士\"全年目标100条线路（一季度65条）\n- \"班次时刻化\"线路：萧山、富阳、临安等区域推出20条，实现班次可查可预期\n- 响应式停靠：2026年全网推行，对10公里以上长线路实行\"分区段计时\"机制\n\n### 5.2 历年延续服务\n\n- 每年清明、冬至期间开通多条扫墓地铁接驳线和扫墓快线\n- \"西站暖巴\"等定制客运服务持续运营\n\n---\n"},{"title":"六、政策与行业规划","text":"\n### 6.1 杭州市交通运输局2026年工作重点（与公交相关）\n\n- **公交优先**：构建\"地铁+快速接驳线+高频骨干线\"多元网络，优化地铁接驳线，新增\"类地铁\"公交线路\n- **交旅融合**：打造杭黄跨省航线，升级景区直达、高校假日等定制客运服务\n- **智慧交通**：持续推进\"人工智能+交通运输\"，深化智能网联汽车试点\n- **绿色交通**：全面推广新能源交通工具，创建\"交能融合示范区\"\n- **低空经济**：设立低空交通运行管理机构，推进无人机公共起降场建设\n\n---\n"},{"title":"八、2026年3月线路具体调整明细","text":"\n### 8.1 3月26日线路调整\n\n**发布日期**：2026年3月24日\n\n**新开通：**\n- **1418路**（\"5分钟巴士\"，工作日高峰运营）\n  - 起讫点：燕庐巷口/地铁科海路站 ↔ 地铁科海路站/青蓝路北\n  - 早高峰：燕庐巷口出发，6:45-9:00，间隔约7分钟\n  - 晚高峰：地铁科海路站出发，17:05-19:00，间隔约7分钟\n  - 票价：1元\n\n**调整线路：**\n- **3路**（大关小区总站↔南落马营总站）：终点延伸至南落马营总站，新增西湖文化广场、候潮东路秋涛路口等停靠站；21时后短途折返至市三医院北\n- **9路**（火车东站西↔化仙桥南）：走向调整，经皋塘二路口折返后绕行，撤销皋塘东等站，新增骏塘名庭北/南等站\n- **345路**：\"欢中路临丁路口\"与\"长睦锦苑\"之间新增\"周杨村\"双向停靠站\n- **533路**：撤销往浙医二院方向的\"浙医二院正门\"单向停靠站\n\n### 8.2 3月28日线路调整\n\n**发布日期**：2026年3月25日\n\n**新开通：**\n- **1102H路**（仅限青少年宫上课期间运营）\n  - 起讫点：地铁独城生态公园站 ↔ 杭州青少年宫半山分中心\n  - 走向：经平炼东路、康园南路、炼铁街运行，途经杭钢公园1号高炉\n  - 运营时段：8:00-10:00，12:40-16:20（地铁侧）；8:10-9:50，12:30-16:30（青少年宫侧）\n  - 票价：1元\n  - 背景：配合大运河杭钢公园杭州青少年宫半山分中心启用\n\n**调整线路：**\n- **1213路**（三墩景溪南苑总站↔浙江医院三墩院区）：撤销开往三墩景溪南苑总站方向\"广业街墩池路口\"1只单向停靠站\n\n### 8.3 2026年清明扫墓专线\n\n**2026年清明节**（4月4日-6日放假3天）扫墓保障：\n- 杭州公交集团在3月28日至4月6日期间开通多条扫墓接驳专线\n- 覆盖第二公墓（地铁石马站接驳）、半山公墓、龙居寺陵园（已于3月21日提前开通，地铁3号线华鹤街站D口，票价1元）\n- 推荐\"地铁+公交\"接驳方式，避开高峰期道路拥堵\n- 杭州实行\"先预约后祭扫\"，通过\"杭州民政\"公众号或浙里办APP的\"杭州数智殡\"服务预约\n\n---\n"},{"title":"十、新增文件收录（2026-03-26）","text":"\n### 10.1 关于开通1102H路、调整1213路等线路的通知（正式文件）\n\n**文号**：集团客运管理部，2026年3月25日  \n**文件来源**：`关于开通1102H路，调整1213路等线路的通知 (2).docx`\n\n**主要内容**：\n\n**1. 新开1102H路**（地铁独城生态公园站 ↔ 杭州青少年宫半山分中心）\n- 背景：配合大运河杭钢公园杭州青少年宫半山分中心启用\n- 下行走向：地铁独城生态公园站→平炼东路→康园南路→康园南路金昌路口折返→康园南路→炼铁街→杭州青少年宫半山分中心\n- 上行走向：杭州青少年宫半山分中心→炼铁街→康园南路→炼安路→留沈路→平炼东路→地铁独城生态公园站\n- 途经停靠：杭钢公园1号高炉（1对双向停靠站）\n- 线路长度：下行1.6KM，上行1.4KM\n- **服务时间**（仅青少年宫上课期间运营）：\n\n| 发车点 | 时段 | 间隔 |\n|--------|------|------|\n| 地铁独城生态公园站 | 8:00-10:00 | 整点、20分、40分 |\n| 地铁独城生态公园站 | 12:40-14:40 | 10分、40分 |\n| 地铁独城生态公园站 | 14:40-16:20 | 整点、20分、40分 |\n| 杭州青少年宫半山分中心 | 8:10-9:50 | 10分、半点、50分 |\n| 杭州青少年宫半山分中心 | 12:30-14:30 | 整点、半点 |\n| 杭州青少年宫半山分中心 | 14:30-16:30 | 10分、半点、50分 |\n\n- 票价：每人次1元，IC卡及移动支付通用\n- 经营：汽五分公司\n- 开通日期：2026年3月28日\n\n**2. 调整1213路**（三墩景溪南苑总站 ↔ 浙江医院三墩院区）\n- 调整内容：撤销开往三墩景溪南苑总站方向\"广业街墩池路口\"1只单向停靠站\n- 其余不变，调整日期：2026年3月28日\n\n---\n\n### 10.2 关于开通1418路、调整3路9路等线路的通知（正式文件）\n\n**文件来源**：`关于开通1418路，调整3、9路等线路的通知 (1).doc`（原始`.doc`格式，内容已通过前述公告获取）\n\n**主要内容**（2026年3月26日调整，通知于3月24日发布）：\n\n**1. 新开1418路**（\"5分钟巴士\"，工作日高峰运营）\n- 起讫点：燕庐巷口/地铁科海路站 ↔ 地铁科海路站/青蓝路北\n- 早高峰（燕庐巷口出发）：6:45-9:00，约7分钟一班\n- 晚高峰（地铁科海路站出发）：17:05-19:00，约7分钟一班\n- 票价：1元\n\n**2. 调整3路**（大关小区总站 ↔ 南落马营总站）\n- 终点由原甬江路银鼓路口延伸至南落马营总站\n- 新增停靠站：西湖文化广场、候潮东路秋涛路口等\n- 21时后短途折返至市三医院北\n\n**3. 调整9路**（火车东站西 ↔ 化仙桥南）\n- 走向调整，经皋塘二路口折返后绕行\n- 撤销皋塘东等站，新增骏塘名庭北/南等站\n\n**4. 调整345路**\n- 欢中路临丁路口与长睦锦苑之间新增\"周杨村\"双向停靠站\n\n**5. 调整533路**\n- 撤销往浙医二院方向\"浙医二院正门\"1只单向停靠站\n\n---\n\n### 10.3 各公司线路分布图2（更新版）\n\n**文件来源**：`各个公司线路的分布图2.xlsx`  \n**Sheet总数**：14个（含14个分公司/子公司线路表）\n\n**新增/更新核心内容**：\n\n#### 新三公司（汽三分公司）线路与车队\n\n此前数据库中缺失的三公司信息，本次文件正式纳入：\n\n| 车队 | 主要线路 |\n|------|---------|\n| 一车队 | 58路、67路、70路、91路、97路、98路、183路、192路、198路、8192路、7032M路、7051M路 |\n| 二车队 | 26路、93路、129路、312路（电车）、312B路、307路、8201路、8220路、艮盐线、1203M路、1211路 |\n| 三车队 | 5路、8路、21路、28路、101路、179路、1314路、1901M路、1904M路、7100路、8028路、8179路、8208路、7268路 |\n| 四车队 | 3路、12路、14路、34路、80路、82路、88路、191路、1101M路、1104M路、1105M路、1204M路、1206M路、省人民医院接驳线 |\n| 五车队 | 41路、78路、131路、135路、305路、335路、535路、535B路、1107M路、1900路、1905M路、1908M路、1909M路、1994路、1995路、西湖内环线、香栖天第-东新园南门专线 |\n| 六车队 | 5路、28路、40路、41路、179路、1314路、1901路、1904路、1906路、8028路、8179路、5903路、市民线、省人民医院-西湖文化广场 |\n\n**三公司联系方式**：\n- 信访：85379885\n- 总调：663666 / 85361007\n- 失物联系人：马春莹663013、杜玥婷696149\n\n#### 最新一公司更新\n\n101车队驻地调整为**留下南公交站**（原东岳公交站），102路终点调整为**黄龙体育中心西—南星桥**。\n\n#### 富阳公司（杭州市富阳公共交通有限公司）\n\n- **规模**：进杭线13条、2班线、城区25条、城乡42条、村村通61条（含数字旅游3条），合计**143条**，支线共计**222条**\n- 主要进杭线路：K301（富阳↔南环路）、K314（富阳↔城站火车站）、K500（富阳↔西湖区）、K504、K514等\n- 一车队管辖\n\n#### 钱塘公司各车队线路\n\n| 车队 | 主要线路编号 |\n|------|------------|\n| 一车队 | 104路、170路、3101路、3103M路、3106M路、3113路、3114路、3116路、3117路、3118路、3124M路、3175路、3183M路、3184B路、3184M路 |\n| 二车队 | 302路、3102M路、3104路、3108路、3109路、3110路、3111路、3119路、3123内/外路、3148路、3185M路、3190路、365路、财经至长安专线、下沙至海宁皮革城专线、下沙至盐仓专线 |\n| 三车队 | 3168路、3167路、3172路、3173路、3174M路、3153M路、3155路、3176路、3166路、3169路、3170路、3151M路、3152M路、3199H路 |\n\n---\n"},{"title":"七、清明祭扫出行指南（2026年清明）","text":"\n**来源**：杭州公交（微信公众号）\n**发布日期**：2026年4月1日\n**运营日期**：清明假期期间\n**背景**：共计开通10条扫墓公交接驳线（含假期前已开通2条），实现\"地铁+公交\"无缝衔接\n\n### 7.1 假期前已开通的地铁接驳线（2条）\n\n| 线路 | 起止站点 | 首末班时间 | 票价 |\n|------|----------|------------|------|\n| 龙居寺扫墓专线 | 地铁华鹤街站D口 ↔ 龙居寺（千桃园） | 华鹤街7:00-14:00；龙居寺9:00-15:30 | 1元 |\n| 第二公墓地铁接驳线 | 地铁石马站 ↔ 第二公墓 | 石马站7:00-15:00；公墓7:20-15:20 | 1元 |\n\n### 7.2 清明假期新增地铁接驳线（4月4日-6日，4条）\n\n| 线路 | 起止站点 | 首末班时间 | 票价 |\n|------|----------|------------|------|\n| 钱江陵园地铁接驳线 | 地铁双浦站 ↔ 钱江陵园 | 双浦站7:15-14:30；钱江陵园8:00-15:30 | 2元 |\n| 闲林公墓地铁接驳线 | 地铁石马站 ↔ 闲林公墓 | 石马站6:30-15:00；闲林公墓6:50-15:20 | 1元 |\n| 半山公墓地铁接驳线 | 地铁吴家角港站 ↔ 半山公墓 | 吴家角港站7:30-15:00；半山公墓9:00-15:30 | 1元 |\n| 南山公墓地铁接驳线 | 闸口 ↔ 南山公墓 | 闸口7:00-15:00；南山公墓7:15-15:15 | 1元 |\n\n**备注**：以上线路支持IC卡及移动支付\n\n### 7.3 清明假期市区直达扫墓快线（4月4日-6日，4条）\n\n| 线路 | 起止站点 | 途经主要站点 | 首末班时间 | 票价 |\n|------|----------|--------------|------------|------|\n| 38B路 | 朝晖五区总站 ↔ 南山公墓 | 朝晖一区南 | 朝晖五区7:00-13:30；南山公墓7:30-14:00 | 2元 |\n| 147B路 | 沙田里 ↔ 半山公墓 | 打铁关 | 沙田里7:00-13:30；半山公墓8:00-15:00 | 3元 |\n| 321B路 | 大关北公交总站 ↔ 安贤园 | 善贤、半山公墓 | 大关北7:00-13:30；安贤园8:00-15:00 | 3元 |\n| 321C路 | 流水北苑 ↔ 屯里林场 | 打铁关、水洪庙 | 流水北苑7:30-13:30；屯里林场8:30-14:30 | 3元 |\n\n**备注**：以上线路支持IC卡及移动支付\n\n### 7.4 清明假期周边常规线路加密班次\n\n清明假期期间加密以下墓区周边常规公交班次：20路、39路、42路、62路、131路、135路、307路、383路、384路，覆盖南山公墓、半山公墓、安贤园、钱江陵园周边疏散能力。\n\n### 7.5 常规线路（各墓区汇总）\n\n| 公墓名称 | 常规可到达线路 | 下客站点 |\n|----------|----------------|----------|\n| 南山公墓 | 20、42、62路 | 陶瓷品市场总站 |\n| 南山公墓 | 39、87路 | 八卦田 |\n| 半山公墓 | 131、147、307路 | 沈家桥/焦化分厂 |\n| 第二公墓 | 310、383、384、546路 | 石马公交总站 |\n| 龙居寺陵园 | 135、335路 | 千桃园 |\n| **钱江陵园** | **500、594路** | **社井村口** |\n| 闲林公墓 | 383、384、546、596路 | 里山桥 |\n| 安贤园 | 321、391、532路 | 水洪庙 |\n| 屯里公墓 | 321路 | 屯里林场 |\n| 东岳公墓 | 306、310路 | 东方中学 |\n| 荆山公墓 | 346、382路 | 五常南 |\n| 超山公墓 | 2690、2692路 | 超山公墓 |\n\n---\n"},{"title":"九、近期线路拟新增、调整公示","text":"\n**来源：** 杭州市交通运输局\n**公示期：** 2026-04-14 至 2026-04-20\n**联系电话：** 0571-85191122、0571-85113816\n**原文链接：** https://tb.hangzhou.gov.cn/col/col1510237/gsbzlm600/art/2026/art_fff4dbb3466744259f3b15a73e5b706a.html\n\n共涉及 **14条公交线路** 调整，分为四大类：\n\n### 9.1 启用驿城路公交总站配套（3条）\n\n| 线路 | 类别 | 调整内容 |\n|------|------|----------|\n| **5路** | 调整 | 起讫点由\"三里亭临时总站至六公园\"调整为\"**驿城路公交总站至六公园**\"，延伸至百田巷、驿城路地铁站 |\n| **40路** | 调整 | 起讫点由\"三里亭临时总站至吴山广场北\"调整为\"**驿城路公交总站至吴山广场北**\"，延伸至驿城路地铁站 |\n| **1604路** | 调整 | 起讫点由\"池塘庙至丁家桥\"调整为\"**驿城路公交总站至丁家桥**\"，调整至新总站内始发 |\n\n### 9.2 调整石马公交总站配套线路（4条）\n\n| 线路 | 类别 | 调整内容 |\n|------|------|----------|\n| **310路** | 调整 | 起讫点\"石马公交总站至骆家庄南\"，结合新石马公交总站启用，调整至新总站内始发 |\n| **383路** | 调整 | 起讫点\"石马公交总站至全丰\"，结合新石马公交总站启用，调整至新总站内始发 |\n| **384路** | 调整 | 起讫点\"石马公交总站至源峰嘉苑西\"，结合新石马公交总站启用，调整至新总站内始发 |\n| **546路** | 调整 | 起讫点\"石马公交总站至地铁银湖站\"，结合新石马公交总站启用，调整至新总站内始发 |\n\n### 9.3 调整市一医院城东院区配套线路（2条）\n\n| 线路 | 类别 | 调整内容 |\n|------|------|----------|\n| **1706路** | 调整 | 起讫点由\"三卫家园南苑至地铁九和路站\"调整为\"**九华路冯金街口至市一医院城东院区**\"，方便九环路沿线居民及地铁九和路站换乘就医 |\n| **1713路** | 调整 | 起讫点由\"三格地至火车东站东\"调整为\"**市一医院城东院区至火车东站东**\"，方便彭埠周边居民及地铁七堡站换乘就医 |\n\n### 9.4 其他调整（5条）\n\n| 线路 | 类别 | 调整内容 |\n|------|------|----------|\n| **139路** | 调整 | 起讫点由\"婺江路银鼓路口至闸口\"调整为\"**钱江新城总站至闸口**\"，配合婺江路银鼓路口征迁，方便近江周边居民前往西湖南线景区 |\n| **95路** | 调整 | 起讫点不变（丁桥公交总站至运河广场），调整走向至石桥苑巷，方便石桥铭苑居民出行 |\n| **135路** | 调整 | 起讫点不变（千桃园至艮山门东），双向调整至华西路、康宁街行驶，方便沿线市民通勤 |\n| **1107路** | 调整 | 起讫点不变（石桥铭苑北至永华街竹清路口），结合康宁街西段道路开通，调整始发站至古扇弄行驶 |\n\n**备注：** 以上线路调整均为公示期方案，最终实施时间以官方通知为准。\n\n### 9.5 2026年1月公式线路（来源：杭州市交通运输局，2026-01-20）\n\n**来源：** 杭州市交通运输局\n**公示期：** 2026-01-20\n**原文链接：** https://tb.hangzhou.gov.cn/col/col1510237/gsbzlm600/art/2026/art_0ffd305bb7204ff6aa902c201a9f7a69.html\n\n| 线路 | 类别 | 调整内容 |\n|------|------|----------|\n| **1418M路** | 新开 | 贤家弄 ↔ 地铁科海路站（接驳地铁，方便之江区块通勤） |\n| **1915M路** | 新开 | 景翠公寓环线（原\"六进\"线路更名优化） |\n| **1498路** | 调整 | 金色年华总站↔转塘午山总站，中村站临时调整 |\n| **21路** | 调整 | 钱江三桥改造，瓯江路西改海潮寺北始发 |\n| **55路** | 优化 | 优化走向，减少海潮路绕行 |\n| **56路** | 优化 | 优化走向，减少望江路绕行 |\n\n**备注：** 以上为历史公式内容，具体实施时间以官方通知为准。\n\n---\n\n### 3.7 2026杭州女子半程马拉松公交配套保障（2026年4月26日）\n\n**来源：** 杭州市公共交通集团有限公司（2026年4月22日）  \n**赛事规模：** 1.2万人；4月26日（周日）7:00武林广场鸣枪，终点杭州大剧院  \n**指挥中心：** 龙翔桥公交总站（910），6:30启动；另在交警指挥部设联络员（960）\n\n#### 比赛路线（半程马拉松21.0975公里）\n武林广场（起点）→体育场路→延安路→庆春路→环城西路→北山街→白堤→苏堤→南山路→玉皇山路→南复路→之江路（折返）→之江路→新业路→杭州大剧院（终点）\n\n#### 涉及调整汇总\n- **共56条线路调整**：走向调整47条，首班推迟/运营调整9条\n- **分三批管控时间**：5时（起点区7条）→ 6:30起（赛道33条）→ 7时起（南山路/之江路7条）\n\n---\n\n#### 第一批：4月26日5时起（起点管控区，共7条）\n\n**14路**  \n武林小广场始发车调整：循原线至环城北路，经中山北路、庆春路后循原线至复兴公交总站；  \n5:45起复兴方向：循原线至中山北路，经环城北路→环城西路→体育场路→武林路至武林小广场。  \n临时撤销：武林广场西（开往复兴方向）、昌化新村、江山弄、皇亲巷4对（只）站；临时增设：武林广场北、小北门、天水桥、下焦营巷4对站。\n\n**126路**  \n九堡杭乔路总站始发终点调至小北门；九堡方向经中山北路、环城北路、建国北路、体育场路原线返回。  \n临时撤销：宝善桥（开往九堡方向）、市体育馆（开往九堡方向）、小北门（原往九堡）、武林广场南（原往武林广场西）、轮船码头（往九堡）5只站及武林广场西始发站；临时增设：小北门始发站。\n\n**318路**  \n转塘公交总站始发终点调至武林小广场；武林小广场始发经武林路、环城北路、环城西路、体育场路循原线返回。  \n临时撤销：轮船码头（开往武林广场方向）、武林门（开往转塘方向）2只站及武林广场始发站；临时增设：武林小广场始发站。\n\n**318C路**  \n龙坞葛衙庄总站始发终点调至武林小广场；武林小广场始发经武林路、环城北路、环城西路、体育场路循原线返回。  \n临时撤销：轮船码头（开往武林广场方向）、武林门（开往龙坞方向）2只站及武林广场始发站；临时增设：武林小广场始发站。\n\n**506路**  \n余杭西站始发终点调至武林门北（②站台）；经湖墅南路、密渡桥路；武林门北始发循密渡桥路、环城北路返回。  \n临时撤销：混堂桥（开往武林广场方向）、武林广场北（开往武林广场方向）2只站及武林广场始发站；临时增设：武林门北始发站。\n\n**506C路**  \n中泰公交总站始发终点调至武林门北（②站台）；走向同506路对应调整。  \n临时撤销：混堂桥（开往武林广场方向）、武林广场北（开往武林广场方向）2只站及武林广场始发站；临时增设：武林门北始发站。\n\n**8192路**  \n4时起，勾庄农副物流总站始发终点调至武林广场南；经环城北路→中山北路→体育场路；武林广场南始发经体育场路原线返回。  \n临时撤销：武林广场始发站；临时增设：武林广场南始发站。\n\n**8202路**  \n3:30起，转塘公交停车场始发终点调至小北门；小北门始发经中山北路、体育场路、武林路、环城北路循原线返回。  \n临时撤销：武林广场始发站；临时增设：武林广场南1只停靠站。\n\n**8218路**  \n4时起，勤丰路明珠街口始发终点调至武林广场南；经环城北路→体育场路；武林广场南始发经体育场路原线返回。  \n临时撤销：武林广场始发站；临时增设：武林广场南始发站。\n\n---\n\n#### 第二批：4月26日6时30分起（赛道区，共33条）\n\n**5路**  \n5:50起，三里亭临时总站始发终点调至西桥；西桥始发经凤起路、中山北路、屏风街、中河北路、凤起路循原线返回。  \n临时撤销：皇亲巷、孩儿巷2对站及六公园始发站。\n\n**7路**  \n5:40起，双方向均绕行天目山路→黄龙路→曙光路→灵隐路，避开延安路/庆春路。  \n临时撤销：柴垛桥（往城站方向）、三元坊、饮马井巷（往灵隐方向）、延安路解百（往城站方向）、湖滨（往灵隐方向）、胜利剧院、小车桥、钱塘门外（往城站方向）、少年宫（往灵隐方向）、葛岭、新新饭店、岳坟12对（只）站；临时增设：浙大附中1对站。\n\n**10路**  \n5:45起，政苑公交总站始发调整经环城北路→中山北路→庆春路→中河中路→平海路至平海路岳王路口；  \n岳王路口始发经浣纱路→庆春路→中山北路→环城北路→莫干山路返回。  \n临时撤销：小车桥、钱塘门外（往平海路方向）、环城西路十四中、省府大楼东、武林门南5对（只）站；临时增设：众安桥北、天水桥、小北门3对站。\n\n**11路**  \n5:50起，双方向均绕行环城西路→环城北路→中山北路，避开武林广场南。  \n临时撤销：武林广场南1对站；临时增设：武林广场北1对站。\n\n**12路**  \n5:50起，三塘竹园总站始发终点调至清波门；走向调整绕行环城北路→中山北路→体育场路→中河中路→平海路→延安路；清波门始发循南山路、河坊街、高银街、延安路等返回。  \n临时撤销：武林小广场、昌化新村、江山弄、孩儿巷、胜利剧院（往十亩田方向）、南山路万松岭路口、阔石板、丝绸博物馆、玉皇飞云（往十亩田）、南观音洞、之江路化仙桥路口（往十亩田）、复兴南苑西（往十亩田）、古海月桥（往十亩田）、化仙桥（往三塘竹园）、清波门（往三塘竹园）15对（只）站及十亩田始发站；临时增设：武林广场北、小北门2对站。\n\n**13路**  \n首班起，海洋二所始发经环城北路→中山北路→凤起路循原线至南落马营总站；5:45起，南落马营总站始发经凤起路→中山北路→环城北路→莫干山路返回。  \n临时撤销：武林门、延安新村、皇亲巷3对站；临时增设：天水桥、小北门、武林广场北3对站。\n\n**16路**  \n首班起，岳王路始发绕行浣纱路→庆春路→中山北路→环城北路→环城西路→体育场路→曙光路；5:50起，浙大玉泉总站始发循反向绕行返回。  \n临时撤销：庆春路浣纱路口、小车桥、钱塘门外（往岳王路）、少年宫（往浙大玉泉）、省府大楼西5对（只）站；临时增设：众安桥北、贯桥、下焦营巷、天水桥、小北门5对站。\n\n**18路**  \n5:40起，景芳北站始发终点调至市一医院；经庆春路→浣纱路；市一医院始发经浣纱路→平海路→中山北路→庆春路返回。  \n临时撤销：庆春路浣纱路口2对站及六公园始发站；临时增设：市一医院始发站。\n\n**21路**  \n首班起，稻香园始发绕行环城北路→中山北路→凤起路；5:50起，大通桥河下始发绕凤起路→中山北路→环城北路返回。  \n临时撤销：武林小广场、昌化新村、江山弄、皇亲巷4对（只）站；临时增设：下焦营巷、天水桥、小北门、中北桥南4对站。\n\n**22路**  \n首班起，星璜巷公交总站始发终点调至百井坊巷（北侧）；百井坊巷始发经百井坊巷→延安路→体育场路→中山北路循原线返回。  \n临时撤销：皇亲巷（开往百井坊巷方向）、天水桥（开往星璜巷方向）2只站及百井坊巷始发站；临时增设：百井坊巷（北侧）始发站。\n\n**25路**  \n首班起，蒋村公交总站始发绕行省府路→环城西路→环城北路→中山北路→庆春路→浣纱路；吴山广场北始发绕浣纱路→庆春路→中山北路→环城北路→武林路→凤起路返回。  \n临时撤销：钱塘门外（往吴山广场北）、小车桥（往吴山广场北）、六公园（往蒋村方向）3只站；临时增设：小北门、天水桥、贯桥3对站。\n\n**26路**  \n5:30起，李王桥公交总站始发终点调至昭庆寺北；昭庆寺北始发经凤起路→保俶路→省府路→环城西路→凤起路循原线返回。  \n临时撤销：昭庆寺北（开往李王桥方向）1只站及少年宫始发站；临时增设：昭庆寺北始发站。\n\n**27路**  \n首班起，双方向均绕行曙光路→灵隐路，避开北山街/孤山路。  \n临时撤销：小车桥、钱塘门外（往岳王路）、少年宫（往茶博龙井）、葛岭、新新饭店、岳坟6对（只）站；临时增设：贯桥、天水桥、小北门3对站。\n\n**27B路**  \n首班起，双方向均绕行曙光路→灵隐路，避开北山街/孤山路（与27路相同走向逻辑）。  \n临时撤销：小车桥、钱塘门外（往岳王路）、少年宫（往龙井村）、葛岭、新新饭店、岳坟6对（只）站；临时增设：贯桥、天水桥、小北门3对站。\n\n**28路**  \n5:50起，火车东站西始发绕行中山北路→环城北路→武林路→体育场路；6时起，植物园始发绕武林路→环城北路→中山北路→体育场路返回。  \n临时撤销：武林广场南1对站；临时增设：小北门1对站。\n\n**31路**  \n首班起，火车东站西始发绕行浣纱路→西湖大道→劳动路；地铁吴山广场站C口方向不变。  \n临时撤销：胜利剧院（往地铁吴山广场站C口）、湖滨（往地铁吴山广场站C口）、延安路解百（往地铁吴山广场站C口）、饮马井巷（往地铁吴山广场站C口）4只站。\n\n**45路**  \n6时起，长板巷始发绕行环城北路→中山北路→体育场路→中河北路→庆春路；首班起，运新花苑始发绕庆春路→中河北路→体育场路→中山北路→环城北路→莫干山路返回。  \n临时撤销：武林门南、省府大楼东、环城西路十四中、小车桥、庆春路浣纱路口5对站；临时增设：梅登高桥1对站。\n\n**46路**  \n5:30起，星璜巷公交总站始发终点调至凤起路十四中；凤起路十四中始发经凤起路→环城西路→武林路循原线返回。  \n临时撤销：孩儿巷、江山弄（往星璜巷方向）、昌化新村（往星璜巷方向）3对（只）站及六公园始发站；临时增设：凤起路十四中始发站。\n\n**49路**  \n首班起，双方向均绕行武林路→环城北路→中山北路→庆春路→浣纱路，避开省府大楼东等。  \n临时撤销：省府大楼东、环城西路十四中、钱塘门外（往城站方向）、小车桥4对（只）站；临时增设：小北门1对站。\n\n**78路**  \n5:40起，沈家村始发终点调至凤起路十四中；凤起路十四中始发经凤起路→保俶路→省府路→环城西路→凤起路→武林路→环城北路→中山北路循原线返回。  \n临时撤销：小北门、天水桥、皇亲巷、昭庆寺北（往沈家村方向）4对（只）站及少年宫始发站；临时增设：武林广场北、武林小广场、昌化新村3对站及凤起路十四中始发站。\n\n**92路**  \n5:45起，塘萍路南始发绕行环城西路→环城北路→中山北路→庆春路→浣纱路；首班起，复兴公交总站始发绕浣纱路→庆春路→中山北路→环城北路→环城西路→体育场路返回。  \n临时撤销：延安新村、孩儿巷、庆春路浣纱路口3对站；临时增设：小北门1对站。\n\n**101路**  \n5:45起，杭氧街始发终点调至昭庆寺北；昭庆寺北始发经凤起路→环城西路→省府路→保俶路循原线返回。  \n临时撤销：少年宫（往杭氧街方向）1只站及六公园始发站。\n\n**102路**  \n首班起，双方向均绕行天目山路→环城北路→中山北路→庆春路→浣纱路，避开武林门/孩儿巷等。  \n临时撤销：武林门、昌化新村、江山弄、孩儿巷、庆春路浣纱路口5对站；临时增设：小北门、贯桥2对站。\n\n**103路**  \n首班起，九溪公交总站始发终点调至昭庆寺北；昭庆寺北始发经凤起路→保俶路→曙光路循原线返回。  \n临时撤销：省府路弥陀寺路口（往九溪）、省府大楼（往九溪）、钱塘门外、小车桥（往九溪）、六公园（往六公园北方向）5对（只）站及六公园北始发站；临时增设：昭庆寺北始发站。\n\n**113路**  \n首班起，东冠公交总站始发终点调至市一医院；市一医院始发经浣纱路→庆春路→中山中路→平海路→浣纱路循原线返回。  \n临时撤销：众安桥北（往东冠方向）1只站及孩儿巷始发站。\n\n**151路**  \n5:45起，拱北小区总站始发绕行环城北路→中山北路→体育场路；6时起，雄镇楼始发绕体育场路→中山北路→环城北路→湖墅南路返回。  \n临时撤销：武林小广场、武林广场南2对站；临时增设：小北门、武林广场北2对站。\n\n**K155路**  \n5:50起，和睦新村总站始发绕行环城北路→中山北路→庆春路→浣纱路→平海路→延安路；首班起，城站火车站始发绕延安路→庆春路→中山北路→环城北路→莫干山路返回。  \n临时撤销：武林门、延安新村、孩儿巷、胜利剧院（往城站方向）4对（只）站；临时增设：天水桥1对站。\n\n**186路**  \n首班起，双方向均绕行莫干山路→环城北路→中山北路→体育场路→中河北路→庆春路，避开省府大楼东/小车桥等。  \n临时撤销：省府大楼东、小车桥、众安桥3对站；临时增设：武林广场北、小北门、梅登高桥3对站。\n\n**188路**  \n5:50起，双方向均绕行湖墅南路→环城北路→中山北路→庆春路→浣纱路→平海路→延安路。  \n临时撤销：武林小广场、延安新村、孩儿巷、胜利剧院（往城站方向）4对（只）站；临时增设：武林广场北、小北门2对站。\n\n**199路**  \n首班起，濮家桥始发终点调至武林小广场；武林小广场始发经武林路→体育场路→环城西路→莫干山路循原线返回。  \n临时撤销：武林广场南1只站及环北新村始发站；临时增设：武林小广场始发站。\n\n**277路**  \n首班起，西溪湿地北总站始发终点调至东山弄；东山弄始发经浙大路→曙光路→求是路→玉古路循原线返回。  \n临时撤销：浙大玉泉校区（往西溪湿地北）、曙光公寓、岳坟、葛岭、昭庆寺北（往龙翔桥总站方向）、少年宫（往西溪湿地北）、凤起路十四中、地铁凤起路站E口（往西溪湿地北）、孩儿巷9对（只）站及龙翔桥公交总站始发站；临时增设：浙大附中（往西溪湿地北）1只站及东山弄始发站。\n\n**290路**  \n首班起，双方向均绕行莫干山路→环城北路→中山北路→庆春路→浣纱路→平海路→延安路，避开武林门/孩儿巷/胜利剧院。  \n临时撤销：武林门、延安新村、孩儿巷、胜利剧院（往城站方向）4对站；临时增设：武林广场北1对站。\n\n**313路**  \n首班起，瓶窑窑山总站始发终点调至武林门北（②站台）；经湖墅南路→密渡桥路；武林门北始发经密渡桥路→环城北路→湖墅南路循原线返回。  \n临时撤销：武林广场（往瓶窑方向）、武林小广场（往瓶窑方向）2只站及环北新村总站始发站；临时增设：武林门北始发站。\n\n---\n\n#### 第三批：4月26日7时起（南山路/之江路，共7条）\n\n**4路**  \n6:15起，龙翔桥公交总站始发绕行延安路→高银街→中河南路→复兴路→之江路至九溪公交总站；九溪始发绕之江路→复兴路→中河南路→惠民路→延安路返回。  \n临时撤销：地铁吴山广场站C口、荷花池头、清波门（往九溪）、南山路万松岭路口、长桥、净寺（往九溪）、苏堤（往九溪）、苏堤南口（往龙翔桥）、赤山埠、动物园、虎跑、钱江大桥、六和塔12对（只）站；临时增设：鼓楼、复兴路紫花路口、闸口（地铁水澄桥站）、之江路六和塔4对站。\n\n**9路**  \n6时起，火车东站西始发终点调至十亩田；十亩田始发经复兴南街→化仙桥路→复兴路循原线返回。  \n临时撤销：之江路海月路口（往化仙桥南）、化仙桥（往火车东站西）、十亩田（往火车东站西）3只站及化仙桥南始发站；临时增设：十亩田始发站。\n\n**39路**  \n6时起，龙坞里桐坞总站始发绕行复兴路→江城路→中河南路；所巷始发绕中河南路→江城路→复兴路返回。  \n临时撤销：八卦田（往龙坞方向）、复兴城市家园、大资福庙前、里太祖湾、梵天寺路、馒头山6对（只）站；临时增设：复兴路紫花路口1对站。\n\n**42路**  \n6:15起，调整为近江一园至荷花池头（原至陶瓷品市场总站）；荷花池头始发经河坊街→劳动路→高银街→延安路→西湖大道→南山路返回。  \n临时撤销：钱王祠（往近江一园）、清波门（往近江一园）、南山路万松岭路口、阔石板、丝绸博物馆、玉皇飞云（往陶瓷品市场总站）、南观音洞、施家山8对（只）站及陶瓷品市场总站始发站；临时增设：荷花池头始发站。\n\n**62路**  \n6:15起，浙医一院始发绕行复兴南街→海月路→复兴路→水澄北路→虎玉路至陶瓷品市场总站；陶瓷品市场总站方向不变。  \n临时撤销：十亩田（往陶瓷品市场方向）、化仙桥（往陶瓷品市场方向）2只站。\n\n**87路**  \n首班起，双方向均绕行虎跑路→虎玉路→水澄北路→复兴路，避开南山路/玉皇山路。  \n临时撤销：动物园东（往三廊庙方向）、九曜山、南观音洞、玉皇飞云（往三廊庙）、施家山、八卦田6对（只）站；临时增设：虎跑、动物园（往三廊庙方向）2对（只）站。\n\n**354路**  \n首班起，水澄桥始发方向绕行复兴路→化仙桥路→复兴南街→海月路至复兴路后循原线至转塘公交总站；转塘公交总站方向不变。\n\n---\n\n#### 首班推迟及运营调整（共9条）\n\n| 线路 | 调整内容 |\n|------|----------|\n| **139路** | 婺江路银鼓路口6:30-8:30暂停运营；闸口首班推迟至**8:45** |\n| **510路** | 武林广场西首班推迟至**9:00** |\n| **1314路** | 一公园首班推迟至**9:00** |\n| **WE1314路** | 吴山广场总站首班推迟至**8:30** |\n| **里太祖湾至太子湾接驳线** | 里太祖湾157号首班推迟至**9:15**；虎玉路商务中心小客车换乘点同步推迟9:15 |\n| **西湖内环线** | 六公园首班推迟至**8:45** |\n| **西湖外环线** | 白堤首班推迟至**8:45** |\n| **将台山停车场旅游大巴换乘点** | 推迟至**9:15**启用 |\n| **龙翔桥至灵隐专线** | 龙翔桥公交总站首班推迟至**8:00** |\n\n---\n\n#### 赛事保障用车\n电车分公司承担保障用车28辆：志愿者接送车22辆、医务志愿者接送车2辆、收容车4辆。\n\n#### 赛道管控预估时间（附件）\n\n| 路段 | 管控起始 | 预计解除 |\n|------|---------|---------|\n| 体育场路（展览西路至延安路）北半幅 | 6:40 | 7:21 |\n| 延安路（体育场路至凤起路）西半幅 | 6:40 | 7:42 |\n| 延安路（凤起路至庆春路）西半幅 | 6:40 | 7:47 |\n| 庆春路（延安路至环城西路）南半幅 | 6:40 | 7:52 |\n| 环城西路沿湖半幅 | 6:40 | 7:43 |\n| 北山街（环城西路至保俶路）南半幅 | 6:50 | 7:58 |\n| 北山街（保俶路至断桥）全幅 | 6:50 | 8:00 |\n| 孤山路、北山街（西泠桥至苏堤北口）全幅 | 6:50 | 8:20 |\n| 南山路（苏堤南口至玉皇山路）全幅 | 7:10 | 8:54 |\n| 玉皇山路（南山路至莲花峰路）西半幅 | 7:15 | 9:02 |\n| 玉皇山隧道、南复路全幅 | 7:15 | 9:11 |\n| 南复下穿隧道（虎玉路至之江路）西半幅 | 7:20 | 9:17 |\n| 之江路（南复路至飞云江路折返点）南半幅 | 7:25 | 10:24 |\n| 新业路西半幅 | 7:50 | 10:25 |\n\n> 备注：最终以910指挥中心指令为准。\n\n"},{"title":"四、线路临时调整（大型活动）","text":"\n### 4.1 演唱会期间531M路临时调整（2026年4月17日起）\n\n**背景**：4月17日起，因奥体中心演唱会，扬帆路、科技馆街实施封道，531M路起点调整。\n\n**调整方案：**\n\n起点调整为\"新中北家园中\"至\"扬帆路丹枫路口北\"（原扬帆路丹枫路口北不再作为起点）。\n\n**新中北家园中往科技馆街飞虹路口方向：**\n- 绕道走丹枫路、机场城市大道、滨盛路，循原线路行驶\n- 临时撤销：扬帆路丹枫路口北、奥体街飞虹路口、科技馆街飞虹路口（3个站点）\n\n**科技馆街飞虹路口方向往新中北家园中方向：**\n- 循原线路开行\n- 临时撤销：科技馆街飞虹路口、奥体街飞虹路口（2个站点）\n\n**生效时间：** 08:35起，视封道情况调整\n\n### 4.2 331路施工改造调整 + 331B路新开（2026年4月19日起）\n\n**背景**：太坞山隧道施工改造，331路调整走向，龙坞区域同步配套出行方案。\n\n**331路调整**：直行过太坞山隧道后继续经留泗路行驶，不再进入龙坞深处。\n\n**配套措施：**\n- **1407路**：增设白龙潭路灵龙路口1对双向停靠站；施工期间增开白龙潭路采青路口至象山区间车\n- **331B路（新开）**：龙坞葛衙庄总站 ↔ 留下西，4月19日起开行\n  - 葛衙庄总站首末班：6:00-18:00（整、半点发车）\n  - 留下西首末班：6:15-18:45（15分、45分发车）\n\n**龙坞乘客出行指引：**\n1. 原兔子山站乘客 → 步行至留泗路隧道口太坞山北临时站乘331路\n2. 原葛衙庄/葛衙庄总站乘客 → 步行至龙坞葛衙庄总站乘331B路去留下；或步行至白龙潭路采青路口乘395路/1407路去转塘\n3. 原白龙潭路沿线去留下方向 → 马路对面乘331B路\n4. 原白龙潭路沿线去转塘方向 → 乘395路/1407路\n\n**来源：** 杭州公交微信公众号（2026-04-17）\n\n### 4.3 西湖南线部分公交线路停靠站点及服务时间调整（2026年4月18日起）\n\n**背景**：太子湾郁金香展结束，综合南山路沿线客流变化，自4月18日起调整。\n\n**生效期：** 4月18日至5月10日，每逢双休日执行。\n\n**一、分站停靠调整**\n\n南山路沿线长桥、净寺、苏堤、苏堤南口站双休日停靠安排：\n\n| 站点方向 | 长桥 | 净寺 | 苏堤南口 | 苏堤 |\n|----------|------|------|----------|------|\n| 北侧 | 4、139、510、1314路、西湖内环线 | 4、139、1314、大红豆数字旅游专线、里太祖湾至太子湾专线、西湖内环线 | / | 4、139、510、1314路、大红豆数字旅游专线、西湖内环线 |\n| 南侧 | 4、139路、西湖外环线 | / | 4、1314路、太子湾接驳1号线、太子湾接驳7号线 | / |\n\n> 注：4路仅在双休日10:00前及17:30后停靠上述站点\n\n**二、线路走向恢复**\n\n- **12、42路**：双休日恢复停靠南山路万松岭路口、清波门、钱王祠，不再绕行中河路\n- **31路**：双休日恢复至地铁吴山广场站C口始发，不再改走劳动路\n\n**三、服务时间调整**\n\n- **4路**：龙翔桥/九溪总站绕行万松岭隧道时间由9:45提早至9:30；恢复原走向时间由18:00提早至17:00\n- **太子湾接驳1号线**（双休日）：龙翔桥总站 9:30-15:00；苏堤南口 10:00-18:00\n- **太子湾接驳7号线**（双休日）：吴山广场总站 9:00-15:00；苏堤南口 10:00-17:30\n\n**来源：** 集团客运管理部docx内部文件\n\n### 4.4 533路书音路管网施工结束恢复走向（2026年4月22日起）\n\n**背景**：书音路管网施工结束，533路自4月22日头班起恢复原走向。\n\n**调整详情：**\n\n浙二医院∙马市街始发 → 循原线至奔竞大道 → 经书音路 → 循原线至友佳路乐达路口\n\n友佳路乐达路口始发 → 循原线至盈丰路 → 经书音路、奔竞大道 → 循原线至浙二医院∙马市街\n\n**停靠变化：**\n- 恢复停靠：书音路盈丰路口（只）、书音路奔竞大道（只）——2对双向站\n- 撤销：金鸡路盈丰路口（1对双向站）\n\n**生效时间：** 2026年4月22日头班起\n\n**来源：** 内部群通知\n\n---\n\n"},{"title":"五、\"五一\"假期运营保障（2026年5月1日至5日）","text":"\n**来源：** 杭州市公共交通集团有限公司（2026年4月25日）  \n**假期：** 5月1日至5月5日，共5天  \n**预计客流：** 全市公交客运总量约780万人次，同比增长1.92%\n\n---\n\n### 5.1 客流特点\n\n1. **春假叠加提前启动：** 4月27日起全国多地安排春假，交通枢纽客流高峰提前至4月26日；5月1/2日及5月6日0-4时铁路增开列车，夜到达客流增加。\n2. **景区漫展双热点：** 客流高峰集中在5月2日至3日，灵隐、雷峰塔、白堤、九溪、龙井等西湖核心区域客流集中；青山湖、天目山、湘湖等近郊热度上升；恒隆广场4月28日开业，武林商圈回暖；**\"CP32\"漫展**5月1日至5日在杭州大会展中心举办，参展客以外地青年为主，5月1/2/4日主要前往下沙、临江、大江东方向，5日重点做好交通枢纽接驳。\n3. **大客流与极端天气风险交织：** 气象预报五一期间易出现强对流天气。\n\n---\n\n### 5.2 指挥体系：\"一总五分九包干\"\n\n- **一总：** 龙翔桥公交总站（节假日运营保障现场指挥中心）\n- **五分：** 灵隐、苏堤南口、将台山、西溪路、杭州大会展中心（分别由汽一、汽二、电车、汽五、钱塘分公司负责）\n- **九包干（景区责任单元）：** 湖滨、黄龙、西溪、灵隐、九溪虎跑、南山、北山、水澄桥、大会展\n\n**交警勤务指挥中心驻点：** 景区大队→930（集团）；上城大队→920（汽二分公司）；西湖大队→950（电车公司）\n\n---\n\n### 5.3 运力投放\n\n- 全司日出车计划 **6194辆**（去年同期96.81%）\n- 西湖景区出车 **1173辆**（去年同期91.36%）\n\n---\n\n### 5.4 重点线路调整\n\n| 线路 | 调整内容 | 责任单位 |\n|------|----------|----------|\n| 4、12、42路 | 绕行外围 | — |\n| 27、277路 | 绕行曙光路行驶，加强276H/277路区间运力 | — |\n| 308、314、354、500、514路 | 加大转塘、水澄桥至九溪运力投入 | 汽二分公司、富阳公司 |\n| 194、318路 | 加强杭州花圃月季花展营运关注与现场管理 | 汽二分公司 |\n| 278、319路 | 临安公司支援 | 临安公司 |\n| 775路、湘湖南环线 | 针对湘湖/青山湖热点区域针对性举措 | 萧山公司 |\n| 324H路 | 首班后由富阳公司整体负责运营 | 富阳公司 |\n| 地铁八百里站至青山湖水上森林接驳线 | 加强营运关注 | 临安公司 |\n\n**太子湾接驳专线（南山路进城方向分站停靠）：** 太子湾接驳1号线（龙翔桥公交总站→苏堤南口）、太子湾接驳5号线（吴山广场总站→苏堤南口）\n\n---\n\n### 5.5 各公司支援安排\n\n| 单位 | 支援任务 | 运力 |\n|------|----------|------|\n| 余杭公司 | 黄龙洞至上天竺专线；参与CP32漫展保障 | 12-13辆 |\n| 萧山公司 | 动物园至地铁龙翔桥专线；里太祖湾出租网约车接驳；联动139/194路；支援太子湾接驳1号线；参与CP32漫展保障 | ≥16辆 |\n| 富阳公司 | 首班后324H路整体运营；308路区间（闸口-九溪）；5月3日318路区间（黄龙洞-六和塔）；参与CP32漫展保障 | ≥10辆（308）；≥10辆（318）|\n| 临安公司 | 5月1-2日278/319路支援；5月1-2日西溪路停车场接驳线支援 | 5月1-2日≥16辆 |\n| 钱塘公司 | 主要负责CP32漫展保障 | — |\n\n**机关党团员志愿者支援：** 闸口、苏堤南口（机动大队、修理分公司）；灵隐公交总站、长桥、南山路玉皇山路口、小牙坞、苏堤南口、西溪路608号、灵隐路32号换乘中心；5月1日至3日集团机关派员支援灵隐公交总站、西溪路换乘中心。\n\n---\n\n### 5.6 CP32漫展 & 杭州大会展中心接驳方案\n\n**CP32漫展：** 5月1日至5日，杭州大会展中心，参展客以外地青年群体为主\n\n#### 接驳线汇总\n\n| 序号 | 线路名称 | 起点 | 终点 | 运营时间 | 班次 | 责任单位 |\n|------|----------|------|------|----------|------|----------|\n| 1 | 接驳A1线 | 接驳A区（P1停车场） | 19号线耕文路站 | 8:00-19:00 | 约8分钟/班 | 萧山公司 |\n| 2 | 接驳A2线 | 接驳A区（P1停车场） | 19号线知行路站 | 8:00-19:00 | 约8分钟/班 | 萧山公司 |\n| 3 | 接驳A3线 | 空港新天地 | 19号线永盛路站 | 9:00-19:00 | 约5分钟/班 | 萧山公司 |\n| 4 | 停车场接驳A4线 | 德信之翼社会停车场 | 接驳A区 | 8:00-14:30/9:00-19:00 | 约15分钟/班 | 萧山公司 |\n| 5 | 萧山文旅特别专线1 | 钱江世纪城 | 6号线奥体中心 | 15:00-19:00 | 坐满即走，最大间隔≤15分钟 | 萧山公司 |\n| 6 | 接驳B1线 | 接驳B区（中环路，港城大道以北） | 8号线河庄路站 | 15:00-19:00 | 坐满即走，最大间隔≤15分钟 | 钱塘公司 |\n| 7 | 接驳C1线 | 接驳C区（港城大道） | 7号线义蓬站 | 15:00-19:00 | 约5分钟/班 | 萧山公司 |\n| 8 | 萧山文旅特别专线2 | 接驳D区（中环路，港城大道以南） | 2/5号线人民广场站 | 16:30-19:00 | 坐满即走，最大间隔≤20分钟 | 钱塘公司 |\n| 9 | 火车东站专线 | 接驳D区（中环路，港城大道以南） | 1/4/6/19号线火车东站 | 15:00-19:00 | 坐满即走，最大间隔≤15分钟 | 富阳公司 |\n\n#### 大会展现场管理点\n\n| 序号 | 现场管理点 | 责任单位 | 呼号 | 报到时间 |\n|------|----------|----------|------|----------|\n| 1 | 接驳区A（P1停车场） | 萧山、钱塘、余杭公司 | 891 | 萧山8:30；钱塘/余杭13:30 |\n| 2 | 接驳区B（中环路，港城大道以北） | 钱塘公司 | 892 | 13:30至发放结束 |\n| 3 | 接驳区C（港城大道） | 萧山公司 | 893 | 13:30至发放结束 |\n| 4 | 接驳区D（中环路，港城大道以南） | 钱塘公司 | 894 | 13:30至发放结束 |\n| 5 | 接驳区D（中环路，港城大道以北） | 富阳公司 | 895 | 13:30至发放结束 |\n| 6 | 地铁永盛路站 | 萧山公司 | 897 | 9:00-14:30 |\n| 7 | 赭美路南阳路口 | 余杭公司 | 898 | 14:50至散场结束 |\n\n### 4.3 3143路临时绕道（2026年4月23日起）\n\n**原因：** 十三工段大车多路阻\n\n**调整方案：** 东江始发至十三工段，经红十五线、新世纪大道后循原线行驶至新湾公交站。\n\n**临时撤销站点：** 十三工段、十二工段（2只单向停靠站）\n\n**生效时间：** 2026年4月23日8:10起\n\n"},{"title":"五、来源索引","text":"\n| 序号 | 类别 | 标题 | 来源 | 发布时间 |\n|------|------|------|------|----------|\n| 1 | 会议 | 市公交集团召开2026年度工作会 | hzbus.com.cn | 2026-01-23 |\n| 17 | 运营 | 清明祭扫出行指南（10条接驳线全览） | 杭州公交微信公众号 | 2026-04-01 |\n| 2 | 会议 | 孔利华：杭州公交集团2026年的发展目标和具体举措 | sohu.co 路 | 缩线至阿里西溪园区总站/地铁池华街站 |\n| 353路 | 缩线至仓前李家塘 |\n| 382路 | 缩线至聚橙路联创街口 |\n| 592路 | 缩线至何母桥 |\n| 599路 | 文一西路隧道绕行 |\n\n---\n"},{"title":"三、苕溪嘉年华活动公交调整（2026年3月25日）","text":"\n**来源**：2026苕溪嘉年华活动公交调整方案\n\n**活动日期**：2026年3月28日（周六）\n\n### 调整线路（3条）\n\n| 线路 | 调整说明 |\n|------|----------|\n| 346路 | 余杭西站改经彭凤线、通北路、禹航路、凤新路 |\n| 356路 | 余杭西站改经彭凤线、通北路、禹航路、凤新路 |\n| 506路 | 余杭西站改经彭凤线、通北路、禹航路 |\n\n---\n\n*汇总日期：2026年3月26日*\n"}],"size":1363},"公告汇编":{"sections":[{"title":"杭州公交公告汇编","text":"\n**最后更新时间：** 2026-05-21\n\n---\n"},{"title":"5月23日起，因崇杭街（崇超南路至方马路）段将封闭施工，临时调整7439路部分走向","text":"\n- **发布时间：** 2026-05-21\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9284)\n\n因杭州地铁四期15号线崇贤站施工需要，为确保道路交通有序、安全，根据公安机关交通管理部门交通组织措施，自5月23日起，崇杭街（崇超南路至方马路）段将封闭施工，涉及7439路需临时调整部分线路走向，具体为：\n\n### 调整后线路走向\n\n临平新丰总站始发，循原线至崇杭街，**双向改经来贤路、前村街、崇超南路、崇杭街**后再循原线至勾庄农副物流总站。\n\n### 站点变化\n\n- **临时撤销：** 方马家塘1对双向停靠站\n- **临时增设：** 顾家塘1对双向停靠站\n- **站名更名：** 石塘南更名为大花桥\n\n### 注意事项\n\n以上调整均为**临时性**调整，待崇杭街（崇超南路至方马路）段施工结束后，线路将恢复原走向。\n\n---\n"},{"title":"自5月22日起，优化287路、1702路","text":"\n- **发布时间：** 2026-05-20\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9283)\n\n为进一步优化公交线网布局，近期将在九和路地铁站优化1条\"5分钟接驳巴士\"，并对287路进行调整，具体如下：\n\n### 一、1702路调整详情\n\n**调整目的：** 进一步提升运营效率，优化为\"5分钟接驳巴士\"\n\n**线路端点变更：**\n- 调整前：福临街普照巷口 ↔ 金禾街九睦路口\n- 调整后：福临街普照巷口 ↔ 地铁九和路站（A·C）\n\n**调整后线路走向：**\n\n- **往地铁九和路站方向（下行）：** 福临街普照巷口始发，经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）\n- **往福临街普照巷口方向（上行）：** 地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口\n\n**撤销站点（共8对/只）：**\n- 地铁九和路站（A·C）（往金禾街九睦路口方向）\n- 九和路九环路口\n- 九和路牛泰巷口（往福临街普照巷口方向）\n- 地铁九堡站C口\n- 牛田社区（往金禾街九睦路口方向）\n- 牛田（往金禾街九睦路口方向）\n- 九睦路九沙大道口（往金禾街九睦路口方向）\n- 九沙大道杭海路口（往福临街普照巷口方向）\n- 金禾街九睦路口始发站\n\n**新增站点：**\n- 地铁九和路站（A·C）始发站（新增始发站）\n\n**升级为\"5分钟接驳巴士\"：**\n- 福临街普照巷口出发：07:30-08:30，发车间隔约6分钟\n- 地铁九和路站出发：17:30-19:00，发车间隔约6分钟\n\n### 二、287路调整详情\n\n**调整目的：** 方便皋塘片居民出行\n\n**线路端点（不变）：** 浙大二院滨江院区北 ↔ 浙大二院城东院区\n\n**调整后线路走向：**\n- **往浙大二院城东院区方向（有调整）：** 浙大二院滨江院区北始发，循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区\n- **往浙大二院滨江院区北方向：** 不变\n\n**站点变化：**\n- **撤销：** 皋塘桥西（往浙大二院城东院区方向）1只单向停靠站\n- **增设：** 艮新天桥北（往浙大二院城东院区方向）、皋塘运都（往浙大二院滨江院区北方向）等单向停靠站\n\n**调整后线路长度：** 下行19.1公里\n\n以上两条线路其余内容不变。\n\n---\n"},{"title":"5月18日起，新增长河街道南片接驳线","text":"\n- **发布时间：** 2026-05-19\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9265)\n\n为进一步提升公交服务品质，优化长河街道区域公交线网，切实强化耕文路、振宁路等地铁站的公交接驳效能，更好满足周边居民日常出行需求，结合线路运营实际，近期将新增长河街道南片接驳线，调整519路，具体如下：\n\n### 1．新开线路：长河街道南片接驳线\n\n- **线路类型：** \"六进\"服务线\n- **起讫点：** 映翠雅苑 至 长虹南苑\n- **开通日期：** 2026年5月18日\n- **票价：** 每人次贰元，各类IC卡及移动支付通用\n\n**去程线路走向：** 映翠雅苑始发，经漫湖巷、长江路、天马路、时代大道辅路、白马湖路、江虹南路、冠山路、长江路、滨文路、东冠路、南川路、清旷街至长虹南苑。\n\n**回程线路走向：** 长虹南苑始发，经清旷街、信诚南路、滨文路、长江路、冠山路、江虹南路、白马湖路、时代大道辅路、天马路、腾龙路、映翠路、漫湖巷至映翠雅苑。\n\n**沿途停靠站（5对双向停靠站）：** 双贤桥、山一村、白马湖路腾龙路口、白马湖小区鸿雁苑、月湾潭\n\n**服务时间：**\n- 映翠雅苑：7:00、8:40、17:00、18:40\n- 长虹南苑：7:50、9:30、17:50、19:30\n\n### 2．调整线路：519路\n\n- **起讫点：** 江陵路公交总站 至 地铁耕文路站B口\n- **调整日期：** 2026年5月16日\n- **其余不变。**\n\n**调整后的线路走向：**\n\n去程：江陵路公交总站始发，循原线至利华路，经生兴路、鸿宁路、通惠北路后循原线至地铁耕文路站B口。\n\n回程：地铁耕文路站B口始发，经学知路、弘慧路、奔竞大道、通惠北路、鸿宁路、生兴路、利华路后循原线至江陵路公交总站。\n\n**撤销站点（5对双向停靠站）：** 利华路生兴路口、陆路口岸、宁牧、宁新、通惠北路鸿达路口\n\n**增设站点（7对双向停靠站）：** 地铁兴议站B口、文明路利丰路口、振宁路丰二路口、振宁路永晖路口、生兴路汝宁弄口、生兴路扬帆路口、二桥村\n\n---\n"},{"title":"5月18日起，优化提升1106、1219路等线路、调整部分站名","text":"\n- **发布时间：** 2026-05-19\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9264)\n\n为进一步提升公交服务品质，合理配置公交资源，扩大部分区域5分钟巴士通勤圈覆盖范围，强化皋亭坝、古翠路等地铁站的公交接驳效能，方便市民高效换乘出行。结合线路运营实际，近期将对1106、1219路进行优化提升，纳入\"5分钟巴士\"运营体系，具体如下：\n\n### 一、升级\"5分钟巴士\"\n\n#### 1. 调整皋亭坝北至中塘的1106路\n\n**服务时间调整：**\n- 中塘：7:00-9:30、17:00-19:00\n- 皋亭坝北：7:10-9:40、17:10-19:10\n\n**升级内容：**\n- 线路提升为\"5分钟巴士\"\n- 早高峰皋亭坝北8:30-9:20发车间隔约7分\n- 晚高峰中塘17:20-18:30发车间隔约7分\n- 线路实行响应式停靠\n\n**其余不变，调整日期为2026年5月18日**\n\n#### 2. 将1219路提升为\"5分钟巴士\"\n\n**发车间隔：**\n- **早高峰：**\n  - 文三古翠总站7:00-8:00发车间隔约7分\n  - 三坝7:30-8:30发车间隔约7分\n- **晚高峰：**\n  - 文三古翠总站17:00-18:00发车间隔约7分\n  - 三坝17:30-18:30发车间隔约7分\n\n**其余不变，调整日期为2026年5月18日**\n\n### 二、调整站名\n\n结合原武林广场周边公交站名、设置地理布局，为进一步提升市民辨识度，自5月18日起，将原展览东路\"武林广场\"公交站更名为\"武林广场东\"\n\n**涉及线路**：313、318C、506C、520、8202、8211、8218路及大红豆数字旅游专线\n\n**补充说明**：8192、8193路待下批武林广场周边线路时一并调整\n\n### 三、调整部分线路停靠站及夜间线始发站\n\n#### 1. 318C路（转塘公交总站/龙坞葛衙庄总站→武林广场东）\n\n在\"武林小广场\"与\"轮船码头\"之间**增设**\"环北新村\"1只单向停靠站\n\n**调整日期**：2026年5月18日\n\n#### 2. 506C路（中泰公交总站→武林广场东）\n\n在\"闲林工业区\"与\"闲林埠\"之间**增设**\"闲林北\"1对双向停靠站\n\n**调整日期**：2026年5月18日\n\n#### 3. 8202路（武林广场东→转塘公交停车场）\n\n- 在\"梵村\"与\"九溪\"之间**增设**\"珊瑚沙水库\"1对双向停靠站\n- 该线的\"艮山门东站\"**更名**为\"艮山门东\"\n\n**调整日期**：2026年5月19日\n\n#### 4. 8259路（大关小区总站→汽车客运中心西）\n\n**调整后的线路走向**：大关小区总站始发，经香积寺路、大关苑路、大关路、绍兴路、香积寺路后循原线至汽车客运中心西\n\n**增设**：大关东五苑、大关小区北2只单向停靠站\n\n**其他调整**：大关小区总站始发站位置调整至与578路并站\n\n**调整日期**：2026年5月19日\n\n---\n"},{"title":"5月10日起，调整95、135等线路","text":"\n- **发布时间：** 2026-05-08\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9168)\n\n为进一步优化线网结构，提升公交服务水平，结合古扇弄、华西路、太公街等道路开通，方便石桥铭苑、华丰欣苑、联发悦望荟等小区居民出行，自2026年5月10日起调整95、135路部分线路走向：\n\n### 95路（丁桥公交总站 ↔ 运河广场）\n仅调整丁桥公交总站→运河广场方向的部分走向，返程不变：\n- 调整后走向：丁桥公交总站始发，循原线至石桥路，经古扇弄、石桥苑巷、石祥路后再循原线至运河广场。\n- 站点调整：撤销石桥路石祥路口1只单向停靠站；增设老汽轮厂、石桥铭苑2只单向停靠站。\n- 其余不变。\n\n### 135路（千桃园 ↔ 艮山门东）\n双向调整部分走向：\n- 调整后走向：艮山门东始发，循原线至新汇路，双向经华西路、太公街、华中路后再循原线至千桃园。\n- 站点调整：撤销太公街1只单向停靠站（开往艮山门东方向）；增设华西路南、长善、水车头3对双向停靠站，以及水车头1只单向停靠站（开往艮山门东方向）。\n- 其余不变。\n\n---\n"},{"title":"恢复40、80、156路线路走向","text":"\n- **发布时间：** 2026-04-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9160)\n\n凯旋路（严家路-凤起东路）临时交通管控结束，恢复双向通行，即时起，40、80、156路恢复凯旋路原线路走向及停靠站点，具体为：\n\n1. **40路**，恢复为三里亭临时总站始发，循原线至机场路，经凯旋路、凤起东路后循原线至吴山广场北；吴山广场北始发，循原线至凤起东路，经凯旋路、机场路后循原线至三里亭临时总站。**撤销：** 艮山闸、市红会医院北2对双向停靠站；**恢复：** 华家池北、浙大华家池校区、凤起东路凯旋路口（开往吴山广场北方向）、凤起立交（开往三里亭临时总站方向）4对（只）停靠站。\n\n2. **80路**，恢复为大关北公交总站始发，循原线至凯旋路，经采荷路后循原线至雷霆路望江东路口；雷霆路望江东路口始发，循原线至凯旋路，经凯旋路后循原线至大关北公交总站。**撤销：** 艮山闸（开往大关北公交总站方向）、市红会医院北（开往大关北公交总站方向）、严家弄（开往雷霆路望江东路口方向）、景芳亭（开往雷霆路望江东路口方向）、双菱路北口（开往雷霆路望江东路口方向）5只单向停靠站；**恢复：** 华家池北（开往大关公交总站方向）、浙大华家池校区、凤起立交3对（只）停靠站。\n\n3. **156路**，恢复为翠苑四区始发，循原线至环城北路，经凯旋路、凤起东路后循原线至民心路江锦路口；民心路江锦路口始发，循原线至凤起东路，经凯旋路、环城北路后循原线至翠苑四区。**撤销：** 艮山闸、市红会医院北2对双向停靠站；**恢复：** 华家池北、浙大华家池校区、凤起东路凯旋路口3对双向停靠站。\n\n---\n"},{"title":"因凯旋路（严家路-凤起东路）实施双向交通管控，4月29日起，临时调整40、80、156路线路走向","text":"\n- **发布时间：** 2026-04-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9147)\n\n因凯旋路（严家路-凤起东路）实施双向交通管控，4月29日起，涉及40、80、156路临时调整部分线路走向，具体为：\n\n1. **40路**，临时调整为三里亭临时总站始发，循原线至机场路，经艮山西路、环城东路、凤起立交、凤起东路后循原线至吴山广场北；吴山广场北始发，循原线至凤起东路，经凤起立交、环城东路、艮山西路、机场路后循原线至三里亭临时总站。**临时撤销：** 华家池北、浙大华家池校区、凤起东路凯旋路口（开往吴山广场北方向）、凤起立交（开往三里亭临时总站方向）4对（只）停靠站；**临时增设：** 艮山闸、市红会医院北2对双向停靠站。\n\n2. **80路**，临时调整为大关北公交总站始发，循原线至凯旋路，经严家路、秋涛路、凤起东路、凯旋路后循原线至雷霆路望江东路口；雷霆路望江东路口始发，循原线至凯旋路，经太平门直街、双菱路、凤起东路、凤起立交、环城东路、艮山西路、机场路后循原线至大关北公交总站。**临时撤销：** 华家池北（开往大关公交总站方向）、浙大华家池校区、凤起立交3对（只）停靠站；**临时增设：** 艮山闸（开往大关北公交总站方向）、市红会医院北（开往大关北公交总站方向）、严家弄（开往雷霆路望江东路口方向）、景芳亭（开往雷霆路望江东路口方向）、双菱路北口（开往雷霆路望江东路口方向）5只单向停靠站。\n\n3. **156路**，临时调整为翠苑四区始发，循原线至环城北路，经环城东路、凤起立交、凤起东路后循原线至民心路江锦路口；民心路江锦路口始发，循原线至凤起东路，经凤起立交、环城东路、环城北路后循原线至翠苑四区。**临时撤销：** 华家池北、浙大华家池校区、凤起东路凯旋路口3对双向停靠站；**临时增设：** 艮山闸、市红会医院北2对双向停靠站。\n\n---\n"},{"title":"5月1日起，调整1314路等线路","text":"\n- **发布时间：** 2026-04-29\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9135)\n\n为进一步优化公交服务质量，提升线路运营效率，自5月1日起调整1314路等线路：\n\n1. **调整1314路**（宋城东门总站至一公园）部分线路走向：调整后的线路走向为宋城东门总站始发，循原线至南山路，经西湖大道、延安路、南山路至一公园；一公园至宋城东门总站方向不变。**撤销：** 涌金门（开往一公园方向）1只单向停靠站；**增设：** 涌金门东（开往一公园方向）、饮马井巷（开往一公园方向）2只单向停靠站。\n\n2. **调整法华寺接驳线**为东岳社区接驳线：城西公园至法华寺的法华寺接驳线调整为城西公园至东方中学，线路名称改为东岳社区接驳线。调整后的线路走向：城西公园始发，经天目山路、紫金港路、西溪路至西溪路小龙驹坞路口折返，再经西溪路至东方中学；东方中学始发，经西溪路、紫金港路至紫金港路西溪路口折返，再经紫金港路、明谷街至城西公园。沿途停靠：东岳（开往东方中学方向）、东岳社区换乘站。服务时间（仅双休节假日运营）：城西公园为8:00-16:00；东方中学为9:00-17:00。\n\n---\n"},{"title":"5月1日起，恢复331路线路走向","text":"\n- **发布时间：** 2026-04-28\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9133)\n\n因绕城高速公路（龙坞段）涵洞提升改造工程施工结束，5月1日起，将恢复331路走向：\n\n1. **331路调整**：艺创小镇总站始发，循原线至留泗路，经白龙潭路、上城埭路、灵龙路后循原线至留下南。**恢复：** 龙坞、白龙潭路叶埠桥路口、白龙潭路灵龙路口、白龙潭路采青路口、葛衙庄总站外（招呼站）、葛衙庄、兔子山7对双向停靠站。**撤销：** 太坞山北双向停靠站。\n\n2. **停运1407区间车**：白龙潭路采青路口至象山的1407区间车。\n\n3. **停运331B路**：龙坞葛衙庄总站至留下西的331B路。\n\n---\n"},{"title":"2026杭州女子半程马拉松赛期间，55条线路临时调整","text":"\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9118)\n\n为配合2026杭州女子半程马拉松赛（\"杭州女马\"）举办，赛事期间相关路段实施交通管控，对公交线路进行临时调整。\n\n**调整概况：** 本次共涉及55条公交线路临时调整，其中46条调整线路走向，9条调整首班时间或运营时段。\n\n**主要调整线路：**\n- 4路、5路、7路、9路、10路、11路、12路、13路、14路、16路、18路、21路、22路、25路、26路、27路、28路、31路、39路、42路、45路、46路、49路、62路、78路、87路、92路、101路、102路、103路、113路、126路、151路、K155路、186路、188路、199路、277路、290路、313路、318路、506路、8192路、8202路、8218路\n\n**运营时间调整线路：**\n- 139路：婺江路银鼓路口6:30至8:30间暂停运营，闸口首班推迟至8:45\n- 510路：武林广场西首班推迟至9:00\n- 1314路：一公园首班推迟至9:00\n- WE1314路：吴山广场总站首班推迟至8:30\n\n市民可通过\"杭州公共交通\"App查询具体调整信息，也可在涉及调整的线路车辆及沿线站点查看调整公告。\n\n---\n"},{"title":"4月27日起，新增1711路，优化提升389、1213路等线路为\"5分钟巴士\"","text":"\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9117)\n\n为进一步提升公交服务品质，合理配置公交资源，优化丰收湖区域线网，扩大部分区域\"5分钟巴士通勤圈\"覆盖范围，强化白洋、金沙湖等地铁站的公交接驳效能。\n\n**新增线路：1711路**\n- 起讫点：九环路九华路口 ↔ 地铁乔司南站（A·B）\n- 运营时间：仅工作日开行，早高峰6:30-9:00，晚高峰17:00-19:30\n- 票价：1元/人次，实行响应式停靠\n\n**优化提升为\"5分钟巴士\"的线路：**\n1. 389路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n2. 1213路：早高峰发车间隔约6分钟\n3. 1216路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n4. 1709路：早高峰发车间隔约7分钟，晚高峰发车间隔约7分钟\n5. 2073路：早高峰发车间隔7分钟，晚高峰发车间隔7分钟\n6. 3105路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n7. 7709路：发车间隔约7分钟\n\n**站点调整：**\n- 128路：双向增设停靠站\n\n**停驶线路：**\n- 7710路：2026年4月27日起停驶，调整后的2073路、7709路已覆盖原服务范围\n\n---\n"},{"title":"因银湖街道创意路（富闲路-望湖路）提升改造，4月25日起，调整546、592、596路等线路","text":"\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9108)\n\n因银湖街道创意路（富闲路-望湖路）提升改造，施工期间该路段机动车禁止通行，自2026年4月25日起调整部分线路走向。\n\n**线路调整：**\n1. **546路**：石马公交总站始发方向调整，改经彩虹快速路至地铁银湖站\n2. **592路**：火车西站始发方向调整，改经上林南路后循原线，临时撤销「地铁银湖站」1个单向停靠站\n3. **596路**：富阳公交总站始发方向调整，改经彩虹快速路后循原线，临时撤销「麓园」1个单向停靠站\n\n---\n"},{"title":"因书音路管网施工结束，4月22日起，恢复533路线路走向","text":"\n- **发布时间：** 2026-04-17\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9082)\n\n因书音路管网施工结束，定于2026年4月22日头班起，恢复533路线路走向，具体如下：\n\n**533路调整后走向：**\n- 浙二医院∙马市街始发，循原线至奔竞大道，经书音路后循原线至友佳路乐达路口\n- 友佳路乐达路口始发，循原线至盈丰路，经书音路、奔竞大道后循原线至浙二医院∙马市街\n\n**站点调整：**\n- **恢复停靠：** 书音路盈丰路口、书音路奔竞大道口2对停靠站\n- **撤销临时站点：** 金鸡路盈丰路口1对停靠站\n\n---\n"},{"title":"因绕城高速公路（龙坞段）涵洞提升改造工程施工，4月19日起，调整部分公交线路","text":"\n- **发布时间：** 2026-04-17\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9086)\n\n因绕城高速公路（龙坞段）涵洞提升改造工程施工需要，4月19日起，留泗路与上城埭路的连接线禁止车辆通行，331路及配套线路调整如下：\n\n### 1. 331路调整\n- **调整后走向：** 艺创小镇总站始发，循原线至留泗路，向北直行过太坞山隧道，继续经留泗路行驶\n- **撤销站点：** 龙坞、白龙潭路叶埠桥路口、白龙潭路灵龙路口、白龙潭路采青路口、葛衙庄总站外（招呼站）、葛衙庄、兔子山7对双向停靠站\n- **增设站点：** 太坞山北双向停靠站\n\n### 2. 配套保障措施\n- **395路、1407路** 增设「白龙潭路灵龙路口」双向停靠站；1407路「江口村」站更名为「江口」\n- **增开1407路区间车：** 白龙潭路采青路口至象山，与1407路长线交替发车，高峰间隔不大于15分钟，平峰不大于30分钟\n- **增开331B路：** 龙坞葛衙庄总站至留下西，沿途停靠白龙潭路采青路口、白龙潭路灵龙路口等13对双向停靠站，服务时间6:00-18:00（每逢整、半点发车）\n\n---\n"},{"title":"4月18日起，调整西湖南线部分公交线路停靠站点及服务时间","text":"\n- **发布时间：** 2026-04-16\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9081)\n\n随太子湾郁金香展结束，综合南山路沿线客流情况变化，自4月18日起，调整西湖南线部分公交线路停靠站点及服务时间：\n\n### 1. 分站停靠调整（4月18日-5月10日双休日执行）\n南山路沿线长桥、净寺、苏堤、苏堤南口站点调整停靠线路，4路仅在双休日10:00前及17:30后停靠上述站点。\n\n### 2. 线路走向及服务时间调整\n- **12、42路：** 双休日恢复停靠南山路万松岭路口、清波门、钱王祠公交站，不再绕行中河路\n- **31路：** 双休日始发站恢复为地铁吴山广场站C口，不再改走劳动路\n- **4路：** 绕行万松岭隧道时间由9:45提早至9:30，恢复原走向时间由18:00提早至17:00\n- **太子湾接驳1号线：** 双休日服务时间调整为龙翔桥公交总站9:30-15:00，苏堤南口10:00-18:00\n- **新开太子湾接驳7号线：** 仅双休日运营，吴山广场总站9:00-15:00，苏堤南口10:00-17:30\n\n---\n"},{"title":"4月4日起，调整354路停靠站点","text":"\n- **发布时间：** 2026-04-02\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9034)\n\n为进一步优化公交线网布局，缓解闸口站往白塔方向的客流压力，自2026年4月4日起，354路增设「之江路六和塔」1对双向停靠站。\n\n---\n"},{"title":"因清江路之江路口、清江路钱江路口高架桥梁拆卸施工，临时调整清江路部分路线走向","text":"\n- **发布时间：** 2026-03-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9005)\n\n因清江路之江路口、清江路钱江路口高架桥梁拆卸施工需要，临时调整9路、29路、64路部分走向及停靠站点：\n\n### 1. 3月28日23时至次日6时清江路之江路口封控（雨天顺延）\n- **64路** 临时调整为由解放东路经富春路、婺江路、之江路、衢江路至近江一园站，临时撤销地铁市民中心站N口、景江城市花园东门、之江路衢江路口3只停靠站。\n\n### 2. 4月10日-12日每日23时至次日6时多路段封控（雨天顺延）\n- **9路** 双向经城星路、富春路、衢江路后循原线，临时撤销钱江路城星路口、钱江路衢江路口2对（只）停靠站\n- **29路** 经秋涛路、婺江路、富春路后循原线，临时撤销观音塘思安坊、清静弄、近江小区、近江六园4只单向停靠站\n"}],"size":11043},"公告汇编2026":{"sections":[{"title":"杭州公交公告汇编（2026年）","text":"\n---\n"},{"title":"2026年4月19日起 | 331路施工改造调整","text":"\n### 调整原因\n\n331路因太坞山隧道施工改造，调整后直行过太坞山隧道，改道经留泗路行驶，不再进入部分原路段。\n\n### 新增/调整公交安排\n\n#### 1407路调整\n- **增设站点**：白龙潭路灵龙路口（双向停靠）\n- **增开区间车**：施工期间加开「白龙潭路采青路口 ↔ 象山」区间车\n\n#### 331B路（新开）\n| 方向 | 站点 | 发车时间 |\n|------|------|---------|\n| 去程 | 龙坞葛衙庄总站 | 6:00-18:00（每逢整点、半点发车） |\n| 返程 | 留下西 | 6:15-18:45（每逢15分、45分发车） |\n\n### 乘客出行指引\n\n#### 前往留下方向\n| 原上车站点 | 替代方案 |\n|-----------|---------|\n| 兔子山 | 步行至「太坞山北」临时站乘331路 |\n| 葛衙庄 | 步行至「太坞山北」临时站乘331路，或乘331B路 |\n| 白龙潭路沿线 | 步行至「太坞山北」临时站乘331路，或乘331B路 |\n\n#### 前往转塘方向\n| 原上车站点 | 替代方案 |\n|-----------|---------|\n| 葛衙庄 | 乘395路或1407路 |\n| 白龙潭路沿线 | 乘395路或1407路 |\n| 白龙潭路叶埠桥路口 | 步行至「灵龙路白龙潭路口」站换乘 |\n\n### 备注\n- 331B路为施工期间新开线路，施工结束后另行通知\n- 详情可拨打杭州公交服务热线咨询\n\n---\n\n*录入时间：2026-04-18*\n"}],"size":723},"重要文件汇编(Claw)":{"sections":[{"title":"杭州公交集团2026年度重要文件汇编","text":"\n更新时间：2026-04-07（自动更新）\n\n---\n"},{"title":"一、集团重要会议与战略部署","text":"\n### 1.1 2026年度工作会（2026年1月23日）\n\n杭州市公共交通集团召开2026年度工作、基层党组织书记述职暨\"两保一优\"工作会议。\n\n**参会人员**：集团公司领导班子全体成员、市属国企外部董事、副处级及以上干部、全体中层干部、各分公司（余杭、萧山、钱塘、富阳、临安公司）领导班子成员、杭德公司负责人、受表彰的先进代表及职工代表等。\n\n**主要内容**：\n- 表彰2025年度先进集体与个人\n- 电车分公司、余杭公司、传媒集团党组织书记进行述职\n- 党委委员、副总经理陶雪军作《固本强基提素质 智慧护航新征程 奋力提升企业本质安全水平》安全工作报告\n- 党委副书记、总经理周琮辉作《承压奋进布新局 实干担当开新篇》年度工作报告，围绕五个方向部署2026年工作：\n  - 恪守为民本心，推动品质服务与品牌形象双向升级\n  - 强化精准施策，实现精益管理与产业协同双轮驱动\n  - 稳健运营治理，夯实存量物业与资产盘活双线\n  - 聚焦科技驱动，推进智慧转型与数据价值双翼齐飞\n  - 筑牢思想根基，强化党建引领与人才优势双核赋能\n- 党委书记、董事长孔利华从政治引领、巡察整改、主责主业、改革创新、作风建设、凝心聚力六个方面肯定2025年成绩，提出2026年五点要求\n\n### 1.2 新春第一会（2026年3月3日）\n\n市公交集团召开新春第一会，传达省市\"新春第一会\"精神，部署开局攻坚工作。\n\n**会议主持**：党委副书记、副董事长、总经理周琮辉\n\n**核心部署（\"三个进一步\"）**：\n- 主责主业提质增效，筑牢品质公交民生根基\n- 推动产业协同互促共进，激活生态公交造血动能\n- 深化数智赋能创新突破，打造智慧公交强劲引擎\n- 坚持党建引领强基固本，凝聚保障公交奋进合力\n\n### 1.3 孔利华：2026年发展目标和具体举措（2026年2月6日）\n\n杭州市城投集团党委委员、副总经理，市公交集团党委书记、董事长孔利华接受\"对话一把手\"栏目采访，阐述2026年规划：\n\n**三大关键突破领域**：\n- **产业强企**：科技集团推进轻资产转型；传媒集团深化\"公交+广告+文旅\"融合；出租集团构建\"降本增效、激发活力、拓展边界\"新格局；物产集团深耕物业核心业务\n- **创新立势**：\"5分钟巴士\"扩容至100条线路；推出\"2026公交准时计划\"；推广\"云公交3.0\"（无固定区域、全时段响应模式）；升级车厢内外电子屏，构建实时信息网\n- **改革破局**：完善公司治理结构；推动全流程精益化；做好巡察整改\"后半篇文章\"；深化全面预算管理\n\n**一季度\"开门红\"行动**：\n- \"2026公交准时计划\"作为年度首项重点任务\n- \"5分钟巴士\"一季度末线路规模达65条（全年目标100条）\n- 在萧山、富阳、临安等区域推出20条\"班次时刻化\"线路\n\n**服务品质提升**：\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%；2026年全网推行\n- 适老化适幼化服务：更新无障碍车辆、改造站台设施\n- 智慧出行：迭代\"杭州公共交通\"APP，推出\"公交碳积分\"激励机制\n\n---\n"},{"title":"二、重大采购与招标","text":"\n### 2.1 1208辆纯电动公交车采购项目\n\n**发布时间**：2026年2月4日（招标公告）\n\n**项目规模**：\n- 762辆8米级纯电动城市公交客车及其8年全生命周期维保服务\n- 446辆10米级纯电动城市公交客车及其8年全生命周期维保服务\n- 共计1208辆\n- **总预算超10亿元**\n\n**中标结果**（2026年3月13日发布公示）：\n- **中标候选人**：吉利四川商用车有限公司\n- **中标金额**：约9.58亿元（投标报价95805万元）\n\n### 2.2 杭州之江汽车销售有限公司出租车车载顶灯采购项目（第三次）\n\n**发布时间**：2026年1月19日\n\n---\n"},{"title":"三、运营服务动态","text":"\n### 3.1 春运保障（2026年春节期间）\n\n**夜间服务延长**（2026年2月9日起）：\n- **杭州东站**：33路、43路、93路、108路、123路延长夜间服务；8028路、8179路加班运营（春节前2月9-10日、2月12-15日；春节后2月21-25日）\n- **杭州站（城站）**：290路、8251路延长夜间服务\n- **杭州西站**：468路、8203路延长夜间服务\n\n**\"西站暖巴\"春运服务**：\n- 接站服务：良渚仁和线、闲林线、古荡黄龙线（预约制，通过\"杭州公共交通APP\"预约，最长等待时间不超过30分钟）\n- 送站服务：良渚线、仁和线\n\n### 3.2 春节公交运营（2026年春节期间）\n\n**西湖景区客流数据**：\n- 春节假期（截至2月23日）累计运送乘客330.35万人次，日均客流量为去年同期114.13%\n- 连续刷新客流纪录：\n  - 2月19日（年初三）：45.54万人次\n  - 2月20日（年初四）：48.37万人次\n  - 2月21日（年初五）：50.14万人次\n\n**特色服务**：\n- 推出3条\"跟着《太平年》游杭州\"主题公交线，串联历史景点与特色街区\n- 主题线路累计服务9.8万人次，社交媒体曝光量超8000万次\n\n### 3.3 清明祭扫公交保障（2026年3月起）\n\n**龙居寺扫墓专线**（2026年3月21日起开通）：\n- 起点：地铁3号线华鹤街站D口\n- 终点：龙居寺（千桃园）\n- 票价：1元\n- 运营时间（仅双休日）：\n  - 华鹤街地铁站→龙居寺：首班7:00，末班14:00\n  - 龙居寺→华鹤街地铁站：首班9:00，末班15:30\n- 陵园内设有免费接驳车，为行动不便市民提供上山接送服务\n- 服务热线：851919122\n\n**第二公墓地铁接驳线**：\n- 地铁石马站↔第二公墓\n- 首末班：7:00-15:00 / 7:20-15:20\n- 票价：1元\n\n### 3.4 太子湾郁金香赏花接驳线（2026年3月6日—4月12日）\n\n**郁金香接驳线基础版**（2026年3月3日发布）：\n- **起点**：候潮门地铁站（雄镇楼）\n- **终点**：苏堤南口（雷峰塔）\n- **走向**：候潮门地铁站→江城路→上仓桥路→严官巷→万松岭隧道→美术馆街→南山路→苏堤南口\n- 沿途停靠：净寺（单向，仅开往苏堤南口方向）\n- **运营时间**：候潮门地铁站8:30-15:00；苏堤南口11:00-17:30\n- **票价**：2元/人次，支持IC卡及移动支付\n\n**太子湾3条赏花接驳专线（3月11日增开，与地铁编号对应）**：\n- **太子湾接驳1号线**（周末及节假日）：龙翔桥公交总站（地铁1号线）→苏堤南口，9:30-15:30/10:30-18:30，票价2元\n- **太子湾接驳5号线**（全周开行）：雄镇楼（地铁5号线候潮门站）→苏堤南口，8:30-15:30/11:00-17:30，票价2元\n- **太子湾接驳7号线**（周末及节假日）：吴山广场总站（地铁7号线）→苏堤南口，9:00-15:30/9:30-18:30，票价2元\n\n**出行建议**：工作日可通过地铁5号线换乘接驳5号线，周末建议错峰，亦可选4路、139路等常规公交。\n\n### 3.5 大型活动交通保障（2026年3月22日）\n\n**2026西湖半程马拉松**（3月22日）：\n- 部分道路3月21日22时起管控\n- 赛道管控：3月22日6时起分段管控黄龙路、曙光路、保俶路、北山街、孤山路等\n- 倡议市民优先选择公交出行\n\n**2026临平半程马拉松**（3月22日）：\n- 部分道路3月21日12时起管控\n- 涉及望梅路、迎宾路、藕花洲大街、邱山隧道、荷禹路等\n\n---\n\n### 3.6 周杰伦「烟花杭州·嘉年华」演唱会公交+文旅配套方案（2026年4月1日）\n\n**发文单位：** 杭州公交集团有限公司\n**联动单位：** 杭州市文化广电旅游局\n**活动背景：** 抢抓\"演艺经济\"发展机遇，创新文旅服务供给，助力杭州打造\"演艺之都\"和高水平国际旅游目的地\n\n#### 一、演唱会嗨巴（火车东站直达奥体专线）\n\n| 项目 | 内容 |\n|------|------|\n| **主题车辆** | 浙A06485D（主车）、浙A07150D（备用车） |\n| **始发站** | 杭州火车东站东广场公交总站 |\n| **终点站** | 科技馆街飞鸿路口公交站（奥体中心周边） |\n| **线路走向** | 火车东站东广场公交总站 → 新塘路 → 东宁路 → 昙花庵路 → 空港大道 → 彭埠大桥 → 空港大道 → 平澜路 → 滨盛路隧道 → 扬帆路 → 丹枫路 → 科技馆街飞鸿路口 |\n| **运营日期** | 4月3日、4日、5日（周杰伦杭州演唱会期间，共三天） |\n| **发车时间** | 每日15:00、16:30两个班次定点发车 |\n| **运营特点** | 中途不停站，直达演唱会场馆，\"下高铁到场馆\"无缝衔接 |\n| **推出方** | 杭州公交集团联合杭州市文化广电旅游局 |\n\n#### 二、杰迷专属西湖夜游定制过山车Pro主题观光巴士\n\n| 项目 | 内容 |\n|------|------|\n| **主题车辆** | 浙A05715D、浙A07926D |\n| **始发站** | 奥体开元名都酒店 |\n| **终点站** | 胜利剧院 |\n| **线路走向** | 奥体开元名都酒店 → 奔竞大道 → 江南大道 → 复兴大桥 → 万松岭隧道 → 南山路 → 杨公堤 → 曙光路 → 浙大路 → 玉古路 → 求是路 → 曙光路 → 杨公堤 → 南山路 → 西湖大道 → 延安路 → 开元路 → 浣纱路 → 庆春路 → 延安路 → 胜利剧院 |\n| **运营日期** | 4月3日、4日、5日（周杰伦杭州演唱会期间，共三天） |\n| **发车时间** | 每日晚上22:00左右（提前购票歌迷全上车后发车） |\n| **覆盖亮点** | 西湖夜景精华：杨公堤、南山路、西湖大道、延安路商圈；贯穿万松岭隧道连接奥体与西湖 |\n\n#### 三、与清明保障叠加分析（4月4-6日）\n\n**客流叠加区域：**\n- **奥体中心**：演唱会三天（4月3-5日）与清明假期（4月4-6日）重叠，预计4月4-5日客流量达峰值\n- **杭州东站**：演唱会散场返程客流 + 清明祭扫返程客流叠加；33/43/93/108/123/8028/8179路已加密备勤\n- **西湖景区**：夜游巴士覆盖南山路、杨公堤等路段，预计清明旅游客流较高\n\n**演唱基本信息（补充）：**\n- **演出时间：** 2026年4月3日、4日、5日（清明小长假三天）\n- **演出地点：** 杭州奥体中心体育场（\"大莲花\"）\n- **演出主题：** 「烟花杭州·嘉年华」2026世界巡回演唱会\n- **门票：** 780元-2380元；2月25日开票，24万张1分钟内售罄\n\n#### 四、531M路临时调整通知（2026年4月3日）\n\n**调整原因：** 扬帆路、科技馆街演唱会封道\n\n**调整后路线：** 新中北家园中 ⇆ 扬帆路丹枫路口北\n\n**新中北家园中往科技馆街飞虹路口方向：**\n- 绕道：丹枫路 → 机场城市大道 → 滨盛路 → 循原线路\n- **临时撤销站点：** 扬帆路丹枫路口北、奥体街飞虹路口、科技馆街飞虹路口（共3个站点）\n\n**科技馆街飞虹路口方向往新中北家园中方向：**\n- 循原线路开行\n- **临时撤销站点：** 科技馆街飞虹路口、奥体街飞虹路口（共2个站点）\n\n**执行日期：** 2026年4月3日至5日（演唱会期间）\n\n---\n"},{"title":"四、智慧公交与科技创新","text":"\n### 4.1 自动驾驶公交\n\n**杭州公交大模型**：\n- 杭州市公交集团于2025年建成全国首个公交大模型，依托杭州城投基座模型，接入多维度专有数据\n- 实现安全画像生成、下客客流精准分析等功能\n\n**钱塘区自动驾驶公交**（2026年3月19日起试运行）：\n- 杭州市首批持证上路的载客自动驾驶公交\n- 开通2条线路，投入5辆自动驾驶巴士\n  - 一条工作日开行\n  - 一条双休日及节假日开行\n- 预约方式：现场扫码或小程序搜索\"钱塘区智能网联巴士\"预约\n- 票价：免费\n- 计划增设3条新线路，覆盖文旅景区、高教园区等区域\n\n**滨江白马湖线智能环线**（2026年2月10日正式载客运营）：\n- 线路里程：8.6公里\n- 运营时间：每日8:30-18:30\n- 核心站点：白马湖南站、白马湖北站、地铁聚才路D口公交站、滨康路长江路口站\n- 车辆：3台L4级无人小巴循环运行\n- 自动驾驶覆盖率：85%以上路段\n- 背景：2025年10月起空车测试，累计安全运行超8000公里、488小时\n\n**战略合作**（2026年3月20日）：\n- 武汉元光与杭州数知梦订立战略合作框架协议，在公交自动驾驶领域开展深度合作\n\n### 4.2 智慧服务升级\n\n- 响应式停靠改革：全市539条线路已实施，平均提速7.14%\n- \"云公交3.0\"：无固定区域、全时段响应模式\n- 车厢内外电子屏升级：构建\"车外—车内—站台—掌上\"实时信息网\n- \"公交碳积分\"激励机制\n\n---\n"},{"title":"五、公交线网优化","text":"\n### 5.1 2026年主要优化方向\n\n- \"5分钟巴士\"全年目标100条线路（一季度65条）\n- \"班次时刻化\"线路：萧山、富阳、临安等区域推出20条，实现班次可查可预期\n- 响应式停靠：2026年全网推行，对10公里以上长线路实行\"分区段计时\"机制\n\n### 5.2 历年延续服务\n\n- 每年清明、冬至期间开通多条扫墓地铁接驳线和扫墓快线\n- \"西站暖巴\"等定制客运服务持续运营\n\n---\n"},{"title":"六、政策与行业规划","text":"\n### 6.1 杭州市交通运输局2026年工作重点（与公交相关）\n\n- **公交优先**：构建\"地铁+快速接驳线+高频骨干线\"多元网络，优化地铁接驳线，新增\"类地铁\"公交线路\n- **交旅融合**：打造杭黄跨省航线，升级景区直达、高校假日等定制客运服务\n- **智慧交通**：持续推进\"人工智能+交通运输\"，深化智能网联汽车试点\n- **绿色交通**：全面推广新能源交通工具，创建\"交能融合示范区\"\n- **低空经济**：设立低空交通运行管理机构，推进无人机公共起降场建设\n\n---\n"},{"title":"八、2026年3月线路具体调整明细","text":"\n### 8.1 3月26日线路调整\n\n**发布日期**：2026年3月24日\n\n**新开通：**\n- **1418路**（\"5分钟巴士\"，工作日高峰运营）\n  - 起讫点：燕庐巷口/地铁科海路站 ↔ 地铁科海路站/青蓝路北\n  - 早高峰：燕庐巷口出发，6:45-9:00，间隔约7分钟\n  - 晚高峰：地铁科海路站出发，17:05-19:00，间隔约7分钟\n  - 票价：1元\n\n**调整线路：**\n- **3路**（大关小区总站↔南落马营总站）：终点延伸至南落马营总站，新增西湖文化广场、候潮东路秋涛路口等停靠站；21时后短途折返至市三医院北\n- **9路**（火车东站西↔化仙桥南）：走向调整，经皋塘二路口折返后绕行，撤销皋塘东等站，新增骏塘名庭北/南等站\n- **345路**：\"欢中路临丁路口\"与\"长睦锦苑\"之间新增\"周杨村\"双向停靠站\n- **533路**：撤销往浙医二院方向的\"浙医二院正门\"单向停靠站\n\n### 8.2 3月28日线路调整\n\n**发布日期**：2026年3月25日\n\n**新开通：**\n- **1102H路**（仅限青少年宫上课期间运营）\n  - 起讫点：地铁独城生态公园站 ↔ 杭州青少年宫半山分中心\n  - 走向：经平炼东路、康园南路、炼铁街运行，途经杭钢公园1号高炉\n  - 运营时段：8:00-10:00，12:40-16:20（地铁侧）；8:10-9:50，12:30-16:30（青少年宫侧）\n  - 票价：1元\n  - 背景：配合大运河杭钢公园杭州青少年宫半山分中心启用\n\n**调整线路：**\n- **1213路**（三墩景溪南苑总站↔浙江医院三墩院区）：撤销开往三墩景溪南苑总站方向\"广业街墩池路口\"1只单向停靠站\n\n### 8.3 3月27日线路调整（施工临时绕行）\n\n**发布日期**：2026年3月26日\n\n**调整线路：**\n- **96路**（将军路东 ↔ 西陵路南环路口）：因江陵路跨铁立交桥施工，江陵路南环路口交通组织调整\n  - 将军路东出发方向：原线行驶至江陵路后，改经聚园路→聚业路→南环路→西陵路南环路口\n  - 返程方向不变\n  - 沿途站点均不撤销\n  - **背景**：江陵路跨铁立交桥施工期间临时调整\n  - **生效日期**：2026年3月27日起（长期）\n\n### 8.4 3月28日、4月10日清江路施工临时调整\n\n**发布日期**：2026年3月27日\n\n**调整线路：**\n- **64路**（大关小区总站 ↔ 近江一园）：3月28日23:00至次日06:00\n  - 绕行：解放东路 → 富春路 → 婺江路 → 之江路 → 衢江路\n  - 撤销：地铁市民中心站N口、景江城市花园东门、之江路衢江路口\n  - 雨天顺延\n\n- **9路**（火车东站西 ↔ 化仙桥南）：4月10日-12日每日23:00至次日06:00\n  - 绕行：钱江路 → 城星路 → 富春路 → 衢江路\n  - 撤销：钱江路城星路口、钱江路衢江路口\n  - 雨天顺延\n\n- **29路**（艮山门东站 ↔ 候潮东路富春路口）：4月10日-12日每日23:00至次日06:00\n  - 绕行：清江路 → 秋涛路 → 婺江路 → 富春路\n  - 撤销（单向）：观音塘思安坊、清静弄、近江小区、近江六园\n  - 雨天顺延\n\n- **执行要求**：二公司负责4月11日-13日05:30起现场管理（钱江路城星路口、秋涛路清江路口）\n\n### 8.5 3月29日起线路调整\n\n**发布日期**：2026年3月27日\n\n**调整线路：**\n- **398路**（翁梅公交总站 ↔ 笕桥公交总站）：2026年3月29日起恢复\n  - 原因：葛家车村保通便道具备通车功能\n  - 撤销：五星村、和睦村（2对站）\n  - 增设11对/只站：西何家（下行）、博卡路何家（下行）、葛家车十五组、葛家车村口、老葛家村、吴家车、葛家车村、大井、和睦桥路口、五星村工业园区、青石庙\n  - 线路长度：下行13.6KM，上行12.5KM\n\n- **青少年宫地铁接驳专线**：2026年3月30日起调整发车时间\n  - 起点：青少年宫北门（双休、节假日运营）\n  - 发车间隔：\n    - 8:10-10:10：≤15分\n    - 10:10-11:30：≤10分\n    - 11:30-16:30：≤15分\n    - 16:30-18:20：≤10分\n  - 末班时间：18:20\n\n### 8.6 2026年清明假期公交运营保障\n\n**发文单位：** 杭州市公共交通集团有限公司\n**发文日期：** 2026年3月26日\n**假期时间：** 4月4日至4月6日\n**客流预测：** 全市预计运送乘客500万人次，较去年同期增长1.03%\n**天气：** 晴好，气温舒适宜人\n**客流特点：** 祭扫客流集中、旅游客流暴涨、短途出行密集\n**高峰时段：** 墓区早7点至中午12点；景区全天高峰\n\n**重点景区：** 太子湾公园、雷峰塔、杨公堤、灵隐寺、龙井、九溪、翁家山、梅家坞、龙坞\n\n#### 重点保障区域与责任分工\n\n| 区域 | 责任单位 | 重点任务 |\n|------|----------|----------|\n| 龙井/梅家坞 | 汽一

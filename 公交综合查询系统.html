 **调整内容**:\n  - 翁梅公交总站始发（下行）：循原线至红普北路，经保庆街、博卡路、保通便道、永中路、乔笕线后再循原线至笕桥公交总站\n  - 笕桥公交总站始发：循原线至乔笕线，经永中路、保通便道、博卡路、南街后再循原线至翁梅公交总站\n  - **撤销站点**: 五星村、和睦村 2对双向停靠站\n  - **增设站点**: 西何家（下行）、博卡路何家（下行）、葛家车十五组、葛家车村口、老葛家村、吴家车、葛家车村、大井、和睦桥路口、五星村工业园区、青石庙 11对（只）停靠站\n  - 调整后线路长度：下行13.6KM，上行12.5KM\n\n### 2. 关于调整96路线路走向的通知\n- **来源**: 关于调整96路线路走向的通知 (2).docx / 关于调整江陵路沿线公交线路走向的通知\n- **发文日期**: 2026年3月26日\n- **生效日期**: 2026年3月27日\n- **原因**: 江陵路跨铁立交桥施工，江陵路南环路口交通组织调整\n- **调整内容**:\n  - 将军路东始发：循原线至江陵路，经聚园路、聚业路、南环路后至西陵路南环路口\n  - 西陵路南环路口至将军路东走向不变\n  - 沿途站点不撤销\n- **相关要求**:\n  1. 加强宣传，做好安全行车和优质服务工作，让司机熟悉路线\n  2. 完成电脑报站器语音灌制、站名表等服务标志制作安装、调度系统数据修改、线路走向轨迹更新\n  3. 落实原江陵路南环路口管理用房调整事宜\n  4. 加强宣传引导，落实车厢通告\n\n### 3. 关于调整青少年宫地铁接驳专线线路的通知\n- **来源**: 关于调整青少年宫地铁接驳专线线路的通知(1).doc\n- **生效日期**: 2026年3月30日\n- **调整内容**:\n  - 发车时间调整（双休、节假日）：\n    - 8:10-10:10：发车间隔不大于15分\n    - 10:10-11:30：发车间隔不大于10分\n    - 11:30-16:30：发车间隔不大于15分\n    - 16:30-18:20：发车间隔不大于10分\n  - 青少年北门末班时间调整为18:20\n\n### 4. 关于临时调整清江路部分路线走向的通知\n- **来源**: 关于临时调整清江路部分路线走向的通知.doc\n- **生效日期**: \n  - 64路：2026年3月28日23时至次日6时\n  - 9路、29路：2026年4月10日-12日每天23时至次日6时\n- **原因**: 清江路之江路口、清江路钱江路口高架桥梁拆卸施工\n- **调整方案**:\n  - **64路**（3月28日23时至次日6时）:\n    - 大关小区总站始发：临时撤销地铁市民中心站N口、景江城市花园东门、之江路衢江路口3只停靠站\n  - **9路**（4月10日-12日每天23时至次日6时）:\n    - 临时撤销钱江路城星路口、钱江路衢江路口2对停靠站\n  - **29路**（4月10日-12日每天23时至次日6时）:\n    - 临时撤销观音塘思安坊、清静弄、近江小区、近江六园4只单向停靠站\n- **相关要求**:\n  1. 加强宣传，做好安全行车和优质服务工作，让司机熟悉路线\n  2. 加强宣传引导，落实车厢通告\n  3. 二公司落实4月11日-13日5:30至施工结束钱江路城星路口、秋涛路清江路口2个点位现场管理\n"}],"size":1564},"【详细通知】287路、1702路优化（2026-05-22起）":{"sections":[{"title":"【详细通知】287路、1702路优化（2026-05-22起）","text":"自5月22日起，优化287路、1702路\n为进一步优化公交线网布局，近期将在九和路地铁站优化1条“5分钟接驳巴士”，并对287路进行调整，具体如下：\n1、为进一步提升运营效率，自5月22日起，将福临街普照巷口至金禾街九睦路口的1702路调整为福临街普照巷口至地铁九和路站（A·C）。调整后的线路走向：福临街普照巷口始发，经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）；地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口。撤销：地铁九和路站（A·C）（往金禾街九睦路口方向）、九和路九环路口、九和路牛泰巷口（往福临街普照巷口方向）、地铁九堡站C口、牛田社区（往金禾街九睦路口方向）、牛田（往金禾街九睦路口方向）、九睦路九沙大道口（往金禾街九睦路口方向）、九沙大道杭海路口（往福临街普照巷口方向）8对（只）停靠站及金禾街九睦路口始发站；增设：地铁九和路站（A·C）始发站。同时，线路提升为“5分钟接驳巴士”，福临街普照巷口口7：30-8：30间发车间隔约6分，地铁九和路站17：30-19：00间发车间隔约6分。其余不变。\n2、为方便皋塘片居民出行，自5月22日起，调整浙大二院滨江院区北至浙大二院城东院区的287路部分线路走向。调整后的线路走向：浙大二院滨江院区北始发，循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区；浙大二院城东院区至浙大二院滨江院区北方向不变。撤销：皋塘桥西（往浙大二院城东院区方向）1只单向停靠站；增设：艮新天桥北（往浙大二院城东院区）、（往浙大二院城东院区方向）、皋塘运都（往浙大二院滨江院区北方向）3只单向停靠站。调整后的线路长度：下行为19.1KM。其余不变。"}],"size":746},"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起）":{"sections":[{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起）","text":"关于做好147、312路等线路优化调整相关保障工作的通知\n各单位、各部室：\n为进一步优化公交线网布局，盘活运力资源，提升公共交通运营效能，经研究决定，自5月23日起对147路、312路等6条线路实施优化调整。为确保线路调整工作平稳有序推进，最大限度降低线路变动对市民日常出行造成的影响，现将有关事项通知如下："},{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起） - 一、调整方案","text":"1.停驶与312、7032路等线路重复度较高的147路。\n2.为弥补147路停驶后临半路、半山路北段的公交空白，方便石桥永丰片的居民出行，将地铁桃源街站（A·C）至城站火车站的312路调整为刘文村北至城站火车站，调整后的走向：车辆由石塘公交停车场驶出，经临半路、半山路、石桥路、永华街、竹清路、永波街、回龙路、石祥路、东新路、东新路跨线桥、东新路后再循原线至城站火车站；城站火车站始发，循原线至回龙路，经永波街、竹清路、永华街、石桥路、半山路、临半路至刘文村北，下客后车辆继续向北行驶至石塘公交停车场。撤销：地铁桃源街站B口（下行）、夏莲支路（下行）、半山金星、莫家门（下行）、杭州装饰城、北景竹邻苑（上行）、打铁关北（下行）8对（只）停靠站及地铁桃源街站（A·C）始发站，增设：刘文村、薄板分厂、沈家桥、焦化分厂、永华街竹清路口、北景枫丹苑东、回龙里、北景月桂苑1幢（招呼站）（上行）、北景园中心广场东（招呼站）9对（只）停靠站及刘文村北始发站。同时，在石塘公交停车场内设置内部上客点。调整后的线路长度：下行为20.1KM，上行为20.2KM。调整后的服务时间：刘文村北至城站火车站为4:50-20:50，城站火车站至刘文村北为6:10-22:10，刘文村北至打铁关为21:10-24:00，打铁关至刘文村北为22:00-23:10。其余不变。\n3.为确保147路停驶后崇杭街沿线居民前往东新路沿线的出行不受影响，对350、7032、380路线路走向做微调：\n（1）将塘栖人民路总站至草庵公交总站的350路调整为塘栖人民路总站至德胜东村总站，以确保崇杭街沿线居民能方便到达德胜东村周边。调整后的走向：塘栖人民路总站始发（上行），循原线至东新路，经香积寺路、再行路、德胜路至德胜东村总站；德胜东村总站始发（下行），经德胜路、东新路后循原线行驶（同时，因地铁15号线崇贤站施工，崇杭街部分路段封闭施工，350路崇贤段改经崇杭街、来贤路、前村街、崇超南路、崇杭街后再循原线至塘栖人民路总站）。撤销：方马家塘双向停靠站及草庵公交总站始发站，增设：崇贤张家桥、顾家塘、长木桥（下行）、三塘竹园（上行）4对（只）停靠站及德胜东村总站始发站。调整后的线路长度：下行为29.7KM，上行为32.3KM。调整后的服务时间：德胜东村总站为6:30-20:30，塘栖人民路总站为5:30-19:00。其余不变。\n（2）调整7032路部分走向，以确保崇杭街沿线居民能方便到达德胜东村周边。调整后的走向：焦家村公交总站始发（下行），循原线至东新路，经长浜弄、长浜路后再循原线至石前；石前始发，循原线至长浜路，经德胜路、东新路后再循原线至打铁关（同时，因地铁15号线崇贤站施工，崇杭街部分路段封闭施工，7032路崇贤段改经崇杭街、来贤路、前村街、崇超南路、崇杭街后再循原线至石前）。撤销：地铁杭氧站A口、方马家塘2对双向停靠站，增设：杭氧、东新路德胜路口、顾家塘、崇贤张家桥4对双向停靠站。其余不变。\n（3）将德胜东村总站至临平红丰桥总站的380路调整为草庵公交总站至临平红丰桥总站，调整后的走向：草庵公交总站始发（下行），经长浜路、香积寺东路、东新路后循原线至临平红丰桥总站；临平红丰桥总站始发，循原线至东新路，经德胜路至草庵公交总站，撤销：长木桥（下行）、三塘竹园（上行）2只单向停靠站及德胜东村总站始发站，增设：草庵公交总站始发站。调整后的线路长度：下行为29.7KM，上行为24.1KM。调整后的服务时间：草庵公交总站为6:40-19:50，临平红丰桥总站为5:30-18:30。同时，“临平红丰桥”更名为“临平红丰桥总站”，“汀城街汀兰路口”更名为“汀城街汀兰街口”。其余不变。\n4.为弥补312路调整后半山路沿线居民至桃源街地铁站换乘的公交空白，调整512（512B）路部分走向。调整后的走向：吴家墩西苑始发（下行），循原线至桃源街，双向经夏莲路、夏莲支路、春蓝路、桃源街后再循原线至半山公交总站。撤销:原设在桃源街上的“地铁桃源街站A口”（上行）1只单向停靠站，增设:地铁桃源街站A口（注：设在春蓝路上）、地铁桃源街站B口（上行）、夏莲支路3对（只）停靠站。同时，下行原设在桃源街上的“地铁桃源街站A口”站更名为“地铁桃源街站A口北”。调整后的线路长度：下行为7.6KM，上行为6.9KM。同时，法定工作日早晚高峰时段，通过增投区间运力，加密该线半山路公交站至半山金星站的区间班次。其余不变。\n5.63、146、1107B路线路走向不变，原设在桃源街上的“地铁桃源街站A口”站更名为“地铁桃源街站A口北”。"},{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起） - 二、保障措施","text":"（一）抓实宣传引导。集团办公室、客运部要全面拓宽宣传渠道，依托沿线公交站点、车厢语音广播、车内电子显示屏、官方微信公众号、官方微博等多元平台，提前张贴线路调整公告、站点变动详情与便民导乘指南，做到宣传无盲区、信息全覆盖，切实保障广大市民提前知晓调整内容，合理规划出行路线。同时，根据客流分布设置精准的乘车指引，指引具体内容详见附件1。\n（二）加强现场管理。此次公交线路优化调整涉及运营公司多、覆盖区域范围广，为确保线路调整工作平稳有序推进，线路调整后的一周内，由客运部统筹安排管理人员在关键点位进行值守，做好现场导乘、咨询解答、秩序维护等工作。电车分公司主要负责东新路、临半路原147路途经站点，余杭公司主要负责崇贤、德胜东村周边，汽五分公司主要负责半山路沿线、桃源街地铁站，汽二分公司主要负责杭氧地铁站。现场管理具体安排详见附件2。\n（三）做好舆情管理。办公室、客运部要建立舆情监测机制，安排专人负责关注各类媒体平台及市民反馈，及时回应市民疑问和诉求，妥善处置各类舆情问题。畅通信息收集渠道，通过官方反馈平台、工作人员现场信息收集等方式，做好市民对线路调整的意见建议收集，对合理建议及时研究采纳，持续优化线路运营服务。\n特此通知。\n附件：\n1、乘车引导设置要点\n2、现场管理点位\n杭州市公共交通集团有限公司\n2026年5月21日\n附件1：\n乘车引导设置要点"},{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起） - 一、原147路沿线","text":"1.崇贤段站点公告，应明确告知乘客改乘350、7032路可至德胜东村、东新路德胜路口。\n2.方马家塘站点公告，应明确告知乘客改至崇贤张家桥改乘350、7032路。\n3.临半路、半山路沿线站点公告，应明确告知乘客改乘312路可至北景园、东新园地铁站、打铁关地铁站。\n4.东新路德胜路口（东侧）站点公告，应明确告知乘客改乘7032路至崇贤，或至德胜东村总站改乘350路至崇贤。\n5.崇贤公交总站、锦昌年华小区、刘文村北、绍兴支路、打铁关、颜家村等站点，应设置较大款公告。"},{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起） - 二、312路沿线","text":"1.半山路沿线各站北侧及半山金星站公告，应明确告知乘客改乘512路可至地铁桃源街站。\n2.地铁桃源街站周边的2个站点公告，应明确告知乘客改乘512路可至杭钢南苑、半山桥等地。\n3.半山桥、杭钢南苑、阔板桥社区、地铁桃源街站A口（春蓝路上）、地铁桃源街站B口等站点，应设置较大款公告。\n4.与地铁集团联系，在桃源街站厅设置公告，引导前往杭钢南苑、半山桥沿线的乘客改乘512路，并明确换乘的出口。"},{"title":"【详细通知】147、312路等6条线路优化调整保障工作（2026-05-23起） - 三、7032路沿线","text":"1.道路南侧的地铁杭氧站A口站公告，应明确告知乘客至东新路上的“杭氧”站乘坐7032路。\n2.与地铁集团联系，在杭氧站厅内设置公告，引导乘客至东新路上的“杭氧”站乘坐7032路。\n附件2：\n现场管理点位\n序号\n站点\n责任公司\n责任人/联系电话\n主要工作职责\n到岗时间\n1\n打铁关（东侧）\n汽二公司\n施超炜662516\n引导原乘坐147路至崇贤的乘客改乘7032路；\n引导原乘坐147路至焦化分厂、沈家桥、刘文村等地的乘客改乘312路。\n17：00-19：30\n2\n地铁桃源街站A口\n（春蓝路上）（西侧）\n汽五公司\n戴轶军666502\n引导原乘坐312路至阔板桥、杭钢南苑、半山桥等地的乘客，至对向站点改乘512路。\n8：00-9：00/\n16：30-18：30\n3\n地铁桃源街站B口（北侧）\n汽五公司\n孙岚666501\n引导原乘坐312路至阔板桥、杭钢南苑、半山桥等地的乘客，至A口站点改乘512路。\n7：00-8：30\n4\n桃源街地铁站内\n汽五公司\n俞晨666701\n引导原乘坐312路至阔板桥、杭钢南苑、半山桥等地的乘客，从A口出站改乘512路。\n7：00-9：00/\n16：30-18：30\n5\n半山金星（北侧）\n汽五公司\n吴晨666302\n引导原乘坐312路至阔板桥、杭钢南苑、半山桥等地的乘客，至对向站点改乘146、512路。\n7：00-9：00\n6\n锦昌年华小区（南侧）\n余杭公司\n胡枭杰/542208\n引导原乘坐147路至东新路等地的乘客，请改乘350、7032路。\n主动告知至明珠实验学校的乘客，下客后请在德胜东村总站乘坐350路。\n6：30-9：00\n7\n陆家桥（南侧）\n余杭公司\n陈金莲/558101\n引导原乘坐147路至东新路等地的乘客，请改乘350、7032路。\n主动告知至明珠实验学校的乘客，下客后请在德胜东村总站乘坐350路。\n6：30-9：00\n8\n北景月桂苑（西侧）\n电车公司\n史蓉665702\n引导原乘坐147路至东新路等地的乘客，至“北景月桂苑1幢招呼站”或“北景园中心广场东招呼站”改乘312路。\n7：00-9：00\n9\n绍兴支路\n电车公司\n谢鑫665705\n引导原乘坐147路至半山等地的乘客，至“流水北苑”改乘312路。至崇贤的乘客，至打铁关改乘7032路。\n7：00-9：00\n10\n东新路德胜路口\n余杭公司\n胡枭杰/542208\n引导原乘坐147路至崇贤的乘客，改乘7032路，或在“德胜东村总站”改乘350路。\n16：30-17：30\n11\n半山桥（北侧）\n电车公司\n何涛665502\n引导原乘坐312路至地铁站的乘客，改乘512路。\n312路靠站时引导乘客看清方向。\n8：00-9：00/\n16：30-18：30\n12\n杭钢南苑（北侧）\n电车公司\n徐靖665505\n引导原乘坐312路至地铁站的乘客，改乘512路。\n312路靠站时引导乘客看清方向。\n8：00-9：00/\n16：30-18：30"}],"size":4329},"【详细通知】崇杭街封闭施工公交调整方案（2026-05-23起）":{"sections":[{"title":"【详细通知】崇杭街封闭施工公交调整方案（2026-05-23起）","text":"崇杭街封闭施工公交调整方案\n因杭州地铁四期15号线崇贤站施工需要，为确保道路交通有序、安全，根据公安机关交通管理部门交通组织措施，自5月23日起，崇杭街（崇超南路至方马路）段将封闭施工，涉及7439路需临时调整部分线路走向，具体如下：\n7439路，临平新丰总站始发，循原线至崇杭街，双向改经来贤路、前村街、崇超南路、崇杭街后再循原线至勾庄农副物流总站。临时撤销：方马家塘双向停靠站；临时增设：顾家塘双向停靠站；“石塘南”更名为“大花桥”。调整后的线路长度：下行为26.1KM；上行为28.3KM。\n集团客运管理部\n2026年5月21日"}],"size":267},"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起）":{"sections":[{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起）","text":"关于新增2条“5分钟接驳巴士”，试运营“北山街接驳线”及调整126、287路等线路的通知\n各单位、各部室：\n为进一步优化公交线网布局，盘活公交运力资源，近期将在西浦路地铁站、九和路地铁站新增2条“5分钟接驳巴士”，试运营北山街接驳线，并对126、287路等线路进行调整，具体如下："},{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起） - 一、新增“5分钟接驳巴士”","text":"1.为进一步提升运营效率，自5月22日起，将福临街普照巷口至金禾街九睦路口的1702路调整为福临街普照巷口至地铁九和路站（A·C）。调整后的线路走向：福临街普照巷口始发（下行），经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）；地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口。撤销：地铁九和路站（A·C）（下行）、九和路九环路口、九和路牛泰巷口（上行）、地铁九堡站C口、牛田社区（下行）、牛田（下行）、九睦路九沙大道口（下行）、九沙大道杭海路口（上行）8对（只）停靠站及金禾街九睦路口始发站；增设：地铁九和路站（A·C）始发站。同时，线路提升为“5分钟接驳巴士”，福临街普照巷口口7：30-8：30间发车间隔约6分，地铁九和路站17：30-19：00间发车间隔约6分。调整后的线路长度：下行为2.0KM，上行为1.7KM。其余不变。\n2.自5月25日起，将原地铁西浦路站D口至贝遨大厦接驳线的“六进”服务线转正为常规线，线路编码7179路。线路走向：早高峰由地铁西浦路站D口始发，经滨文路、西浦路、坚塔街、堤东路至堤东路生地街口（丁香中心西门）。沿途停靠：坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）、堤东路陆家潭街口（泰格药业）3只单向停靠站。晚高峰由潘曹街堤东路口（丁香中心南门）始发，经潘曹街、潮涌路、生地街、西浦路、坚塔街、闻涛路、滨文路至地铁西浦路站D口。沿途停靠：西浦路陆家潭街口、坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）3只单向停靠站。调整后的线路长度：早高峰为1.9KM，晚高峰为2.9KM。同时，线路提升为“5分钟接驳巴士”，地铁西浦路站D口7：50-9：30间发车间隔约7分，潘曹街堤东路口（丁香中心南门） 17：30-19：00间发车间隔约7分。其余不变。"},{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起） - 二、试运营北山街接驳线","text":"为方便北山街沿线游客前往黄龙洞地铁站，自5月23日起，试运营黄龙洞至黄龙洞的“北山街接驳线”。线路走向：黄龙洞始发，经曙光路、保俶路、北山街、曙光路至黄龙洞。该线在黄龙公交总站内蓄车。沿途停靠：松木场、省府大楼西、葛岭（断桥残雪）、新新饭店、岳坟、浙大附中6只单向停靠站。首末班时间（仅双休节假日开行）：黄龙洞至岳坟为9：30-15：30，葛岭至黄龙洞为11：00-17：30。线路长度：6.3KM。票价每人次贰元，各类IC卡及移动支付通用。"},{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起） - 三、调整线路","text":"1.自5月25日起，调整转塘公交总站至龙翔桥公交总站的4路快线发车时间。调整后的发车时间详见附表。其余不变。\n2.为缓解“武林广场西”东侧站点停站压力，自5月24日起，将武林广场西至九堡杭乔路总站的126路调整为武林广场东至九堡杭乔路总站。调整后的线路走向：武林广场东始发（下行），经展览东路、环城北路后循原线至九堡杭乔路总站；九堡杭乔路总站始发，循原线至体育场路，经展览东路至武林广场东。撤销：武林广场西始发站；增设：红普南路之江东路口1对双向停靠站及武林广场东始发站。调整后的首末班时间：武林广场东为6：25-21：40，九堡杭乔路总站为5：25-20：40。调整后的线路长度：下行为16.8KM，上行为16.3KM。其余不变。\n3.为进一步提升线路吸引力，减少乘客在途时间，自5月24日起，调整九堡四季青总站至四季青的225路部分线路走向。调整后的线路走向：九堡四季青总站始发（下行），循原线至钱塘快速路，经彭埠立交桥、空港高架路（昙花庵路匝道下）、钱畔隧道、钱江路、解放东路后循原线至四季青；四季青始发，循原线至钱江路，经钱畔隧道、空港大道、彭埠互通、钱塘快速路后循原线至九堡·四季青服装交易中心。撤销：云河家园（下行）、章家坝小区、新塘家园、水湘西苑、卢家塘、钱潮路塘潮街口、唐家井、钱江三苑、钱潮路钱江路口（上行）、钱潮路公交总站外（下行）、富春路民心路口、富春路丹桂街口、新业路市民中心13对（只）停靠站；增设：二堡、钱江路庆春东路口、钱江路江锦路口3对双向停靠站；“九堡·四季青服装交易中心”更名为“九堡四季青总站”。调整后的线路长度：下行为15.1KM，上行为13.9KM。同时，取消章家坝小区至四季青的225路区间。其余不变。\n4.为方便皋塘片居民出行，自5月22日起，调整浙大二院滨江院区北至浙大二院城东院区的287路部分线路走向。调整后的线路走向：浙大二院滨江院区北始发（下行），循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区；浙大二院城东院区至浙大二院滨江院区北方向不变。撤销：皋塘桥西（下行）1只单向停靠站；增设：艮新天桥北（下行）、皋塘北（下行）、皋塘运都（上行）3只单向停靠站。调整后的线路长度：下行为19.1KM。其余不变。\n5.自5月26日起，546路在“里山桥”与“清家坞”间，增设“洞山”1对双向停靠站。其余不变。\n6.自5月26日起，596路在“里山桥“与”清家坞”，“清家坞”与“午潮山北”间增设“洞山”、“地铁石马站”2对双向停靠站。其余不变。\n7.为填补大功巷公交空白，方便珠埠里一带居民出行，自5月27日起，将杨家里至东新路瑞银街口的1110路调整为珠埠里（新站）至东新瑞银总站。调整后的线路走向：珠埠里（新站，设在大功巷）始发（下行），经大功巷、绍兴路400弄、长德弄、再行路、香积寺路后循原线至东新瑞银总站；东新瑞银总站始发，循原线至香积寺路，经再行路、长德弄、绍兴路400弄、大成巷，春睦弄、大功巷至珠埠里。撤销：三塘小区、三塘南村、香积寺路白石巷口（上行）3对（只）停靠站及杨家里始发站；增设：六塘公寓（上行）、三塘汶园西、再行里、杨家里（上行）4对（只）单向停靠站及珠埠里始发站。“三塘竹苑”更名为“三塘竹园”，“东新路瑞银街口”更名为“东新瑞银总站”，原绍兴路400弄“珠埠里”站迁移至大功巷。该线在大成巷、春睦弄、大功巷区域实行循环运营。调整后的首末班时间：珠埠里为7：15-18：35（工作日）、7：30-18：35（双休、节假日）；东新瑞银总站为6：45-19：05（工作日）、7：00-19：05（双休、节假日）。调整后的线路长度：下行为5.5KM，上行为6.6KM。其余不变。\n8.为方便双浦区域学生上下学，自5月25日起恢复5483路，并将起讫点优化为如意尖至云浦佳苑三区。调整后的线路走向：如意尖始发（下行），循原线至灵龙路，经袁富路、科海路、夏铜街至云浦佳苑三区；云浦佳苑三区始发，经夏铜街、科海路、袁富路、灵龙路后循原线至如意尖。撤销：李乡潘家1对双向停靠站及周浦公交总站始发站；增设：云浦佳苑三区始发站。调整后的服务时间（仅工作日运营）：如意尖为7：20；云浦佳苑三区为16：45、17：45（周一至周四），16：00、17：45（周五）。调整后的线路长度：下行为8.72KM，上行为8.71KM。其余不变。\n9.将杭州汽车客运中心至三村南的5704路调整为地铁客运中心站D口至三村南。调整后的线路走向：地铁客运中心站D口始发，经九沙大道后循原线至三村南；三村南始发，循原线至杭乔路，经九沙大道至地铁客运中心站D口。撤销：杭州汽车客运中心始发站；增设：地铁客运中心站D口始发站。调整后的服务时间：地铁客运中心站D口为6:45，7:10，三村南不变。其余不变。调整日期为2026年5月22日。\n10.调整临平新丰总站至勾庄农副物流总站的7439路部分线路走向。调整后的线路走向：临平新丰总站始发（上行），循原线至崇杭街，经来贤路、前村街、崇超南路、崇杭街后再循原线至勾庄农副物流总站；勾庄农副物流总站始发，循原线至崇杭街，经崇超南路、前村街、来贤路、崇杭街后再循原线至临平新丰总站。撤销：方马家塘1对双向停靠站；增设：顾家塘1对双向停靠站。调整后的线路长度：下行为28.23KM，上行为26.14KM。其余不变。调整日期为2026年5月23日。\n11.自5月24日起，将环北新村总站至西溪源公交总站的8193路调整为武林广场西至里山桥。调整后的线路走向：武林广场西始发（下行），经展览西路、体育场路后循原线至留和路，经里东路至里山桥；里山桥始发，经里东路、留和路后循原线至环城北路，经展览西路至武林广场西。撤销：武林广场东（下行）1只单向停靠站及环北新村总站、西溪源公交总站始发站；增设：环北新村（上行）1只单向停靠站及里山桥、武林广场西始发站。调整后的服务时间：武林广场西为0：00，里山桥为22：50。调整后的线路长度：下行为20.5KM，上行为20.8KM。其余不变。调整日期为2026年5月24日。"},{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起） - 四、停驶线路","text":"自5月25日起，停驶康馨苑至地铁拱宸桥东站·大运河东的60C路。"},{"title":"【详细通知】新增2条5分钟接驳巴士、试运营北山街接驳线及调整126、287路等线路（2026-05-22起） - 五、相关要求","text":"各部室、各单位接文后，应做好以下工作：\n1.按经营管理责任合同权限编制行车作业计划，并在实施前向集团公司客运部报备。\n2.由客运部负责，传媒集团落实，在黄龙洞、葛岭、新新饭店、岳坟等站点设置北山街接驳线导乘标志。电车分公司要主动在黄龙洞地铁站和北山街沿线对该线进行推广。\n3.要持续深化“公交小灵通”服务机制，主动对接沿线社区，广泛听取乘客意见建议，动态优化线路运营，切实满足市民出行需求。\n4.按相关要求，完成电脑报站器的语音灌制、站名表等服务标志的制作和安装、调度系统中基础数据的修改、线路走向轨迹的更新设置等工作。严格按照“5分钟接驳巴士”配置标准，由传媒集团负责线路车身广告，及车内拉手、车头牌、车腰牌、座椅背板等内饰喷绘制作，同步完成沿线站点、小区引导标识安装。\n5.切实做好安全行车和优质服务各项工作，提前安排充足时间组织司机熟悉线路走向、站点设置等相关情况，全力保障运营安全与服务质量。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日\n附件：\n4路快线发车时刻表\n起讫站\n时段\n发车间隔\n起讫站\n时段\n发车间隔\n4路快线转塘公交总站       （工作日）\n6：30-7：30\n每逢整点、15分、半点、45分发车\n4路快线龙翔桥公交总站         （工作日）\n17：40-18：00\n17：40、18：00\n7：30-8：10\n每逢10分、半点、50分发车"}],"size":4326},"【详细通知】调整部分公交停靠站点名称（2026-05-25起）":{"sections":[{"title":"【详细通知】调整部分公交停靠站点名称（2026-05-25起）","text":"关于调整部分公交停靠站点名称的通知\n各单位、各部室：\n为进一步优化公交线网布局，合理配置公交资源，同时，为提升市民辨识度，规范站名设置，按照站点实际位置布局，结合线路实际运营情况，近期将调整8259路等线路，并对部分公交停靠站点名称进行调整。具体如下：\n1．自2026年5月25日起,原徐家湾路“良渚邱家坞”公交站更名为“中国历代绘画大系典藏馆”，涉及372、1221路。\n2．自2026年5月25日起,原展览东路“武林广场”公交站更名为“武林广场东”，涉及8192路。\n3．自2026年5月25日起，大关小区总站至汽车客运中心西的8259路恢复原线路走向：大关小区总站始发，经香积寺路、再行路后循原线至汽车客运中心西。撤销：大关东五苑、大关小区北2只单向停靠站。其余不变。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日"}],"size":368},"关于新辟、调整部分线路的通知（2026-05-21）":{"sections":[{"title":"关于新辟、调整部分线路的通知（2026-05-21）","text":"关于新增2条“5分钟接驳巴士”，试运营“北山街接驳线”及调整126、287路等线路的通知\n各单位、各部室：\n为进一步优化公交线网布局，盘活公交运力资源，近期将在西浦路地铁站、九和路地铁站新增2条“5分钟接驳巴士”，试运营北山街接驳线，并对126、287路等线路进行调整，具体如下：\n一、新增“5分钟接驳巴士”\n1.为进一步提升运营效率，自5月22日起，将福临街普照巷口至金禾街九睦路口的1702路调整为福临街普照巷口至地铁九和路站（A·C）。调整后的线路走向：福临街普照巷口始发（下行），经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）；地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口。撤销：地铁九和路站（A·C）（下行）、九和路九环路口、九和路牛泰巷口（上行）、地铁九堡站C口、牛田社区（下行）、牛田（下行）、九睦路九沙大道口（下行）、九沙大道杭海路口（上行）8对（只）停靠站及金禾街九睦路口始发站；增设：地铁九和路站（A·C）始发站。同时，线路提升为“5分钟接驳巴士”，福临街普照巷口7：30-8：30间发车间隔约6分，地铁九和路站17：30-19：00间发车间隔约6分。调整后的线路长度：下行为2.0KM，上行为1.7KM。其余不变。\n2.自5月25日起，将原地铁西浦路站D口至贝遨大厦接驳线的“六进”服务线转正为常规线，线路编码7179路。线路走向：早高峰由地铁西浦路站D口始发，经滨文路、西浦路、坚塔街、堤东路至堤东路生地街口（丁香中心西门）。沿途停靠：坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）、堤东路陆家潭街口（泰格药业）3只单向停靠站。晚高峰由潘曹街堤东路口（丁香中心南门）始发，经潘曹街、潮涌路、生地街、西浦路、坚塔街、闻涛路、滨文路至地铁西浦路站D口。沿途停靠：西浦路陆家潭街口、坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）3只单向停靠站。调整后的线路长度：早高峰为1.9KM，晚高峰为2.9KM。同时，线路提升为“5分钟接驳巴士”，地铁西浦路站D口7：50-9：30间发车间隔约7分，潘曹街堤东路口（丁香中心南门） 17：30-19：00间发车间隔约7分。其余不变。\n二、试运营北山街接驳线\n为方便北山街沿线游客前往黄龙洞地铁站，自5月23日起，试运营黄龙洞至黄龙洞的“北山街接驳线”。线路走向：黄龙洞始发，经曙光路、保俶路、北山街、曙光路至黄龙洞。该线在黄龙公交总站内蓄车。沿途停靠：松木场、省府大楼西、葛岭（断桥残雪）、新新饭店、岳坟、浙大附中6只单向停靠站。首末班时间（仅双休节假日开行）：黄龙洞至岳坟为9：30-15：30，葛岭至黄龙洞为11：00-17：30。线路长度：6.3KM。票价每人次贰元，各类IC卡及移动支付通用。\n三、调整线路\n1.自5月25日起，调整转塘公交总站至龙翔桥公交总站的4路快线发车时间。调整后的发车时间详见附表。其余不变。\n2.为缓解“武林广场西”东侧站点停站压力，自5月24日起，将武林广场西至九堡杭乔路总站的126路调整为武林广场东至九堡杭乔路总站。调整后的线路走向：武林广场东始发（下行），经展览东路、环城北路后循原线至九堡杭乔路总站；九堡杭乔路总站始发，循原线至体育场路，经展览东路至武林广场东。撤销：武林广场西始发站；增设：红普南路之江东路口1对双向停靠站及武林广场东始发站。调整后的首末班时间：武林广场东为6：25-21：40，九堡杭乔路总站为5：25-20：40。调整后的线路长度：下行为16.8KM，上行为16.3KM。其余不变。\n3.为进一步提升线路吸引力，减少乘客在途时间，自5月24日起，调整九堡四季青总站至四季青的225路部分线路走向。调整后的线路走向：九堡四季青总站始发（下行），循原线至钱塘快速路，经彭埠立交桥、空港高架路（昙花庵路匝道下）、钱畔隧道、钱江路、解放东路后循原线至四季青；四季青始发，循原线至钱江路，经钱畔隧道、空港大道、彭埠互通、钱塘快速路后循原线至九堡·四季青服装交易中心。撤销：云河家园（下行）、章家坝小区、新塘家园、水湘西苑、卢家塘、钱潮路塘潮街口、唐家井、钱江三苑、钱潮路钱江路口（上行）、钱潮路公交总站外（下行）、富春路民心路口、富春路丹桂街口、新业路市民中心13对（只）停靠站；增设：二堡、钱江路庆春东路口、钱江路江锦路口3对双向停靠站；“九堡·四季青服装交易中心”更名为“九堡四季青总站”。调整后的线路长度：下行为15.1KM，上行为13.9KM。同时，取消章家坝小区至四季青的225路区间。其余不变。\n4.为方便皋塘片居民出行，自5月22日起，调整浙大二院滨江院区北至浙大二院城东院区的287路部分线路走向。调整后的线路走向：浙大二院滨江院区北始发（下行），循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区；浙大二院城东院区至浙大二院滨江院区北方向不变。撤销：皋塘桥西（下行）1只单向停靠站；增设：艮新天桥北（下行）、皋塘北（下行）、皋塘运都（上行）3只单向停靠站。调整后的线路长度：下行为19.1KM。其余不变。\n5.自5月26日起，546路在“里山桥”与“清家坞”间，增设“洞山”1对双向停靠站。其余不变。\n6.自5月26日起，596路在“里山桥“与”清家坞”，“清家坞”与“午潮山北”间增设“洞山”、“地铁石马站”2对双向停靠站。其余不变。\n7.为填补大功巷公交空白，方便珠埠里一带居民出行，自5月27日起，将杨家里至东新路瑞银街口的1110路调整为珠埠里（新站）至东新瑞银总站。调整后的线路走向：珠埠里（新站，设在大功巷）始发（下行），经大功巷、绍兴路400弄、长德弄、再行路、香积寺路后循原线至东新瑞银总站；东新瑞银总站始发，循原线至香积寺路，经再行路、长德弄、绍兴路400弄、大成巷，春睦弄、大功巷至珠埠里。撤销：三塘小区、三塘南村、香积寺路白石巷口（上行）3对（只）停靠站及杨家里始发站；增设：六塘公寓（上行）、三塘汶园西、再行里、杨家里（上行）4对（只）单向停靠站及珠埠里始发站。“三塘竹苑”更名为“三塘竹园”，“东新路瑞银街口”更名为“东新瑞银总站”，原绍兴路400弄“珠埠里”站迁移至大功巷。该线在大成巷、春睦弄、大功巷区域实行循环运营。调整后的首末班时间：珠埠里为7：15-18：35（工作日）、7：30-18：35（双休、节假日）；东新瑞银总站为6：45-19：05（工作日）、7：00-19：05（双休、节假日）。调整后的线路长度：下行为5.5KM，上行为6.6KM。其余不变。\n8.为方便双浦区域学生上下学，自5月25日起恢复5483路，并将起讫点优化为如意尖至云浦佳苑三区。调整后的线路走向：如意尖始发（下行），循原线至灵龙路，经袁富路、科海路、夏铜街至云浦佳苑三区；云浦佳苑三区始发，经夏铜街、科海路、袁富路、灵龙路后循原线至如意尖。撤销：李乡潘家1对双向停靠站及周浦公交总站始发站；增设：云浦佳苑三区始发站。调整后的服务时间（仅工作日运营）：如意尖：周一至周五7:20；云浦佳苑三区发车时间：周一、周五16:30、17:45，周二至周四16:50、17:45。调整后的线路长度：下行为8.72KM，上行为8.71KM。其余不变。\n9.为进一步优化客运中心站内运营秩序，自5月22日起，将杭州汽车客运中心至三村南的5704路调整为地铁客运中心站D口至三村南。调整后的线路走向：地铁客运中心站D口始发，经九沙大道后循原线至三村南；三村南始发，循原线至杭乔路，经九沙大道至地铁客运中心站D口。撤销：杭州汽车客运中心始发站；增设：地铁客运中心站D口始发站。调整后的服务时间：地铁客运中心站D口为6:45，7:10，三村南不变。其余不变。\n10.自5月24日起，将环北新村总站至西溪源公交总站的8193路调整为武林广场西至里山桥。调整后的线路走向：武林广场西始发（下行），经展览西路、体育场路后循原线至留和路，经里东路至里山桥；里山桥始发，经里东路、留和路后循原线至环城北路，经展览西路至武林广场西。撤销：武林广场东（下行）1只单向停靠站及环北新村总站、西溪源公交总站始发站；增设：环北新村（上行）1只单向停靠站及里山桥、武林广场西始发站。调整后的服务时间：武林广场西为0：00，里山桥为22：50。调整后的线路长度：下行为20.5KM，上行为20.8KM。其余不变。\n四、停驶线路\n自5月25日起，停驶康馨苑至地铁拱宸桥东站·大运河东的60C路。\n五、相关要求\n各部室、各单位接文后，应做好以下工作：\n1.按经营管理责任合同权限编制行车作业计划，并在实施前向集团公司客运部报备。\n2.由客运部负责，传媒集团落实，在黄龙洞、葛岭、新新饭店、岳坟等站点设置北山街接驳线导乘标志。电车分公司要主动在黄龙洞地铁站和北山街沿线对该线进行推广。\n3.要持续深化“公交小灵通”服务机制，主动对接沿线社区，广泛听取乘客意见建议，动态优化线路运营，切实满足市民出行需求。\n4.按相关要求，完成电脑报站器的语音灌制、站名表等服务标志的制作和安装、调度系统中基础数据的修改、线路走向轨迹的更新设置等工作。严格按照“5分钟接驳巴士”配置标准，由传媒集团负责线路车身广告，及车内拉手、车头牌、车腰牌、座椅背板等内饰喷绘制作，同步完成沿线站点、小区引导标识安装。\n5.切实做好安全行车和优质服务各项工作，提前安排充足时间组织司机熟悉线路走向、站点设置等相关情况，全力保障运营安全与服务质量。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日\n附件：\n4路快线发车时刻表\n起讫站\n时段\n发车间隔\n起讫站\n时段\n发车间隔\n4路快线转塘公交总站       （工作日）\n6：30-7：30\n每逢整点、15分、半点、45分发车\n4路快线龙翔桥公交总站         （工作日）\n17：40-18：00\n17：40、18：00\n7：30-8：10\n每逢10分、半点、50分发车"}],"size":4100},"关于调整部分公交停靠站点名称的通知（2026-05-21）":{"sections":[{"title":"关于调整部分公交停靠站点名称的通知（2026-05-21）","text":"关于调整部分公交停靠站点名称的通知\n各单位、各部室：\n为进一步优化公交线网布局，合理配置公交资源，同时，为提升市民辨识度，规范站名设置，按照站点实际位置布局，结合线路实际运营情况，近期将调整7439路等线路，并对部分公交停靠站点名称进行调整。具体如下：\n1．自2026年5月25日起,原徐家湾路“良渚邱家坞”公交站更名为“中国历代绘画大系典藏馆”，涉及372、1221路。\n2．自2026年5月25日起,原展览东路“武林广场”公交站更名为“武林广场东”，涉及8192路。\n3．调整临平新丰总站至勾庄农副物流总站的7439路部分线路走向。调整后的线路走向：临平新丰总站始发（上行），循原线至崇杭街，经来贤路、前村街、崇超南路、崇杭街后再循原线至勾庄农副物流总站；勾庄农副物流总站始发，循原线至崇杭街，经崇超南路、前村街、来贤路、崇杭街后再循原线至临平新丰总站。撤销：方马家塘1对双向停靠站；增设：顾家塘1对双向停靠站。调整后的线路长度：下行为28.23KM，上行为26.14KM。其余不变。调整日期为2026年5月23日。\n3．自2026年5月25日起，大关小区总站至汽车客运中心西的8259路恢复原线路走向：大关小区总站始发，经香积寺路、再行路后循原线至汽车客运中心西。撤销：大关东五苑、大关小区北2只单向停靠站。其余不变。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日"}],"size":593},"关于新辟_调整部分线路的通知":{"sections":[{"title":"关于新辟_调整部分线路的通知","text":"关于新增2条“5分钟接驳巴士”，试运营“北山街接驳线”及调整126、287路等线路的通知\n各单位、各部室：\n为进一步优化公交线网布局，盘活公交运力资源，近期将在西浦路地铁站、九和路地铁站新增2条“5分钟接驳巴士”，试运营北山街接驳线，并对126、287路等线路进行调整，具体如下：\n一、新增“5分钟接驳巴士”\n1.为进一步提升运营效率，自5月22日起，将福临街普照巷口至金禾街九睦路口的1702路调整为福临街普照巷口至地铁九和路站（A·C）。调整后的线路走向：福临街普照巷口始发（下行），经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）；地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口。撤销：地铁九和路站（A·C）（下行）、九和路九环路口、九和路牛泰巷口（上行）、地铁九堡站C口、牛田社区（下行）、牛田（下行）、九睦路九沙大道口（下行）、九沙大道杭海路口（上行）8对（只）停靠站及金禾街九睦路口始发站；增设：地铁九和路站（A·C）始发站。同时，线路提升为“5分钟接驳巴士”，福临街普照巷口7：30-8：30间发车间隔约6分，地铁九和路站17：30-19：00间发车间隔约6分。调整后的线路长度：下行为2.0KM，上行为1.7KM。其余不变。\n2.自5月25日起，将原地铁西浦路站D口至贝遨大厦接驳线的“六进”服务线转正为常规线，线路编码7179路。线路走向：早高峰由地铁西浦路站D口始发，经滨文路、西浦路、坚塔街、堤东路至堤东路生地街口（丁香中心西门）。沿途停靠：坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）、堤东路陆家潭街口（泰格药业）3只单向停靠站。晚高峰由潘曹街堤东路口（丁香中心南门）始发，经潘曹街、潮涌路、生地街、西浦路、坚塔街、闻涛路、滨文路至地铁西浦路站D口。沿途停靠：西浦路陆家潭街口、坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）3只单向停靠站。调整后的线路长度：早高峰为1.9KM，晚高峰为2.9KM。同时，线路提升为“5分钟接驳巴士”，地铁西浦路站D口7：50-9：30间发车间隔约7分，潘曹街堤东路口（丁香中心南门） 17：30-19：00间发车间隔约7分。其余不变。\n二、试运营北山街接驳线\n为方便北山街沿线游客前往黄龙洞地铁站，自5月23日起，试运营黄龙洞至黄龙洞的“北山街接驳线”。线路走向：黄龙洞始发，经曙光路、保俶路、北山街、曙光路至黄龙洞。该线在黄龙公交总站内蓄车。沿途停靠：松木场、省府大楼西、葛岭（断桥残雪）、新新饭店、岳坟、浙大附中6只单向停靠站。首末班时间（仅双休节假日开行）：黄龙洞至岳坟为9：30-15：30，葛岭至黄龙洞为11：00-17：30。线路长度：6.3KM。票价每人次贰元，各类IC卡及移动支付通用。\n三、调整线路\n1.自5月25日起，调整转塘公交总站至龙翔桥公交总站的4路快线发车时间。调整后的发车时间详见附表。其余不变。\n2.为缓解“武林广场西”东侧站点停站压力，自5月24日起，将武林广场西至九堡杭乔路总站的126路调整为武林广场东至九堡杭乔路总站。调整后的线路走向：武林广场东始发（下行），经展览东路、环城北路后循原线至九堡杭乔路总站；九堡杭乔路总站始发，循原线至体育场路，经展览东路至武林广场东。撤销：武林广场西始发站；增设：红普南路之江东路口1对双向停靠站及武林广场东始发站。调整后的首末班时间：武林广场东为6：25-21：40，九堡杭乔路总站为5：25-20：40。调整后的线路长度：下行为16.8KM，上行为16.3KM。其余不变。\n3.为进一步提升线路吸引力，减少乘客在途时间，自5月24日起，调整九堡四季青总站至四季青的225路部分线路走向。调整后的线路走向：九堡四季青总站始发（下行），循原线至钱塘快速路，经彭埠立交桥、空港高架路（昙花庵路匝道下）、钱畔隧道、钱江路、解放东路后循原线至四季青；四季青始发，循原线至钱江路，经钱畔隧道、空港大道、彭埠互通、钱塘快速路后循原线至九堡·四季青服装交易中心。撤销：云河家园（下行）、章家坝小区、新塘家园、水湘西苑、卢家塘、钱潮路塘潮街口、唐家井、钱江三苑、钱潮路钱江路口（上行）、钱潮路公交总站外（下行）、富春路民心路口、富春路丹桂街口、新业路市民中心13对（只）停靠站；增设：二堡、钱江路庆春东路口、钱江路江锦路口3对双向停靠站；“九堡·四季青服装交易中心”更名为“九堡四季青总站”。调整后的线路长度：下行为15.1KM，上行为13.9KM。同时，取消章家坝小区至四季青的225路区间。其余不变。\n4.为方便皋塘片居民出行，自5月22日起，调整浙大二院滨江院区北至浙大二院城东院区的287路部分线路走向。调整后的线路走向：浙大二院滨江院区北始发（下行），循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区；浙大二院城东院区至浙大二院滨江院区北方向不变。撤销：皋塘桥西（下行）1只单向停靠站；增设：艮新天桥北（下行）、皋塘北（下行）、皋塘运都（上行）3只单向停靠站。调整后的线路长度：下行为19.1KM。其余不变。\n5.自5月26日起，546路在“里山桥”与“清家坞”间，增设“洞山”1对双向停靠站。其余不变。\n6.自5月26日起，596路在“里山桥“与”清家坞”，“清家坞”与“午潮山北”间增设“洞山”、“地铁石马站”2对双向停靠站。其余不变。\n7.为填补大功巷公交空白，方便珠埠里一带居民出行，自5月27日起，将杨家里至东新路瑞银街口的1110路调整为珠埠里（新站）至东新瑞银总站。调整后的线路走向：珠埠里（新站，设在大功巷）始发（下行），经大功巷、绍兴路400弄、长德弄、再行路、香积寺路后循原线至东新瑞银总站；东新瑞银总站始发，循原线至香积寺路，经再行路、长德弄、绍兴路400弄、大成巷，春睦弄、大功巷至珠埠里。撤销：三塘小区、三塘南村、香积寺路白石巷口（上行）3对（只）停靠站及杨家里始发站；增设：六塘公寓（上行）、三塘汶园西、再行里、杨家里（上行）4对（只）单向停靠站及珠埠里始发站。“三塘竹苑”更名为“三塘竹园”，“东新路瑞银街口”更名为“东新瑞银总站”，原绍兴路400弄“珠埠里”站迁移至大功巷。该线在大成巷、春睦弄、大功巷区域实行循环运营。调整后的首末班时间：珠埠里为7：15-18：35（工作日）、7：30-18：35（双休、节假日）；东新瑞银总站为6：45-19：05（工作日）、7：00-19：05（双休、节假日）。调整后的线路长度：下行为5.5KM，上行为6.6KM。其余不变。\n8.为方便双浦区域学生上下学，自5月25日起恢复5483路，并将起讫点优化为如意尖至云浦佳苑三区。调整后的线路走向：如意尖始发（下行），循原线至灵龙路，经袁富路、科海路、夏铜街至云浦佳苑三区；云浦佳苑三区始发，经夏铜街、科海路、袁富路、灵龙路后循原线至如意尖。撤销：李乡潘家1对双向停靠站及周浦公交总站始发站；增设：云浦佳苑三区始发站。调整后的服务时间（仅工作日运营）：如意尖：周一至周五7:20；云浦佳苑三区发车时间：周一、周五16:30、17:45，周二至周四16:50、17:45。调整后的线路长度：下行为8.72KM，上行为8.71KM。其余不变。\n9.为进一步优化客运中心站内运营秩序，自5月22日起，将杭州汽车客运中心至三村南的5704路调整为地铁客运中心站D口至三村南。调整后的线路走向：地铁客运中心站D口始发，经九沙大道后循原线至三村南；三村南始发，循原线至杭乔路，经九沙大道至地铁客运中心站D口。撤销：杭州汽车客运中心始发站；增设：地铁客运中心站D口始发站。调整后的服务时间：地铁客运中心站D口为6:45，7:10，三村南不变。其余不变。\n10.自5月24日起，将环北新村总站至西溪源公交总站的8193路调整为武林广场西至里山桥。调整后的线路走向：武林广场西始发（下行），经展览西路、体育场路后循原线至留和路，经里东路至里山桥；里山桥始发，经里东路、留和路后循原线至环城北路，经展览西路至武林广场西。撤销：武林广场东（下行）1只单向停靠站及环北新村总站、西溪源公交总站始发站；增设：环北新村（上行）1只单向停靠站及里山桥、武林广场西始发站。调整后的服务时间：武林广场西为0：00，里山桥为22：50。调整后的线路长度：下行为20.5KM，上行为20.8KM。其余不变。\n四、停驶线路\n自5月25日起，停驶康馨苑至地铁拱宸桥东站·大运河东的60C路。\n五、相关要求\n各部室、各单位接文后，应做好以下工作：\n1.按经营管理责任合同权限编制行车作业计划，并在实施前向集团公司客运部报备。\n2.由客运部负责，传媒集团落实，在黄龙洞、葛岭、新新饭店、岳坟等站点设置北山街接驳线导乘标志。电车分公司要主动在黄龙洞地铁站和北山街沿线对该线进行推广。\n3.要持续深化“公交小灵通”服务机制，主动对接沿线社区，广泛听取乘客意见建议，动态优化线路运营，切实满足市民出行需求。\n4.按相关要求，完成电脑报站器的语音灌制、站名表等服务标志的制作和安装、调度系统中基础数据的修改、线路走向轨迹的更新设置等工作。严格按照“5分钟接驳巴士”配置标准，由传媒集团负责线路车身广告，及车内拉手、车头牌、车腰牌、座椅背板等内饰喷绘制作，同步完成沿线站点、小区引导标识安装。\n5.切实做好安全行车和优质服务各项工作，提前安排充足时间组织司机熟悉线路走向、站点设置等相关情况，全力保障运营安全与服务质量。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日\n附件：\n4路快线发车时刻表\n起讫站\n时段\n发车间隔\n起讫站\n时段\n发车间隔\n4路快线\u000b转塘公交总站       （工作日）\n6：30-7：30\n每逢整点、15分、半点、45分发车\n4路快线\u000b龙翔桥公交总站         （工作日）\n17：40-18：00\n17：40、18：00\n7：30-8：10\n每逢10分、半点、50分发车"}],"size":4113},"关于调整1314路等线路的通知":{"sections":[{"title":"关于调整1314路等线路的通知","text":"关于调整1314路等线路的通知\n各单位、各部室：\n为进一步优化公交服务质量，提升线路运营效率，自5月1日起，将调整1314路等线路，具体如下：\n调整宋城东门总站至一公园的1314路部分线路走向。调整后的线路走向：宋城东门总站始发（下行），循原线至南山路，经西湖大道、延安路、南山路至一公园；一公园至宋城东门总站方向不变。撤销：涌金门（下行）1只单向停靠站；增设：涌金门东（下行）、饮马井巷（下行）2只单向停靠站。调整后的线路长度：下行为19.6KM，上行不变。“宋城景区”更名为“宋城东门总站”。其余不变。调整日期为5月1日。\n将城西公园至法华寺的法华寺接驳线调整为城西公园至东方中学，线路名称改为东岳社区接驳线。调整后的线路走向：城西公园始发（下行），经天目山路、紫金港路、西溪路至西溪路小龙驹坞路口折返，再经西溪路至东方中学；东方中学始发，经西溪路、紫金港路至紫金港路西溪路口折返，再经紫金港路、明谷街至城西公园。沿途停靠：东岳（下行）、东岳社区换乘站、东方中学始发站（上行）。线路长度：下行：1.8KM、上行1.6KM。服务时间（仅双休节假日运营）：城西公园为8:00-16:00;东方中学为9:00-17:00。其余不变。调整日期为5月1日。\n特此通知。\n集团客运管理部\n2026年4月29日"}],"size":566},"关于调整57_68_85路等线路的通知":{"sections":[{"title":"关于调整57_68_85路等线路的通知","text":"关于调整57、68、85路等线路的通知\n各单位、各部室：\n为进一步优化线网结构，提升公交服务水平，结合线路实际运营情况，近期将调整57路、68路、85路、长河历史街区接驳线等线路，具体如下：\n站点调整\n57路，在“管家塘东/冯家浜路通运路口北”和“三里洋/江家桥”之间增设“金昌路通益路口”1对双向停靠站。其余不变。调整日期为2026年4月23日。\n85路，环丁路公交站至二纺机总厂方向，在“地铁桃花湖公园站（B·D）”和“高地上”之间增设“丁城路明珠街口”1只单向停靠站；二纺机总厂至环丁路公交站方向，在“高地上”和“地铁桃花湖公园站（B·D）”之间增设“明珠街丁城路口”1只单向停靠站。同时，“环丁路公交站”更名为“丁桥环丁路总站”，“石桥公交停车场北”更名为“旦万桥东”，“丁桥公交站”更名为“丁桥公交总站外”，“三塘竹苑”更名为“三塘竹园”。其余不变。调整日期为2026年4月23日。\n68路，焦家村公交总站（水务大厦）至饮马井巷方向，在“焦家村公交总站（水务大厦）”至“流水北苑”之间增设“焦家村”1只单向停靠站。调整日期为2026年4月23日。\n将地铁枫桦西路站（B·C）至灵隐东的324H路调整为地铁枫桦西路站（B·C）至上茅家埠。调整后的线路走向：地铁枫桦西路站（B·C）始发，循原线至梅灵南路，经梅灵北路至上茅家埠；上茅家埠始发，经梅灵北路、龙井路、灵隐路、双峰路、梅灵北路后循原线至地铁枫桦西路站（B·C）。撤销：灵隐东始发站；增设：灵隐东、黄泥岭（上行）、立马回头（上行）3对（只）停靠站及上茅家埠始发站。调整后的线路长度：下行为13.4KM，上行为16.6KM。调整后的服务时间（仅双休、节假日运营）：灵隐东为8:00-19:00，地铁枫桦西路站（B·C）不变。调整日期为2026年4月25日。\n六进线路调整\n将地铁西浦路站D口/光云大厦至贝遨大厦/地铁西浦站D口的地铁西浦站D口至贝遨大厦接驳线调整为地铁西浦路站D口/光云大厦至丁香中心南门/地铁西浦路站D口。调整后的线路走向：地铁西浦路站D口始发（下行），经滨文路、西浦路、坚塔街、堤东路、生地街、潮涌路、潘曹街至丁香中心南门；光云大厦始发，经坚塔街、堤东路、生地街、潮涌路、潘曹街、闻涛路、滨文路至地铁西浦路站D口。增设：丁香中心南门1只停靠站。调整后的服务时间：地铁西浦路站D口为7:50-9:30（发车间隔约7分钟），光云大厦为17:30-19:00（发车间隔约7分钟）。线路长度：下行为2.2KM，上行为3.4KM。其余不变。调整日期为2026年4月22日\n将江边（地铁长河站C口）至长河公交站的长河历史街区接驳线调整为江边（地铁长河站C口）至白马湖北。调整后的线路走向：白马湖北始发（下行），经长江路后，循原线至江边（地铁长河站C口）；江边（地铁长河站C口）始发，循原线至长江路，经白马湖路、腾龙路、天马路、长江路后至白马湖北。撤销：长河公交站始发站；增设：白马湖北始发站。调整后的服务时间：江边（地铁长河站C口）为7:15-19:15（7:15、8:45、10:15、11:45、13:15、14:45、16:15、17:45、19:15）；白马湖北为6:30-18:30（6:30、8:00、9:30、11:00、12:30、14:00、15:30、17:00、18:30）。线路长度：下行为6.1KM，上行为8.9KM。其余不变。调整日期为2026年4月22日。\n特此通知。\n集团客运管理部\n2026年4月21日"}],"size":1457},"关于调整部分公交停靠站点名称的通知":{"sections":[{"title":"关于调整部分公交停靠站点名称的通知","text":"关于调整部分公交停靠站点名称的通知\n各单位、各部室：\n为进一步优化公交线网布局，合理配置公交资源，同时，为提升市民辨识度，规范站名设置，按照站点实际位置布局，结合线路实际运营情况，近期将调整7439路等线路，并对部分公交停靠站点名称进行调整。具体如下：\n1．自2026年5月25日起,原徐家湾路“良渚邱家坞”公交站更名为“中国历代绘画大系典藏馆”，涉及372、1221路。\n2．自2026年5月25日起,原展览东路“武林广场”公交站更名为“武林广场东”，涉及8192路。\n3．调整临平新丰总站至勾庄农副物流总站的7439路部分线路走向。调整后的线路走向：临平新丰总站始发（上行），循原线至崇杭街，经来贤路、前村街、崇超南路、崇杭街后再循原线至勾庄农副物流总站；勾庄农副物流总站始发，循原线至崇杭街，经崇超南路、前村街、来贤路、崇杭街后再循原线至临平新丰总站。撤销：方马家塘1对双向停靠站；增设：顾家塘1对双向停靠站。调整后的线路长度：下行为28.23KM，上行为26.14KM。其余不变。调整日期为2026年5月23日。\n3．自2026年5月25日起，大关小区总站至汽车客运中心西的8259路恢复原线路走向：大关小区总站始发，经香积寺路、再行路后循原线至汽车客运中心西。撤销：大关东五苑、大关小区北2只单向停靠站。其余不变。\n特此通知。\n杭州市公共交通集团有限公司\n2026年5月21日"}],"size":597},"关于新增长河街道南片接驳线,调整519路的通知":{"sections":[{"title":"关于新增长河街道南片接驳线,调整519路的通知","text":"关于新增长河街道南片接驳线,调整519路的通知\n各单位、各部室：\n为进一步提升公交服务品质，合理配置公交资源，优化长河街道区域公交线网，切实强化耕文路、振宁路等地铁站的公交接驳效能，更好满足周边居民日常出行需求，结合线路运营实际，近期将新增长河街道南片接驳线，调整519路，具体如下：\n1．开通映翠雅苑至长虹南苑的“六进”服务线：长河街道南片接驳线。线路走向：映翠雅苑始发（下行），经漫湖巷、长江路、天马路、时代大道辅路、白马湖路、江虹南路、冠山路、长江路、滨文路、东冠路、南川路、清旷街至长虹南苑；长虹南苑始发，经清旷街、信诚南路、滨文路、长江路、冠山路、江虹南路、白马湖路、时代大道辅路、天马路、腾龙路、映翠路、漫湖巷至映翠雅苑。沿途停靠：双贤桥、山一村、白马湖路腾龙路口、白马湖小区鸿雁苑、月湾潭5对双向停靠站。服务时间：映翠雅苑7:00、8:40、17:00、18:40；长虹南苑7:50、9:30、17:50、19:30。线路长度：下行为10.5KM，上行为11.4KM。票价每人次贰元，各类IC卡及移动支付通用。由汽二分公司经营。开通日期为2026年5月18日。\n2．调整江陵路公交总站至地铁耕文路站B口的519路部分线路走向。调整后的线路走向：江陵路公交总站始发（下行），循原线至利华路，经生兴路、鸿宁路、通惠北路后循原线至地铁耕文路站B口；地铁耕文路站B口始发，经学知路、弘慧路、奔竞大道、通惠北路、鸿宁路、生兴路、利华路后循原线至江陵路公交总站。撤销：利华路生兴路口、陆路口岸、宁牧、宁新、通惠北路鸿达路口5对停靠站；增设：地铁兴议站B口、文明路利丰路口、振宁路丰二路口 、振宁路永晖路口、生兴路汝宁弄口、生兴路扬帆路口、二桥村7对停靠站。调整后的线路长度：下行为17公里，上行为16.9公里。其余不变。调整日期为2026年5月16日。\n特此通知。\n集团客运管理部\n2026年5月14日\n附件：\n519路发车时刻表\n线路编码\n起讫点\n时段\n发车间隔\n起讫点\n时段\n发车间隔\n519路\u000b（工作日）\n地铁耕文路站B口\n6:00-7:00\n每逢整点、20分、40分发车\n江陵路公交总站\n7:20-8:20\n每逢整点、20分、40分发车\n7:00-9:00\n每逢整点、15分、半点、45分发车\n8:20-10:20\n每逢05分、20分、35分、50分发车\n9:00-11:00\n每逢整点、20分、40分发车\n10:20-12:00\n每逢整点、20分、40分发车\n11:00-13:00\n每逢整、半点发车\n12:00-14:00\n每逢整、半点发车\n13：00-17:00\n每逢整点、20分、40分发车\n14:00-17:00\n每逢整点、20分、40分发车\n17:00-18:00\n每逢整点、15分、半点、45分发车\n17:00-19:00\n每逢整点、15分、半点、45分发车\n18:00-20:00\n每逢整点、20分、40分发车\n19:00-21:20\n每逢整点、20分、40分发车\n519路\u000b（双休日）\n地铁耕文路站B口\n6:00-7:00\n每逢整点、20分、40分发车\n江陵路公交总站\n7:20-8:00\n每逢整点、20分、40分发车\n7:00-8:30\n每逢整点、15分、半点、45分发车\n8:00-9:00\n每逢整点、15分、半点、45分发车\n8:30-10:30\n每逢10分、半点、50分发车\n9:00-12:00\n每逢整点、20分、40分发车\n10:30-13:00\n每逢整、半点发车\n12:00-14:00\n每逢整、半点发车\n13:00-20:00\n每逢整点、20分、40分发车\n14:00–21:20\n每逢整点、20分、40分发车"}],"size":1575},"关于优化提升1106、1219路为“5分钟接驳巴士”的通知":{"sections":[{"title":"关于优化提升1106、1219路为“5分钟接驳巴士”的通知","text":"关于优化提升1106、1219路为“5分钟接驳巴士”的通知\n各单位、各部室：\n为进一步提升公交服务品质，合理配置公交资源，扩大部分区域5分钟巴士通勤圈覆盖范围，强化皋亭坝、古翠路等地铁站的公交接驳效能，方便市民高效换乘出行。结合线路运营实际，近期将对1106、1219路进行优化提升，纳入“5分钟接驳巴士”运营体系，具体如下：\n一、升级“5分钟巴士”\n1.调整皋亭坝北至中塘的1106路服务时间。调整后\n的服务时间：中塘为7:00-9:30、17:00-19:00；皋亭坝北为7:10-9:40、17:10-19:10。同时，线路提升为“5分钟接驳巴士”。升级后，早高峰皋亭坝北8:30-9:20发车间隔约7分，晚高峰中塘17：20-18:30发车间隔约7分。线路实行响应式停靠。其余不变。调整日期为2026年5月18日。\n将1219路提升为“5分钟接驳巴士”。升级后，早高峰文三古翠总站7:00-8:00发车间隔约7分，三坝7:30-8:30发车间隔约7分；晚高峰文三古翠总站17:00-18:00发车间隔约7分，三坝17:30-18:30发车间隔约7分。线路实行响应式停靠。其余不变。调整日期为2026年5月18日。\n调整站名\n结合原武林广场周边公交站名、设置地理布局，为进一步提升市民辨识度，自5月18日起，将原展览东路“武林广场”公交站更名为“武林广场东”，涉及313、318（C）、506（C）、520、8202、8211、8218路及大红豆数字旅游专线。8192、8193路待下批武林广场周边线路时一并调整。\n同步，调整部分线路停靠站及夜间线始发站，具体为：\n转塘公交总站/龙坞葛衙庄总站至武林广场东的318（C）路的停靠站点。在“武林小广场”与“轮船码头”之间增设“环北新村”1只单向停靠站。调整日期为自5月18日。\n调整中泰公交总站至武林广场东的506C路的停靠站点。在“闲林工业区”与“闲林埠”之间增设“闲林北”1对双向停靠站。调整日期为自5月18日。\n调整武林广场东至转塘公交停车场的8202路停靠站点。在“梵村”与“九溪”之间增设“珊瑚沙水库”1对双向停靠站。该线的“艮山门东站”更名为“艮山门东”。调整日期为自5月19日。\n调整大关小区总站至汽车客运中心西的8259路部分线路走向。调整后的线路走向：大关小区总站始发，经香积寺路、大关苑路、大关路、绍兴路、香积寺路后循原线至汽车客运中心西。增设：大关东五苑、大关小区北2只单向停靠站。大关小区总站始发站位置调整至与578路并站。调整日期为自5月19日。\n特此通知。\n集团客运管理部\n2026年５月14日"}],"size":1091},"关于新增1711路，优化提升389、1213路等线路为“5分钟巴士”的通知":{"sections":[{"title":"关于新增1711路，优化提升389、1213路等线路为“5分钟巴士”的通知","text":"关于新增1711路，优化提升389、1213路等线路为“5分钟巴士”的通知\n各单位、各部室：\n为进一步提升公交服务品质，合理配置公交资源，优化丰收湖区域线网，扩大部分区域5分钟巴士通勤圈覆盖范围，强化白洋、金沙湖等地铁站的公交接驳效能，方便市民高效换乘出行。结合线路运营实际，近期将新增1711路，对389、1213、1709路等线路进行优化提升，纳入“5分钟巴士”运营体系，具体优化调整方案如下：\n新增线路\n新辟九环路九华路口至地铁乔司南站（A·B）的1711路。线路走向：早高峰九环路九华路口始发，经九环路、科城街、友爱路至地铁乔司南站（A·B）（车辆下客后空车经友爱路、石塘东路、九环路至九环路九华路口上客点），沿途停靠：九环路三胜街口、九环路文商街口、科城街聚创街口3只停靠站。晚高峰地铁乔司南站（A·B）始发，经友爱路、科城街、聚创街、文商街、九环路至九环路九华路口（车辆下客后空车经九环路、石塘东路、友爱路至地铁乔司南站（A·B）上客点），沿途停靠：科城街聚创街口、龙湖天瑄城（招呼站）、九环路三胜街口3只停靠站。服务时间(仅工作日开行）：九环路九华路口为6：30-9：00，地铁乔司南站（A·B）为17：00-19：30。线路长度：早高峰2.8KM，晚高峰3.0KM。票价每人次壹元。各类IC卡及移动支付通用，并实行响应式停靠。由余杭公司负责运营。开通时间为2026年4月27日。\n二、优化“5分钟接驳巴士”\n将389路提升为“5分钟接驳巴士”。通过增加区间运力，将该线七贤郡中至地铁良渚站（B·D）早晚高峰的发车间隔加密至5分。升级后，早高峰七贤郡中6:40-8:00发车间隔约5分，晚高峰地铁良渚站（B·D）17:50-19:00发车间隔约5分。并实行响应式停靠。其余不变。调整日期为2026年4月27日。\n将1213路提升为“5分钟接驳巴士”。通过增加区间运力，将该线三墩景溪南苑总站至王家斗早高峰的发车间隔加密至6分。升级后，早高峰三墩景溪南苑总站7:00-8:30发车间隔约6分，并实行响应式停靠。其余不变。调整日期为2026年4月27日。\n将倪家坝至地铁白洋站C口的1216路升级为“5分钟接驳巴士”。升级后，早高峰倪家坝7:30-8:30发车间隔约5分，晚高峰地铁白洋站C口17:00-18:00发车间隔约5分。其余不变。调整日期为2026年4月27日。\n将1709路提升为“5分钟接驳巴士”。通过增加区间运力，将该线地铁九和路站（A·C）至九堡双桥早晚高峰的发车间隔加密至7分，早高峰地铁九和路站（A·C）7:30-9:00发车间隔约7分，晚高峰九堡双桥17:00-18:30发车间隔约7分。并实行响应式停靠。调整日期为2026年4月27日。\n将向旭路晨朝路口（印澜府）/地铁曹家桥站（A·C）至向旭路晨朝路口（印澜府）/地铁曹家桥站（A·C）的2073路调整为蜀越路向旭路口（奥园、广乐公寓）/地铁曹家桥站（A·C）至蜀越路向旭路口（奥园、广乐公寓）/地铁曹家桥站（A·C）。早高峰线路走向:蜀越路向旭路口（奥园、广乐公寓）始发，经蜀越路、向旭路、晨朝路、晨晖路、市心南路、面包树街、蜀越路至蜀越路向旭路口（奥园、广乐公寓）。沿途停靠：向旭路晨朝路口（印澜府）、许家新屋（湘水名庭）、晨晖路市心路口（广元公寓）、地铁曹家桥站（A·C）、旸四房5只单向停靠站。调整后的服务时间（仅法定工作日运营）:蜀越路向旭路口（奥园、广乐公寓）为7:00-9:00（发车间隔7分）。晚高峰线路走向：地铁曹家桥站（A·C）始发，经市心南路、面包树街、蜀越路、向旭路、晨朝路、晨晖路、市心南路至地铁曹家桥站（A·C）。沿途停靠：旸四房、蜀越路向旭路口（奥园、广乐公寓）、向旭路晨朝路口（印澜府）、许家新屋（湘水名庭）、晨晖路市心路口（广元公寓）5只单向停靠站。调整后的服务时间（仅法定工作日运营）:地铁曹家桥站（A·C）为17:30-19:30（发车间隔7分）。调整后的线路长度:6.7KM。其余不变。同时升级为“5分钟巴士”。调整日期为2026年4月27日。\n将钱塘政务服务中心（下沙）/乔新路银海街口至围垦街海达北路口/钱塘政务服务中心（下沙）的3105路升级为“5分钟接驳巴士”。升级后，早高峰钱塘政务服务中心（下沙）7：40-9：00发车间隔约5分，晚高峰乔新路银海街口17：30-19：00发车间隔约5分。其余不变。调整日期为2026年4月27日。\n调整萧然西路晨晖路口至越寨张的7709路部分走向及发车间隔。调整后的线路走向：萧然西路晨晖路口始发（上行），循原线至面包树街蜀越路口后，放空经风情大道、南六路、金西路至南六路停车场折返，经金西路、南六路、风情大道、面包树街至越寨张；越寨张至萧然西路晨晖路口方向不变。增设：面包树街蜀越路口（上行）1只单向停靠站。调整后的线路长度：上行为5.2公里，下行为4.8公里。调整后的服务时间（仅工作日运营）：萧然西路晨晖路口6:55-8:55、17:00-19:30发车间隔约7分，越寨张6：35-9：05、17：30-19：05发车间隔约7分。其余不变。调整日期为2026年4月27日。\n三、站点调整\n1.128路，丁桥公交总站至城站火车站方向，在“地铁桃花湖公园站（B·D）”和“高地上”之间增设“丁城路明珠街口”1只单向停靠站；城站火车站至丁桥公交总站方向，在“高地上”和“赵家浜南”之间增设“明珠街丁城路口”1只单向停靠站。调整日期为2026年4月27日。\n2.383路，“闲林水厂”更名为“洞山桥”。调整日期为2026年4月27日。\n停驶线路\n因调整后的2073路及7709路覆盖7710路所有范围，自2026年4月27日起，暂停蜀越路向旭路口至萧然西路晨晖路口的7710路运营服务。\n五、相关要求\n各部室、各单位接文后，应做好以下工作：\n由客运部、传媒集团负责，制作优化线路沿线小区的宣传折页。各分公司要分别落实线路宣传工作，持续深化“公交小灵通”服务机制，主动对接沿线社区，广泛听取乘客意见建议，动态优化线路运营，切实满足市民出行需求。\n严格按照“5分钟接驳巴士”配置标准，由传媒集团负责主城区线路车身广告，及车内拉手、车头牌、车腰牌、座椅背板等内饰喷绘制作，同步完成沿线站点、小区引导标识安装。涉及控股公司相关内容，由传媒集团统一设计，控股公司自行上刊、安装，确保车辆外观、车身喷绘制式统一、醒目清晰，方便市民辨识。\n各分公司需按经营管理责任合同权限编制行车作业计划，并在计划实施前向集团公司客运部报备，确保行车作业计划科学合理、合规可控。\n切实做好安全行车和优质服务各项工作，提前安排充足时间组织司机熟悉线路走向、站点设置等相关情况，全力保障运营安全与服务质量。\n按相关要求，完成电脑报站器的语音灌制、站名表等服务标志的制作和安装、调度系统中基础数据的修改、站点经纬度的测定、线路走向轨迹的更新及新增站点编码的设置等工作。\n特此通知。\n集团客运管理部\n2026年4月24日"}],"size":2880},"关于在部分线路上实行“公交站点响应式停靠”服务举措的通知":{"sections":[{"title":"关于在部分线路上实行“公交站点响应式停靠”服务举措的通知","text":"关于在部分线路上实行“公交站点响应式停靠”服务举措的通知\n各单位、各部室：\n为进一步提高公交运营效率，提升市民公共交通出行的吸引力，缓解城市交通拥堵问题，经研究，定于4月25日起，陆续在部分线路上实行“公交站点响应式停靠”服务举措，具体如下：\n序号\n线路编码\n实施日期\n同步站点更名\n责任单位\n1\n9\n4月25日\n——\n汽二分公司\n2\n10\n4月28日\n——\n汽一分公司\n3\n12\n4月25日\n——\n汽一分公司\n4\n19\n4月25日\n“金色蓝庭公交站”更名为“金色蓝庭总站”、“艮山门东站”更名为“艮山门东”\n汽一分公司\n5\n22\n4月26日\n——\n汽五分公司\n6\n37\n4月28日\n——\n汽一分公司\n7\n41\n4月26日\n——\n汽五分公司\n8\n45\n4月26日\n“钱潮路公交站”更名为“钱潮路公交总站外”\n汽二分公司\n9\n46\n4月27日\n——\n汽五分公司\n10\n62\n4月27日\n“杭州陶瓷品市场”改为“陶瓷品市场总站”\n汽二分公司\n11\n70\n4月27日\n——\n电车分公司\n12\n75\n4月28日\n“半山路公交站”更名为“半山公交总站”\n汽五分公司\n13\n77\n4月26日\n——\n汽一分公司\n14\n78\n4月27日\n“三塘竹苑”更名为“三塘竹园”\n汽五分公司\n15\n84\n4月26日\n——\n汽五分公司\n16\n89\n4月27日\n——\n汽一分公司\n17\n91\n4月27日\n——\n电车分公司\n18\n179\n4月28日\n——\n汽二分公司\n19\n180\n4月27日\n——\n汽一分公司\n20\n187\n4月28日\n——\n汽五分公司\n21\n312\n4月28日\n——\n电车分公司\n22\n7032\n4月26日\n——\n汽二分公司\n23\n7073\n4月28日\n——\n汽一分公司\n24\n7282\n4月26日\n——\n汽一分公司\n特此通知。\n集团客运管理部\n2026年4月24日"}],"size":781},"调整546、592、596路等线路":{"sections":[{"title":"调整546、592、596路等线路","text":"关于调整546、592、596路等线路的通知\n各单位、各部室：\n因银湖街道创意路（富闲路-望湖路）提升改造，施工期间机动车禁止通行，自4月25日起，546、592、596路调整部分线路走向，具体如下：\n1.546路，石马公交总站始发，循原线至富闲路，经彩虹快速路至地铁银湖站。地铁银湖站至石马公交总站方向不变。调整后的法定工作日发车时间详见附表。其余不变。\n2.592路，火车西站始发，循原线至创意路，经上林南路后循原线至银湖公交站。临时撤销：地铁银湖站1只单向停靠站。银湖公交总站至火车西站方向不变。其余不变。\n3.596路，富阳公交总站始发，循原线至富闲路，经彩虹快速路后循原线至文二西路通普路口。临时撤销：麓园1只单向停靠站。文二西路通普路口至富阳公交总站不变。其余不变。\n特此通知。\n集团客运管理部\n2026年4月23日\n附表：\n542路法定工作日发车时间表\n起讫点\n时段\n发车间隔\n起讫点\n时段\n发车间隔\n地铁银湖站\n（工作日）\n6:00-7:00\n每逢整点、20分、40分发车\n石马公交总站\n（工作日）\n6:40-8:00\n每逢整点、20分、40分发车\n7:00-8:10\n发车间隔10分\n8:00-9:00\n发车间隔10分\n8:10-8:50\n每逢10分、半点、50分发车\n9:00-9:40\n每逢整点、20分、40分发车\n8:50-15:20\n每逢20分、50分发车\n9:40-16:40\n每逢10分、40分发车\n15:20-16:40\n每逢整点、20分、40分发车\n16:40-17:20\n每逢整点、20分、40分发车\n16:40-17:20\n发车间隔10分\n17:20-18:20\n发车间隔10分\n17:20-18:40\n每逢整点、20分、40分发车\n18:20-19:00\n每逢整点、20分、40分发车\n19:00-19:30\n19:00、19:30"}],"size":822},"恢复331路路线走向":{"sections":[{"title":"恢复331路路线走向","text":"关于恢复331路路线走向的通知\n绕城高速公路（龙坞段）涵洞提升改造工程施工结束，5月1日起，恢复331路走向，具体如下。\n1.331路调整为：艺创小镇总站始发，循原线至留泗路，经白龙潭路、上城埭路、灵龙路后循原线至留下南。恢复：龙坞、白龙潭路叶埠桥路口、白龙潭路灵龙路口、白龙潭路采青路口、葛衙庄总站外（招呼站）、葛衙庄、兔子山7对双向停靠站。撤销：太坞山北双向停靠站。\n2.停运白龙潭路采青路口至象山的1407区间车。\n3.停运龙坞葛衙庄总站至留下西的331B路。\n特此通知。\n杭州市公共交通集团有限公司客运部\n2026年4月28日"}],"size":277},"调整西湖景区部分线路":{"sections":[{"title":"调整西湖景区部分线路","text":"关于调整西湖景区部分线路的通知\n各单位、各部室：\n为进一步提高管理水平，结合西湖景区客流情况变化，经研究，自5月10日起，将调整西湖南线部分公交线路服务时间及支援配置，具体如下：\n一、调整服务时间\n自5月10日起，西湖内环线末班时间恢复为18:15，西湖外环线，末班时间恢复为18:00。其余不变。\n二、调整支援配置\n1.自5月10日起：\n（1）钱塘公司整线运营的510路恢复为电车分公司运营。双休、节假日胜利剧院西侧现场管理点责任单位由电车分公司承担，地铁吴山广场站C口责任单位由汽五分公司承担。\n（2）萧山公司不再支援194路区间。\n（3）余杭公司不再支援西湖外环线支线。\n2.自5月11日起：\n黄龙洞至上天竺（法喜寺）专线暂停运营服务。黄龙洞现场管理点责任单位由汽二分公司承担，双休、节假日由修理分公司派员协助管理。\n3.自5月16日起：\n（1）萧山公司整线运营的动物园至地铁水澄桥、龙翔桥站专线恢复为汽五分公司运营。运营模式调整为动物园至龙翔桥单向运营。双休日动物园停车场现场管理点责任单位由汽五分公司承担。\n（2）富阳公司不再支援汽二分公司运营的308路区间、318路区间、324H路。双休日水澄桥现场管理点由汽二分公司承担。\n特此通知。\n集团客运管理部\n2026年5月9日"}],"size":548},"调整华中路周边公交停靠站点名称":{"sections":[{"title":"调整华中路周边公交停靠站点名称","text":"关于调整华中路周边部分公交停靠站点\n名称的通知\n各单位、各部室：\n为进一步提升公交运营管理水平，规范站名设置，结合线路实际运营情况，自5月10日起，对华中路周边部分公交停靠站点名称进行调整，具体为：\n一、调整原因\n华中路（石祥东路-杭玻街）沿线现状布设2对公交停靠站，目前西侧“华中路华丰路口”站与东侧“华中路华丰路口”站、西侧“太公街”站与东侧“太公街”站均相隔一个路口，造成西侧“华中路华丰路口”站点对向为东侧“太公街”站点，站点对应错位，极易误导市民乘车。\n同时，太公街已向西延伸，沿用原有道路名称作为公交站名，地理指向性模糊、辨识度不足。为消除出行歧义、规范站点标识，现对上述公交站点名称进行优化调整。\n二、调整方案\n1.将原位于华中路华丰路南口的“华中路华丰路口”单向停靠站（道路西侧）以及“太公街”单向停靠站（道路东侧）更名为“华中支路”。\n2.将原位于华中路太公街南口的“太公街”单向停靠站（道路西侧）更名为“华中路朱家塘”。\n同时，304路的“半山路公交站”更名为“半山公交总站”。\n上述站点涉及99路、125路、135路、304路、316路于5月10日起一并更换站牌、站名表、报站语音及各类标志标识。\n三、相关要求\n1.切实做好安全行车和优质服务工作，并提前组织司机熟悉路线。\n2.按要求完成电脑报站器的语音灌制、站名表等服务标志的制作和安装、调度系统中基础数据的修改、线路走向轨迹的更新设置等工作。\n3.请各单位加强宣传引导，落实相关线路的车厢通告。\n特此通知。\n集团客运管理部\n2026年5月1日"}],"size":688},"调整95、135路等线路":{"sections":[{"title":"调整95、135路等线路","text":"关于调整95、135路等线路的通知\n各单位、各部室：\n为进一步优化线网结构，提升公交服务水平，结合古扇弄、华西路、太公街等道路开通，方便石桥铭苑、华丰欣苑、联发悦望荟等小区出行，自5月10日起，将调整95、135路，具体如下：\n调整丁桥公交总站至运河广场的95路线路走向。调整后的线路走向：丁桥公交总站始发，循原线至石桥路，经古扇弄、石桥苑巷、石祥路后再循原线至运河广场；运河广场至丁桥公交总站方向不变。撤销：石桥路石祥路口1只单向停靠站；增设：老汽轮厂、石桥铭苑2只单向停靠站。同时，“丁桥公交站”更名为“丁桥公交总站”，“华丰北苑”更名为“孙家湾”，“瓜山南苑”更名为“卫星桥”。其余不变。\n调整艮山门东至千桃园的135路线路走向，调整后的线路走向：艮山门东始发（下行），循原线至新汇路，双向经华西路、太公街、华中路后再循原线至千桃园。撤销：太公街（上行）1只单向停靠站；增设：华西路南、长善、水车头、水车港东（上行）4对（只）停靠站。同时，“华中路华丰路口”更名为“华中支路”，“太公街”更名为“华中支路”。其余不变。\n特此通知。\n集团客运管理部\n2026年5月8日"}],"size":489},"调整西湖景区部分线路(更新)":{"sections":[{"title":"调整西湖景区部分线路(更新)","text":"关于调整西湖景区部分线路的通知\n各单位、各部室：\n为进一步提高管理水平，结合西湖景区客流情况变化，经研究，自5月10日起，将调整西湖南线部分公交线路服务时间及支援配置，具体如下：\n一、调整服务时间\n自5月10日起，西湖内环线末班时间恢复为18:15，西湖外环线，末班时间恢复为18:00。其余不变。\n二、调整支援配置\n1.自5月10日起：\n（1）钱塘公司整线运营的510路恢复为电车分公司运营。双休、节假日胜利剧院西侧现场管理点责任单位由电车分公司承担，地铁吴山广场站C口责任单位由汽五分公司承担。\n（2）萧山公司不再支援194路区间。\n（3）余杭公司不再支援西湖外环线支线。\n2.自5月11日起：\n黄龙洞至上天竺（法喜寺）专线暂停运营服务。黄龙洞现场管理点责任单位由汽二分公司承担，双休、节假日由修理分公司派员协助管理。\n3.自5月16日起：\n（1）萧山公司整线运营的动物园至地铁水澄桥、龙翔桥站专线恢复为汽五分公司运营。运营模式调整为动物园至龙翔桥单向运营。双休日动物园停车场现场管理点责任单位由汽五分公司承担。\n（2）富阳公司不再支援汽二分公司运营的308路区间、318路区间、324H路。双休日水澄桥现场管理点由汽二分公司承担。\n特此通知。\n集团客运管理部\n2026年5月9日"}],"size":548},"杭州公交公告汇编(20260425版)":{"sections":[{"title":" n \n\n \n\n \n\n附件：\n\n1106\n\n线路编码\n\n起讫点\n\n时段\n\n发车间隔\n\n起讫点\n\n时段\n\n发车间隔\n\n1106\n\n中塘\n\n7:00-9:30\n\n发车间隔不大于\n\n皋亭坝北\n\n7:10-8:20\n\n发车间隔不大于\n\n17:00-18:40\n\n发车间隔约\n\n8:20-9:30\n\n发车间隔约\n\n18:40-19:00\n\n发车间隔不大于\n\n9:30-9:40\n\n发车间隔\n\n17:10-19:10\n\n发车间隔不大于\n\n \n\n \n\n走进公交\n\n党的建设\n\n新闻中心\n\n人才招聘\n\n商务合作\n\n联系我们\n\n浙ICP备07024123号-1"},{"title":"因江晖路（江南大道－新月路）恢复通行，6月2日起，恢复195路线路部分走向","text":"## 因江晖路（江南大道－新月路）恢复通行，6月2日起，恢复195路线路部分走向\n\n**发布时间：** 2026/06/01\n\n**来源：** 杭州市公共交通集团有限公司\n\n**链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9352)\n\n因江晖路（江南大道－新月路）恢复通行，根据交警部门道路交通组织方案，\n\n195\n\n走进公交\n\n党的建设\n\n新闻中心\n\n人才招聘\n\n商务合作\n\n联系我们\n\n浙ICP备07024123号-1"},{"title":"杭州公交公告汇编(20260425版)","text":"# 杭州公交公告汇编\n**最后更新时间：** 2026-05-27\n---\n## 5月30日起，开通1401H路、优化提升部分\"5分钟巴士\"\n- **发布时间：** 2026-05-27\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9332)\n为进一步优化线网结构，提升公交服务品质，满足之江文化中心区域市民出行需求，同时强化西浦路地铁站的公交接驳效能，结合线路运营实际，近期将开通1401H路，并对地铁西浦路站D口至贝遨大厦接驳线进行优化提升，纳入\"5分钟接驳巴士\"运营体系，具体如下：\n### 一、开通1401H路\n**开通日期：** 2026年5月30日\n- **起讫点：** 之江文化中心中（近浙江图书馆之江馆）↔ 地铁枫桦西路站（B·C）\n- **线路走向（去程）：** 之江文化中心中始发，经之江文化中心内部道路、枫桦路、文景路、江涵路、枫桦西路至地铁枫桦西路站（B·C）（北塘闸）\n- **线路走向（回程）：** 地铁枫桦西路站（B·C）（北塘闸）始发，经枫桦西路、枫桦路、之江文化中心内部道路至之江文化中心中（近浙江图书馆之江馆）\n- **沿途停靠站（仅开往地铁枫桦西路站方向，共3站）：** 浙江图书馆之江馆、之江文化中心北、浙江省非物质文化遗产馆\n- **服务时间（仅双休日及节假日运营）：** 之江文化中心中 9:00-17:00；地铁枫桦西路站（B·C）8:50-16:50\n- **发车间隔：** 10分钟\n- **票价：** 每人次壹元，各类IC卡及移动支付通用\n- **停靠方式：** 实施响应式停靠\n### 二、地铁西浦路站D口至贝遨大厦接驳线转正为7179路\n**调整日期：** 2026年5月28日\n- **线路编码：** 7179路\n- **性质：** 由\"六进\"服务线转正为常规线，同步提升为\"5分钟巴士\"\n- **早高峰走向（去程）：** 地铁西浦路站D口始发，经滨文路、西浦路、坚塔街、堤东路至堤东路生地街口（丁香中心西门）；沿途单向停靠：坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）、堤东路陆家潭街口（泰格药业）\n- **晚高峰走向（回程）：** 潘曹街堤东路口（丁香中心南门）始发，经潘曹街、潮涌路、生地街、西浦路、坚塔街、闻涛路、滨文路至地铁西浦路站D口；沿途单向停靠：坚塔街西浦路口（光云大厦）、贝遨大厦（招呼站）\n- **发车间隔（\"5分钟巴士\"标准）：** 地铁西浦路站D口 7:50-9:30 约7分钟；潘曹街堤东路口 17:30-19:00 约7分钟\n- **停靠方式：** 实施响应式停靠\n- **其余不变**\n### 三、调整3路部分走向\n**调整日期：** 2026年5月31日\n- **起讫点：** 南落马营总站 ↔ 大关小区总站（不变）\n- **调整后走向（南落马营总站出发方向）：** 南落马营总站始发，经南落马营、闻塘弄、秋涛路、候潮东路后循原线至大关小区总站；大关小区总站至南落马营总站方向不变\n- **站点变化：** 增设 秋澜悦庭（开往大关小区总站方向，1只单向停靠站）；南落马营总站外（招呼站）迁移至南落马营总站出入口西侧\n- **其余不变**\n### 四、调整13路部分走向\n**调整日期：** 2026年5月31日\n- **起讫点：** 南落马营总站 ↔ 海洋二所（不变）\n- **调整后走向（南落马营总站出发方向）：** 南落马营总站始发，经南落马营、闻塘弄、秋涛路后循原线至海洋二所；海洋二所至南落马营总站方向不变\n- **站点变化：** 增设 秋澜悦庭（开往海洋二所方向，1只单向停靠站）；南落马营总站外（招呼站）同步3路调整迁移位置\n- **其余不变**\n### 五、调整1106路发车时间\n**调整日期：** 2026年6月1日\n- **线路：** 皋亭坝北 ↔ 中塘（1106路，工作日）\n- **调整后发车间隔：**\n- 中塘 7:00-9:30 不大于10分钟；17:00-18:40 约7分钟；18:40-19:00 不大于10分钟\n- 皋亭坝北 7:10-8:20 不大于10分钟；8:20-9:30 约7分钟；9:30-9:40 10分钟；17:10-19:10 不大于10分钟\n- **其余不变**\n### 六、\"大关小区北\"西侧站实施分站停靠\n**调整日期：** 2026年6月2日\n- **分站方式：** \"大关小区北\"西侧站按自北向南顺序划分为①号、②号站台\n- ①号站台：274路（始发线路）\n- ②号站台：26路、47路、77路（途经线路）\n---\n## 104、302路等线路方案的意见征求\n- **发布时间：** 2026-05-26\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9321)\n> 为进一步完善公交线网，优化公交资源配置，提升公交线路运营、管理、服务水平，近期拟调整104、302路等线路，具体如下（**公示期：2026年5月26日至5月28日，意见反馈电话：0571-85191122**）：\n### 一、调整线路\n#### 1. 104路（调整走向）\n- **起讫点：** 九堡四季青总站 ↔ 学正街公交总站（不变）\n- **调整原因：** 为方便九堡家苑等商杭街沿线居民出行，拟调整104路至商杭街行驶\n- **调整后走向：** 九堡四季青总站始发，循原线至杭乔路，双向经商杭街、东湖南路、德胜东路后循原线至学正街公交总站\n- **站点变化（开往学正街公交总站方向）：** 撤销 汽车客运中心西、地铁客运中心站；增设 商杭街杭乔路口、商杭街友爱路口、月雅河桥、德胜东路月雅路口、幸福南路学源街口、学源街幸福南路口、学源街海达南路口、学源街上沙路口、学源街银沙路口、高沙路学源街口、高沙社区、文渊路二号大街口、四号大街三号路口、四号大街五号路口、四号大街九号路口、九号路六号大街口、六号大街十一号路口、六号大街十九号路口、六号大街二十三号路口、六号大街二十五号路口、二十五号路六号大街口、十号大街二十七号路口、二十七号路六号大街口\n- **站点变化（开往九堡四季青总站方向）：** 撤销 汽车客运中心西、地铁客运中心站；增设 二十七号路六号大街口、十号大街二十七号路口、二十五号路十号大街口、二十五号路听涛路口、二十五号路十四号大街口、十六号大街二十五号路口、二十三号路二十号大街口、二十四号大街二十号大街口、二十四号大街东、二十四号大街、二十四号大街十九号路口、江湾巷之江东路口、钱塘轮滑中心、之江东路风帆路口、之江东路五号路口、一号路二十号大街口、第三车辆检测站、七格工业园、七格桥头、幸福桥、头格社区、八堡社区、仁爱路总站外、旺杨街仁爱路口、旺杨街杭乔路口、旺杨街九睦南路口、红普南路之江东路口、彭埠大桥北、之江路钱潮路口、庆春东路富春路口、地铁钱江路站、庆春广场东、新塘路凤起东路口、顺福路塘潮街口\n#### 2. 302路（调整走向）\n- **起讫点：** 学正街公交总站 ↔ 景芳南站（不变）\n- **调整原因：** 为方便杨公佳苑、丽江公寓等旺杨街沿线市民前往主城区、换乘地铁9号线，拟调整302路至旺杨街行驶\n- **调整后走向：** 学正街公交总站始发，循原线至下沙路，双向经仁爱路、旺杨街、钱江东路、红普南路、之江东路后循原线至景芳南站\n- **站点变化（开往景芳南站方向）：** 增设 旺杨街仁爱路口、旺杨街杭乔路口、旺杨街九睦南路口、红普南路之江东路口、彭埠大桥北、之江路钱潮路口、庆春东路富春路口、地铁钱江路站、庆春广场东、新塘路凤起东路口、顺福路塘潮街口\n- **站点变化（开往学正街公交总站方向）：** 增设 景芳五区南、顺福路塘潮街口、凤起东路顺福路口、新塘路凤起东路口、庆春广场东、庆春隧道西口、地铁钱江路站、庆春东路富春路口、之江路钱潮路口、彭埠大桥北、红普南路之江东路口、地铁红普南路站、旺杨街九睦南路口、旺杨街杭乔路口、旺杨街仁爱路口、仁爱路总站外、杨公村东、八堡社区、头格社区、幸福桥、七格桥头、七格工业园、第三车辆检测站、一号路二十号大街口、之江东路风帆路口、钱塘轮滑中心、江湾巷之江东路口、二十四号大街十九号路口、二十四号大街、二十四号大街东、二十四号大街二十号大街口、二十三号路二十号大街口、十六号大街二十五号路口、二十五号路十四号大街口、二十五号路听涛路口、二十五号路十号大街口、十号大街二十七号路口、二十七号路六号大街口\n#### 3. 7157路（调整起讫点及走向）\n- **原起讫点：** 塘子堰公交总站 ↔ 地铁联庄站\n- **新起讫点：** 张家村 ↔ 地铁诚业路站\n- **调整原因：** 为提升冠新佳苑、滨耀学府等小区居民换乘地铁6号线效率，拟将7157路优化至地铁诚业路站至张家村；调整后，将开通创意城小学接驳线解决白马湖和院等天马路周边早晚通学需求\n- **调整后走向（下行往地铁诚业路站）：** 张家村始发，经映翠路、湘西路、天马路后循原线至火炬大道，经江南大道至地铁诚业路站\n- **调整后走向（上行往张家村）：** 地铁诚业路站始发，经江南大道、信诚路、滨安路、火炬大道后循原线至天马路，经湘西路、映翠路至张家村\n- **沿途停靠（下行）：** 湘北桥、双贤桥、时代大道南川路口、孔家里西、冠浦桥东、博研桥、山秀景苑西、冠新佳苑东区、冠新佳苑西区、岩大房、楼下里、永久桥\n- **沿途停靠（上行）：** 滨安路诚业路口、滨安路火炬大道口、火炬大道滨安路口、楼下里、岩大房、冠新佳苑西区、冠新佳苑东区、山秀景苑西、冠浦桥东、孔家里西、时代大道南川路口、双贤桥、湘北桥\n#### 4. 571路（调整走向）\n- **起讫点：** 天都城北站 ↔ 杭钢公园2号高炉（不变）\n- **调整原因：** 结合金昌路道路开通，优化571路线路走向\n- **调整后走向（往杭钢公园2号高炉方向）：** 杭钢公园2号高炉始发，经炼铁街、半山路、金昌路、康园南路后循原线至天都城北站；天都城北站至杭钢公园2号高炉方向不变\n- **站点变化（往杭钢公园2号高炉方向）：** 增设 依山前、杭钢公园1号高炉；撤销 杭钢公园2号高炉外（招呼站）\n- **其余不变**\n### 二、终止线路\n#### 276H路\n- **原起讫点：** 黄龙公交总站 ↔ 白堤\n- **终止原因：** 因已开通黄龙洞至北山街沿线的北山街接驳线，已替代276H路服务功能，拟终止276H路运营\n### 意见反馈\n市民乘客可通过拨打 **0571-85191122** 提出反馈意见。**公示期：2026年5月26日至5月28日**\n---\n## 自5月22日起，调整126、287路等线路\n- **发布时间：** 2026-05-21\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9292)\n为进一步优化公交线网布局，近期将在西浦路地铁站新增1条\"5分钟接驳巴士\"，试运营北山街接驳线，并对126、287路等线路进行调整，具体如下：\n### 一、试运营北山街接驳线\n为方便北山街沿线游客前往黄龙洞地铁站，**自5月23日起**，试运营黄龙洞至黄龙公交总站的\"北山街接驳线\"。\n- **线路走向：** 黄龙洞始发，经曙光路、保俶路、北山街、曙光路、杭大路、西溪路至黄龙公交总站。\n- **沿途停靠：** 松木场、省府大楼西、葛岭（断桥残雪）、新新饭店、岳坟、浙大附中、黄龙洞7只单向停靠站。\n- **首末班时间：** 仅双休节假日开行，黄龙洞 9:30-17:15。\n- **票价：** 每人次贰元，各类IC卡及移动支付通用。\n### 二、调整线路\n#### 1. 4路快线（调整发车时间）\n**自5月25日起**，调整转塘公交总站至龙翔桥公交总站的4路快线发车时间。其余不变。\n| 起讫站 | 时段 | 发车间隔 |\n|---|---|---|\n| 4路快线 转塘公交总站（工作日） | 6:30-7:30 | 每逢整点、15分、半点、45分发车 |\n| 4路快线 转塘公交总站（工作日） | 7:30-8:10 | 每逢10分、半点、50分发车 |\n| 4路快线 龙翔桥公交总站（工作日） | 17:40-18:00 | 17:40、18:00 |\n#### 2. 126路（调整起讫站）\n**自5月24日起**，将武林广场西至九堡杭乔路总站的126路调整为**武林广场东至九堡杭乔路总站**。\n- **调整后走向：** 武林广场东始发，经展览东路、环城北路后循原线至九堡杭乔路总站；九堡杭乔路总站始发，循原线至体育场路，经展览东路至武林广场东。\n- **撤销：** 武林广场西始发站。\n- **增设：** 红普南路之江东路口1对双向停靠站及武林广场东始发站。\n- **调整后首末班时间：** 武林广场东 6:25-21:40，九堡杭乔路总站 5:25-20:40。\n- 其余不变。\n#### 3. 225路（调整部分走向）\n**自5月24日起**，调整九堡四季青总站至四季青的225路部分线路走向。\n- **调整后走向：** 九堡四季青总站始发，循原线至钱塘快速路，经彭埠立交桥、空港高架路（昙花庵路匝道下）、钱畔隧道、钱江路、解放东路后循原线至四季青；四季青始发，循原线至钱江路，经钱畔隧道、空港大道、彭埠互通、钱塘快速路后循原线至九堡·四季青服装交易中心。\n- **撤销：** 云河家园（往四季青方向）、章家坝小区、新塘家园、水湘西苑、卢家塘、钱潮路塘潮街口、唐家井、钱江三苑、钱潮路钱江路口（往九堡四季青总站方向）、钱潮路公交总站外（往四季青方向）、富春路民心路口、富春路丹桂街口、新业路市民中心13对（只）停靠站。\n- **增设：** 二堡、钱江路庆春东路口、钱江路江锦路口3对双向停靠站。\n- **同时取消：** 章家坝小区至四季青的225路区间。\n- 其余不变。\n#### 4. 1110路（调整起讫站及走向）\n**自5月27日起**，将杨家里至东新路瑞银街口的1110路调整为**珠埠里（新站）至东新瑞银总站**。\n- **调整后走向：** 珠埠里始发（下行），经大功巷、绍兴路400弄、长德弄、再行路、香积寺路后循原线至东新瑞银总站；东新瑞银总站始发，循原线至香积寺路，经再行路、长德弄、绍兴路400弄、大成巷、春睦弄、大功巷至珠埠里。\n- **撤销：** 三塘小区、三塘南村、香积寺路白石巷口（往杨家里方向）3对（只）停靠站及杨家里始发站。\n- **增设：** 六塘公寓（往珠埠里方向）、三塘汶园西、再行里、杨家里（往珠埠里方向）4对（只）单向停靠站及珠埠里始发站。\n- **站点迁移：** 原绍兴路400弄\"珠埠里\"站迁移至大功巷。\n- **运营说明：** 该线在大成巷、春睦弄、大功巷区域实行循环运营。\n- **调整后首末班时间：**\n- 珠埠里：7:15-18:35（工作日）、7:30-18:35（双休、节假日）\n- 东新瑞银总站：6:45-19:05（工作日）、7:00-19:05（双休、节假日）\n- 其余不变。\n#### 5. 5483路（恢复并优化起讫点）\n**自5月25日起**恢复5483路，并将起讫点优化为**如意尖至云浦佳苑三区**。\n- **调整后走向：** 如意尖始发，循原线至灵龙路，经袁富路、科海路、夏铜街至云浦佳苑三区；云浦佳苑三区始发，经夏铜街、科海路、袁富路、灵龙路后循原线至如意尖。\n- **撤销：** 李乡潘家1对双向停靠站及周浦公交总站始发站。\n- **增设：** 云浦佳苑三区始发站。\n- **调整后服务时间（仅工作日运营）：**\n- 如意尖：周一至周五 7:20\n- 云浦佳苑：周一、周五 16:30、17:45；周二至周四 16:50、17:45\n- 其余不变。\n#### 6. 5704路（调整起讫站）\n**自5月22日起**，将杭州汽车客运中心至三村南的5704路调整为**地铁客运中心站D口至三村南**。\n- **调整后走向：** 地铁客运中心站D口始发，经九沙大道后循原线至三村南；三村南始发，循原线至杭乔路，经九沙大道至地铁客运中心站D口。\n- **撤销：** 杭州汽车客运中心始发站。\n- **增设：** 地铁客运中心站D口始发站。\n- **调整后服务时间：** 地铁客运中心站D口为 6:45、7:10，三村南不变。\n- 其余不变。\n#### 7. 8193路（调整起讫站）\n**自5月24日起**，将环北新村总站至西溪源公交总站的8193路调整为**武林广场西至里山桥**。\n- **调整后走向：** 武林广场西始发，经展览西路、体育场路后循原线至留和路，经里东路至里山桥；里山桥始发，经里东路、留和路后循原线至环城北路，经展览西路至武林广场西。\n- **撤销：** 武林广场东（往西溪源公交总站方向）1只单向停靠站及环北新村总站、西溪源公交总站始发站。\n- **增设：** 环北新村（往武林广场西方向）1只单向停靠站及里山桥、武林广场西始发站。\n- **调整后服务时间：** 武林广场西 0:00，里山桥 22:50。\n- 其余不变。\n#### 8. 60C路（停驶）\n**自5月25日起**，停驶康馨苑至地铁拱宸桥东站·大运河东的60C路。\n---\n## 自5月23日起，优化调整147、312路等线路\n- **发布时间：** 2026-05-21\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9291)\n为进一步优化公交线网布局，提升公共交通运营效能，自 **5月23日** 起对 **147路、312路等6条线路** 实施优化调整。具体如下：\n### 一、312路调整\n#### 起讫点变化\n- **原：** 地铁桃源街站（A·C）— 城站火车站\n- **调整后：** **刘文村北 — 城站火车站**\n#### 走向变化\n- **去程（往城站火车站方向）：** 车辆由石塘公交停车场驶出，经临半路 → 半山路 → 石桥路 → 永华街 → 竹清路 → 永波街 → 回龙路 → 石祥路 → 东新路 → 东新路跨线桥 → 东新路后，再循原线至城站火车站。\n- **回程（往刘文村北方向）：** 城站火车站始发，循原线至回龙路，经永波街 → 竹清路 → 永华街 → 石桥路 → 半山路 → 临半路至刘文村北，下客后车辆继续向北行驶至石塘公交停车场。\n#### 站点变化\n**撤销站点（8对/只）：**\n- 地铁桃源街站B口（往城站火车站方向）\n- 夏莲支路（往城站火车站方向）\n- 半山金星\n- 莫家门（往城站火车站方向）\n- 杭州装饰城\n- 北景竹邻苑（往地铁桃源街站方向）\n- 打铁关北（往城站火车站方向）\n- 地铁桃源街站（A·C）始发站\n**增设站点（9对/只）：**\n- 刘文村\n- 薄板分厂\n- 沈家桥\n- 焦化分厂\n- 永华街竹清路口\n- 北景枫丹苑东\n- 回龙里\n- 北景月桂苑1幢（招呼站）（往刘文村北方向）\n- 北景园中心广场东（招呼站）\n- **刘文村北始发站**\n#### 运营时间\n| 区间 | 服务时间 |\n|------|----------|\n| 刘文村北 → 城站火车站 | 4:50 - 20:50 |\n| 城站火车站 → 刘文村北 | 6:10 - 22:10 |\n| 刘文村北 → 打铁关 | 21:10 - 24:00 |\n| 打铁关 → 刘文村北 | 22:00 - 23:10 |\n> 其余不变。\n### 二、350路调整\n#### 起讫点变化\n- **原：** 塘栖人民路总站 — 草庵公交总站\n- **调整后：** **塘栖人民路总站 — 德胜东村总站**\n#### 走向变化\n- **去程：** 塘栖人民路总站始发，循原线至东新路，经香积寺路 → 再行路 → 德胜路至德胜东村总站。\n- **回程：** 德胜东村总站始发，经德胜路 → 东新路后循原线行驶。\n> ⚠️ **施工绕行提示：** 因地铁15号线崇贤站施工，崇杭街部分路段封闭施工，350路崇贤段改经崇杭街 → 来贤路 → 前村街 → 崇超南路 → 崇杭街后，再循原线至塘栖人民路总站。\n#### 站点变化\n**撤销站点：**\n- 方马家塘（双向停靠站）\n- 草庵公交总站始发站\n**增设站点（4对/只）：**\n- 崇贤张家桥\n- 顾家塘\n- 长木桥（往塘栖人民路总站方向）\n- 三塘竹园（往德胜东村总站方向）\n- **德胜东村总站始发站**\n#### 运营时间\n| 始发站 | 服务时间 |\n|--------|----------|\n| 德胜东村总站 | 6:30 - 20:30 |\n| 塘栖人民路总站 | 5:30 - 19:00 |\n> 其余不变。\n### 三、7032路调整\n#### 走向变化\n- **去程：** 焦家村公交总站始发，循原线至东新路，经长浜弄 → 长浜路后，再循原线至石前。\n- **回程：** 石前始发，循原线至长浜路，经德胜路 → 东新路后，再循原线至打铁关。\n> ⚠️ **施工绕行提示：** 因地铁15号线崇贤站施工，崇杭街部分路段封闭施工，7032路崇贤段改经崇杭街 → 来贤路 → 前村街 → 崇超南路 → 崇杭街后，再循原线至石前。\n#### 站点变化\n**撤销站点（2对双向）：**\n- 地铁杭氧站A口\n- 方马家塘\n**增设站点（4对双向）：**\n- 杭氧\n- 东新路德胜路口\n- 顾家塘\n- 崇贤张家桥\n> 其余不变。\n### 四、380路调整\n#### 起讫点变化\n- **原：** 德胜东村总站 — 临平红丰桥总站\n- **调整后：** **草庵公交总站 — 临平红丰桥总站**\n#### 走向变化\n- **去程：** 草庵公交总站始发，经长浜路 → 香积寺东路 → 东新路后，循原线至临平红丰桥总站。\n- **回程：** 临平红丰桥总站始发，循原线至东新路，经德胜路至草庵公交总站。\n#### 站点变化\n**撤销站点（2只单向）：**\n- 长木桥（往临平红丰桥总站方向）\n- 三塘竹园（往德胜东村总站方向）\n- 德胜东村总站始发站\n**增设站点：**\n- **草庵公交总站始发站**\n#### 运营时间\n| 始发站 | 服务时间 |\n|--------|----------|\n| 草庵公交总站 | 6:40 - 19:50 |\n| 临平红丰桥总站 | 5:30 - 18:30 |\n> 其余不变。\n### 五、512（512B）路调整\n#### 调整原因\n为弥补312路调整后，半山路沿线居民至桃源街地铁站换乘的公交空白。\n#### 走向变化\n- **调整后走向：** 吴家墩西苑始发（下行），循原线至桃源街，双向经夏莲路 → 夏莲支路 → 春蓝路 → 桃源街后，再循原线至半山公交总站。\n#### 站点变化\n**撤销站点（1只单向）：**\n- 地铁桃源街站A口北（往吴家墩西苑方向）\n**增设站点（3对/只）：**\n- 地铁桃源街站A口\n- 地铁桃源街站B口（往吴家墩西苑方向）\n- 夏莲支路\n#### 新增区间线路\n法定工作日早晚高峰时段，增开 **半山路公交站至半山金星站** 的512路区间。\n> 其余不变。\n### 六、147路停驶\n#### 停驶原因\n调整后的312路、350路、7032路已覆盖147路服务范围。\n**停驶线路：** 崇贤公交总站 — 绍兴支路的 **147路**\n---\n## 5月23日起，因崇杭街（崇超南路至方马路）段将封闭施工，临时调整7439路部分走向\n- **发布时间：** 2026-05-21\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9284)\n因杭州地铁四期15号线崇贤站施工需要，为确保道路交通有序、安全，根据公安机关交通管理部门交通组织措施，自5月23日起，崇杭街（崇超南路至方马路）段将封闭施工，涉及7439路需临时调整部分线路走向，具体为：\n### 调整后线路走向\n临平新丰总站始发，循原线至崇杭街，**双向改经来贤路、前村街、崇超南路、崇杭街**后再循原线至勾庄农副物流总站。\n### 站点变化\n- **临时撤销：** 方马家塘1对双向停靠站\n- **临时增设：** 顾家塘1对双向停靠站\n- **站名更名：** 石塘南更名为大花桥\n### 注意事项\n以上调整均为**临时性**调整，待崇杭街（崇超南路至方马路）段施工结束后，线路将恢复原走向。\n---\n## 自5月22日起，优化287路、1702路\n- **发布时间：** 2026-05-20\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9283)\n为进一步优化公交线网布局，近期将在九和路地铁站优化1条\"5分钟接驳巴士\"，并对287路进行调整，具体如下：\n### 一、1702路调整详情\n**调整目的：** 进一步提升运营效率，优化为\"5分钟接驳巴士\"\n**线路端点变更：**\n- 调整前：福临街普照巷口 ↔ 金禾街九睦路口\n- 调整后：福临街普照巷口 ↔ 地铁九和路站（A·C）\n**调整后线路走向：**\n- **往地铁九和路站方向（下行）：** 福临街普照巷口始发，经福临街、红普路、德胜东路、九环路、九和路至地铁九和路站（A·C）\n- **往福临街普照巷口方向（上行）：** 地铁九和路站（A·C）始发，经九和路、红普路、德胜东路、普德路、建福街、普照巷、福临街至福临街普照巷口\n**撤销站点（共8对/只）：**\n- 地铁九和路站（A·C）（往金禾街九睦路口方向）\n- 九和路九环路口\n- 九和路牛泰巷口（往福临街普照巷口方向）\n- 地铁九堡站C口\n- 牛田社区（往金禾街九睦路口方向）\n- 牛田（往金禾街九睦路口方向）\n- 九睦路九沙大道口（往金禾街九睦路口方向）\n- 九沙大道杭海路口（往福临街普照巷口方向）\n- 金禾街九睦路口始发站\n**新增站点：**\n- 地铁九和路站（A·C）始发站（新增始发站）\n**升级为\"5分钟接驳巴士\"：**\n- 福临街普照巷口出发：07:30-08:30，发车间隔约6分钟\n- 地铁九和路站出发：17:30-19:00，发车间隔约6分钟\n### 二、287路调整详情\n**调整目的：** 方便皋塘片居民出行\n**线路端点（不变）：** 浙大二院滨江院区北 ↔ 浙大二院城东院区\n**调整后线路走向：**\n- **往浙大二院城东院区方向（有调整）：** 浙大二院滨江院区北始发，循原线至艮山西路，经新塘路、环站南路、明月桥路后循原线至浙大二院城东院区\n- **往浙大二院滨江院区北方向：** 不变\n**站点变化：**\n- **撤销：** 皋塘桥西（往浙大二院城东院区方向）1只单向停靠站\n- **增设：** 艮新天桥北（往浙大二院城东院区方向）、皋塘运都（往浙大二院滨江院区北方向）等单向停靠站\n**调整后线路长度：** 下行19.1公里\n以上两条线路其余内容不变。\n---\n## 5月18日起，新增长河街道南片接驳线\n- **发布时间：** 2026-05-19\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9265)\n为进一步提升公交服务品质，优化长河街道区域公交线网，切实强化耕文路、振宁路等地铁站的公交接驳效能，更好满足周边居民日常出行需求，结合线路运营实际，近期将新增长河街道南片接驳线，调整519路，具体如下：\n### 1．新开线路：长河街道南片接驳线\n- **线路类型：** \"六进\"服务线\n- **起讫点：** 映翠雅苑 至 长虹南苑\n- **开通日期：** 2026年5月18日\n- **票价：** 每人次贰元，各类IC卡及移动支付通用\n**去程线路走向：** 映翠雅苑始发，经漫湖巷、长江路、天马路、时代大道辅路、白马湖路、江虹南路、冠山路、长江路、滨文路、东冠路、南川路、清旷街至长虹南苑。\n**回程线路走向：** 长虹南苑始发，经清旷街、信诚南路、滨文路、长江路、冠山路、江虹南路、白马湖路、时代大道辅路、天马路、腾龙路、映翠路、漫湖巷至映翠雅苑。\n**沿途停靠站（5对双向停靠站）：** 双贤桥、山一村、白马湖路腾龙路口、白马湖小区鸿雁苑、月湾潭\n**服务时间：**\n- 映翠雅苑：7:00、8:40、17:00、18:40\n- 长虹南苑：7:50、9:30、17:50、19:30\n### 2．调整线路：519路\n- **起讫点：** 江陵路公交总站 至 地铁耕文路站B口\n- **调整日期：** 2026年5月16日\n- **其余不变。**\n**调整后的线路走向：**\n去程：江陵路公交总站始发，循原线至利华路，经生兴路、鸿宁路、通惠北路后循原线至地铁耕文路站B口。\n回程：地铁耕文路站B口始发，经学知路、弘慧路、奔竞大道、通惠北路、鸿宁路、生兴路、利华路后循原线至江陵路公交总站。\n**撤销站点（5对双向停靠站）：** 利华路生兴路口、陆路口岸、宁牧、宁新、通惠北路鸿达路口\n**增设站点（7对双向停靠站）：** 地铁兴议站B口、文明路利丰路口、振宁路丰二路口、振宁路永晖路口、生兴路汝宁弄口、生兴路扬帆路口、二桥村\n---\n## 5月18日起，优化提升1106、1219路等线路、调整部分站名\n- **发布时间：** 2026-05-19\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9264)\n为进一步提升公交服务品质，合理配置公交资源，扩大部分区域5分钟巴士通勤圈覆盖范围，强化皋亭坝、古翠路等地铁站的公交接驳效能，方便市民高效换乘出行。结合线路运营实际，近期将对1106、1219路进行优化提升，纳入\"5分钟巴士\"运营体系，具体如下：\n### 一、升级\"5分钟巴士\"\n#### 1. 调整皋亭坝北至中塘的1106路\n**服务时间调整：**\n- 中塘：7:00-9:30、17:00-19:00\n- 皋亭坝北：7:10-9:40、17:10-19:10\n**升级内容：**\n- 线路提升为\"5分钟巴士\"\n- 早高峰皋亭坝北8:30-9:20发车间隔约7分\n- 晚高峰中塘17:20-18:30发车间隔约7分\n- 线路实行响应式停靠\n**其余不变，调整日期为2026年5月18日**\n#### 2. 将1219路提升为\"5分钟巴士\"\n**发车间隔：**\n- **早高峰：**\n- 文三古翠总站7:00-8:00发车间隔约7分\n- 三坝7:30-8:30发车间隔约7分\n- **晚高峰：**\n- 文三古翠总站17:00-18:00发车间隔约7分\n- 三坝17:30-18:30发车间隔约7分\n**其余不变，调整日期为2026年5月18日**\n### 二、调整站名\n结合原武林广场周边公交站名、设置地理布局，为进一步提升市民辨识度，自5月18日起，将原展览东路\"武林广场\"公交站更名为\"武林广场东\"\n**涉及线路**：313、318C、506C、520、8202、8211、8218路及大红豆数字旅游专线\n**补充说明**：8192、8193路待下批武林广场周边线路时一并调整\n### 三、调整部分线路停靠站及夜间线始发站\n#### 1. 318C路（转塘公交总站/龙坞葛衙庄总站→武林广场东）\n在\"武林小广场\"与\"轮船码头\"之间**增设**\"环北新村\"1只单向停靠站\n**调整日期**：2026年5月18日\n#### 2. 506C路（中泰公交总站→武林广场东）\n在\"闲林工业区\"与\"闲林埠\"之间**增设**\"闲林北\"1对双向停靠站\n**调整日期**：2026年5月18日\n#### 3. 8202路（武林广场东→转塘公交停车场）\n- 在\"梵村\"与\"九溪\"之间**增设**\"珊瑚沙水库\"1对双向停靠站\n- 该线的\"艮山门东站\"**更名**为\"艮山门东\"\n**调整日期**：2026年5月19日\n#### 4. 8259路（大关小区总站→汽车客运中心西）\n**调整后的线路走向**：大关小区总站始发，经香积寺路、大关苑路、大关路、绍兴路、香积寺路后循原线至汽车客运中心西\n**增设**：大关东五苑、大关小区北2只单向停靠站\n**其他调整**：大关小区总站始发站位置调整至与578路并站\n**调整日期**：2026年5月19日\n---\n## 5月10日起，调整95、135等线路\n- **发布时间：** 2026-05-08\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9168)\n为进一步优化线网结构，提升公交服务水平，结合古扇弄、华西路、太公街等道路开通，方便石桥铭苑、华丰欣苑、联发悦望荟等小区居民出行，自2026年5月10日起调整95、135路部分线路走向：\n### 95路（丁桥公交总站 ↔ 运河广场）\n仅调整丁桥公交总站→运河广场方向的部分走向，返程不变：\n- 调整后走向：丁桥公交总站始发，循原线至石桥路，经古扇弄、石桥苑巷、石祥路后再循原线至运河广场。\n- 站点调整：撤销石桥路石祥路口1只单向停靠站；增设老汽轮厂、石桥铭苑2只单向停靠站。\n- 其余不变。\n### 135路（千桃园 ↔ 艮山门东）\n双向调整部分走向：\n- 调整后走向：艮山门东始发，循原线至新汇路，双向经华西路、太公街、华中路后再循原线至千桃园。\n- 站点调整：撤销太公街1只单向停靠站（开往艮山门东方向）；增设华西路南、长善、水车头3对双向停靠站，以及水车头1只单向停靠站（开往艮山门东方向）。\n- 其余不变。\n---\n## 恢复40、80、156路线路走向\n- **发布时间：** 2026-04-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9160)\n凯旋路（严家路-凤起东路）临时交通管控结束，恢复双向通行，即时起，40、80、156路恢复凯旋路原线路走向及停靠站点，具体为：\n1. **40路**，恢复为三里亭临时总站始发，循原线至机场路，经凯旋路、凤起东路后循原线至吴山广场北；吴山广场北始发，循原线至凤起东路，经凯旋路、机场路后循原线至三里亭临时总站。**撤销：** 艮山闸、市红会医院北2对双向停靠站；**恢复：** 华家池北、浙大华家池校区、凤起东路凯旋路口（开往吴山广场北方向）、凤起立交（开往三里亭临时总站方向）4对（只）停靠站。\n2. **80路**，恢复为大关北公交总站始发，循原线至凯旋路，经采荷路后循原线至雷霆路望江东路口；雷霆路望江东路口始发，循原线至凯旋路，经凯旋路后循原线至大关北公交总站。**撤销：** 艮山闸（开往大关北公交总站方向）、市红会医院北（开往大关北公交总站方向）、严家弄（开往雷霆路望江东路口方向）、景芳亭（开往雷霆路望江东路口方向）、双菱路北口（开往雷霆路望江东路口方向）5只单向停靠站；**恢复：** 华家池北（开往大关公交总站方向）、浙大华家池校区、凤起立交3对（只）停靠站。\n3. **156路**，恢复为翠苑四区始发，循原线至环城北路，经凯旋路、凤起东路后循原线至民心路江锦路口；民心路江锦路口始发，循原线至凤起东路，经凯旋路、环城北路后循原线至翠苑四区。**撤销：** 艮山闸、市红会医院北2对双向停靠站；**恢复：** 华家池北、浙大华家池校区、凤起东路凯旋路口3对双向停靠站。\n---\n## 因凯旋路（严家路-凤起东路）实施双向交通管控，4月29日起，临时调整40、80、156路线路走向\n- **发布时间：** 2026-04-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9147)\n因凯旋路（严家路-凤起东路）实施双向交通管控，4月29日起，涉及40、80、156路临时调整部分线路走向，具体为：\n1. **40路**，临时调整为三里亭临时总站始发，循原线至机场路，经艮山西路、环城东路、凤起立交、凤起东路后循原线至吴山广场北；吴山广场北始发，循原线至凤起东路，经凤起立交、环城东路、艮山西路、机场路后循原线至三里亭临时总站。**临时撤销：** 华家池北、浙大华家池校区、凤起东路凯旋路口（开往吴山广场北方向）、凤起立交（开往三里亭临时总站方向）4对（只）停靠站；**临时增设：** 艮山闸、市红会医院北2对双向停靠站。\n2. **80路**，临时调整为大关北公交总站始发，循原线至凯旋路，经严家路、秋涛路、凤起东路、凯旋路后循原线至雷霆路望江东路口；雷霆路望江东路口始发，循原线至凯旋路，经太平门直街、双菱路、凤起东路、凤起立交、环城东路、艮山西路、机场路后循原线至大关北公交总站。**临时撤销：** 华家池北（开往大关公交总站方向）、浙大华家池校区、凤起立交3对（只）停靠站；**临时增设：** 艮山闸（开往大关北公交总站方向）、市红会医院北（开往大关北公交总站方向）、严家弄（开往雷霆路望江东路口方向）、景芳亭（开往雷霆路望江东路口方向）、双菱路北口（开往雷霆路望江东路口方向）5只单向停靠站。\n3. **156路**，临时调整为翠苑四区始发，循原线至环城北路，经环城东路、凤起立交、凤起东路后循原线至民心路江锦路口；民心路江锦路口始发，循原线至凤起东路，经凤起立交、环城东路、环城北路后循原线至翠苑四区。**临时撤销：** 华家池北、浙大华家池校区、凤起东路凯旋路口3对双向停靠站；**临时增设：** 艮山闸、市红会医院北2对双向停靠站。\n---\n## 5月1日起，调整1314路等线路\n- **发布时间：** 2026-04-29\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9135)\n为进一步优化公交服务质量，提升线路运营效率，自5月1日起调整1314路等线路：\n1. **调整1314路**（宋城东门总站至一公园）部分线路走向：调整后的线路走向为宋城东门总站始发，循原线至南山路，经西湖大道、延安路、南山路至一公园；一公园至宋城东门总站方向不变。**撤销：** 涌金门（开往一公园方向）1只单向停靠站；**增设：** 涌金门东（开往一公园方向）、饮马井巷（开往一公园方向）2只单向停靠站。\n2. **调整法华寺接驳线**为东岳社区接驳线：城西公园至法华寺的法华寺接驳线调整为城西公园至东方中学，线路名称改为东岳社区接驳线。调整后的线路走向：城西公园始发，经天目山路、紫金港路、西溪路至西溪路小龙驹坞路口折返，再经西溪路至东方中学；东方中学始发，经西溪路、紫金港路至紫金港路西溪路口折返，再经紫金港路、明谷街至城西公园。沿途停靠：东岳（开往东方中学方向）、东岳社区换乘站。服务时间（仅双休节假日运营）：城西公园为8:00-16:00；东方中学为9:00-17:00。\n---\n## 5月1日起，恢复331路线路走向\n- **发布时间：** 2026-04-28\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9133)\n因绕城高速公路（龙坞段）涵洞提升改造工程施工结束，5月1日起，将恢复331路走向：\n1. **331路调整**：艺创小镇总站始发，循原线至留泗路，经白龙潭路、上城埭路、灵龙路后循原线至留下南。**恢复：** 龙坞、白龙潭路叶埠桥路口、白龙潭路灵龙路口、白龙潭路采青路口、葛衙庄总站外（招呼站）、葛衙庄、兔子山7对双向停靠站。**撤销：** 太坞山北双向停靠站。\n2. **停运1407区间车**：白龙潭路采青路口至象山的1407区间车。\n3. **停运331B路**：龙坞葛衙庄总站至留下西的331B路。\n---\n## 2026杭州女子半程马拉松赛期间，55条线路临时调整\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9118)\n为配合2026杭州女子半程马拉松赛（\"杭州女马\"）举办，赛事期间相关路段实施交通管控，对公交线路进行临时调整。\n**调整概况：** 本次共涉及55条公交线路临时调整，其中46条调整线路走向，9条调整首班时间或运营时段。\n**主要调整线路：**\n- 4路、5路、7路、9路、10路、11路、12路、13路、14路、16路、18路、21路、22路、25路、26路、27路、28路、31路、39路、42路、45路、46路、49路、62路、78路、87路、92路、101路、102路、103路、113路、126路、151路、K155路、186路、188路、199路、277路、290路、313路、318路、506路、8192路、8202路、8218路\n**运营时间调整线路：**\n- 139路：婺江路银鼓路口6:30至8:30间暂停运营，闸口首班推迟至8:45\n- 510路：武林广场西首班推迟至9:00\n- 1314路：一公园首班推迟至9:00\n- WE1314路：吴山广场总站首班推迟至8:30\n市民可通过\"杭州公共交通\"App查询具体调整信息，也可在涉及调整的线路车辆及沿线站点查看调整公告。\n---\n## 4月27日起，新增1711路，优化提升389、1213路等线路为\"5分钟巴士\"\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9117)\n为进一步提升公交服务品质，合理配置公交资源，优化丰收湖区域线网，扩大部分区域\"5分钟巴士通勤圈\"覆盖范围，强化白洋、金沙湖等地铁站的公交接驳效能。\n**新增线路：1711路**\n- 起讫点：九环路九华路口 ↔ 地铁乔司南站（A·B）\n- 运营时间：仅工作日开行，早高峰6:30-9:00，晚高峰17:00-19:30\n- 票价：1元/人次，实行响应式停靠\n**优化提升为\"5分钟巴士\"的线路：**\n1. 389路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n2. 1213路：早高峰发车间隔约6分钟\n3. 1216路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n4. 1709路：早高峰发车间隔约7分钟，晚高峰发车间隔约7分钟\n5. 2073路：早高峰发车间隔7分钟，晚高峰发车间隔7分钟\n6. 3105路：早高峰发车间隔约5分钟，晚高峰发车间隔约5分钟\n7. 7709路：发车间隔约7分钟\n**站点调整：**\n- 128路：双向增设停靠站\n**停驶线路：**\n- 7710路：2026年4月27日起停驶，调整后的2073路、7709路已覆盖原服务范围\n---\n## 因银湖街道创意路（富闲路-望湖路）提升改造，4月25日起，调整546、592、596路等线路\n- **发布时间：** 2026-04-24\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](https://www.hzbus.com.cn/hzbus/detail/36/9108)\n因银湖街道创意路（富闲路-望湖路）提升改造，施工期间该路段机动车禁止通行，自2026年4月25日起调整部分线路走向。\n**线路调整：**\n1. **546路**：石马公交总站始发方向调整，改经彩虹快速路至地铁银湖站\n2. **592路**：火车西站始发方向调整，改经上林南路后循原线，临时撤销「地铁银湖站」1个单向停靠站\n3. **596路**：富阳公交总站始发方向调整，改经彩虹快速路后循原线，临时撤销「麓园」1个单向停靠站\n---\n## 因书音路管网施工结束，4月22日起，恢复533路线路走向\n- **发布时间：** 2026-04-17\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9082)\n因书音路管网施工结束，定于2026年4月22日头班起，恢复533路线路走向，具体如下：\n**533路调整后走向：**\n- 浙二医院∙马市街始发，循原线至奔竞大道，经书音路后循原线至友佳路乐达路口\n- 友佳路乐达路口始发，循原线至盈丰路，经书音路、奔竞大道后循原线至浙二医院∙马市街\n**站点调整：**\n- **恢复停靠：** 书音路盈丰路口、书音路奔竞大道口2对停靠站\n- **撤销临时站点：** 金鸡路盈丰路口1对停靠站\n---\n## 因绕城高速公路（龙坞段）涵洞提升改造工程施工，4月19日起，调整部分公交线路\n- **发布时间：** 2026-04-17\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9086)\n因绕城高速公路（龙坞段）涵洞提升改造工程施工需要，4月19日起，留泗路与上城埭路的连接线禁止车辆通行，331路及配套线路调整如下：\n### 1. 331路调整\n- **调整后走向：** 艺创小镇总站始发，循原线至留泗路，向北直行过太坞山隧道，继续经留泗路行驶\n- **撤销站点：** 龙坞、白龙潭路叶埠桥路口、白龙潭路灵龙路口、白龙潭路采青路口、葛衙庄总站外（招呼站）、葛衙庄、兔子山7对双向停靠站\n- **增设站点：** 太坞山北双向停靠站\n### 2. 配套保障措施\n- **395路、1407路** 增设「白龙潭路灵龙路口」双向停靠站；1407路「江口村」站更名为「江口」\n- **增开1407路区间车：** 白龙潭路采青路口至象山，与1407路长线交替发车，高峰间隔不大于15分钟，平峰不大于30分钟\n- **增开331B路：** 龙坞葛衙庄总站至留下西，沿途停靠白龙潭路采青路口、白龙潭路灵龙路口等13对双向停靠站，服务时间6:00-18:00（每逢整、半点发车）\n---\n## 4月18日起，调整西湖南线部分公交线路停靠站点及服务时间\n- **发布时间：** 2026-04-16\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9081)\n随太子湾郁金香展结束，综合南山路沿线客流情况变化，自4月18日起，调整西湖南线部分公交线路停靠站点及服务时间：\n### 1. 分站停靠调整（4月18日-5月10日双休日执行）\n南山路沿线长桥、净寺、苏堤、苏堤南口站点调整停靠线路，4路仅在双休日10:00前及17:30后停靠上述站点。\n### 2. 线路走向及服务时间调整\n- **12、42路：** 双休日恢复停靠南山路万松岭路口、清波门、钱王祠公交站，不再绕行中河路\n- **31路：** 双休日始发站恢复为地铁吴山广场站C口，不再改走劳动路\n- **4路：** 绕行万松岭隧道时间由9:45提早至9:30，恢复原走向时间由18:00提早至17:00\n- **太子湾接驳1号线：** 双休日服务时间调整为龙翔桥公交总站9:30-15:00，苏堤南口10:00-18:00\n- **新开太子湾接驳7号线：** 仅双休日运营，吴山广场总站9:00-15:00，苏堤南口10:00-17:30\n---\n## 4月4日起，调整354路停靠站点\n- **发布时间：** 2026-04-02\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9034)\n为进一步优化公交线网布局，缓解闸口站往白塔方向的客流压力，自2026年4月4日起，354路增设「之江路六和塔」1对双向停靠站。\n---\n## 因清江路之江路口、清江路钱江路口高架桥梁拆卸施工，临时调整清江路部分路线走向\n- **发布时间：** 2026-03-30\n- **来源：** 杭州市公共交通集团有限公司\n- **链接：** [查看原文](http://www.hzbus.com.cn/hzbus/detail/36/9005)\n因清江路之江路口、清江路钱江路口高架桥梁拆卸施工需要，临时调整9路、29路、64路部分走向及停靠站点：\n### 1. 3月28日23时至次日6时清江路之江路口封控（雨天顺延）\n- **64路** 临时调整为由解放东路经富春路、婺江路、之江路、衢江路至近江一园站，临时撤销地铁市民中心站N口、景江城市花园东门、之江路衢江路口3只停靠站。\n### 2. 4月10日-12日每日23时至次日6时多路段封控（雨天顺延）\n- **9路** 双向经城星路、富春路、衢江路后循原线，临时撤销钱江路城星路口、钱江路衢江路口2对（只）停靠站\n- **29路** 经秋涛路、婺江路、富春路后循原线，临时撤销观音塘思安坊、清静弄、近江小区、近江六园4只单向停靠站"}],"size": var currentMode='line';

function switchMode(mode,el){
  currentMode=mode;
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  clearQuery();
  document.getElementById('q').placeholder = mode==='fulltext' ? '输入关键词搜索所有公告全文...' : '输入线路号，如 147、312、1702...';
  document.getElementById('q').focus();
}

function doQuery(){return currentMode==='fulltext' ? doFulltextSearch(): doLineQuery();}

  h+='<div class="info-item"><div class="label">总调电话</div><div class="value mono">'+(ct["总调"]||"暂无")+'</div></div>';
  h+='<div class="info-item"><div class="label">所属场站数</div><div class="value">'+ds.length+" 个"+'</div></div>';
  h+='<div class="info-item"><div class="label">备注</div><div class="value sub">'+esc(l.note||"无")+'</div></div></div></div>';
  if(ds.length){h+='<div class="card-divider"></div><div class="info-section"><div class="section-title">'+esc(l.company||"")+' 场站列表</div><div class="depot-wrap"><table class="depot-table"><thead><tr><th>场站名称</th><th>地址</th></tr></thead><tbody>';ds.forEach(function(d){h+='<tr><td class="dn">'+esc(d.name)+'</td><td class="da">'+esc(d.addr||"")+'</td></tr>'});h+='</tbody></table></div></div>'}
  if(am.length){h+='<div class="card-divider"></div><div class="info-section"><div class="section-title">相关公告</div><div class="assembly-wrap"><div class="assembly-list">';am.forEach(function(a){h+='<div class="assembly-item"><div class="ad">'+esc(a.desc)+'<time>'+esc(a.date)+'</time></div></div>'});h+='</div></div></div>'}
  var mdResults=searchMDDocs(q);
  if(mdResults.length){h+='<div class="card-divider"></div><div class="info-section"><div class="section-title">全文相关（'+mdResults.length+'条）</div><div class="fulltext-results">';mdResults.forEach(function(mr){h+='<div class="ft-item"><div class="ft-title">'+esc(mr.title)+'</div><div class="ft-source">'+esc(mr.doc)+'</div><div class="ft-text">'+mr.text+'</div></div>'});h+='</div></div>'}
  h+='</div>';r.innerHTML=h;
}

function doFulltextSearch(){
  var q=document.getElementById('q').value.trim(),r=document.getElementById('result'),n=document.getElementById('init');
  if(!q){r.innerHTML='';n.style.display='flex';return}n.style.display='none';
  if(!DB.md_docs){r.innerHTML='<div class="empty-state"><div class="ico">\ud83d\udcc4</div><div class="msg">全文数据未加载</div></div>';return}
  var results=[],ql=q.toLowerCase();
  for(var docName in DB.md_docs){var doc=DB.md_docs[docName];if(!doc.sections)continue;
    doc.sections.forEach(function(sec){var text=sec.text.toLowerCase(),title=sec.title.toLowerCase();
      if(text.indexOf(ql)!==-1||title.indexOf(ql)!==-1){var preview=sec.text;if(preview.length>300)preview=preview.substring(0,300)+'...';
        preview=preview.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
        preview=preview.replace(/(\d+[A-Za-z]*(?:路|M路|区间|快线|专线|B))/g,'<a href="#" onclick="jumpToLine(\'$1\')" style="color:#60a5fa;text-decoration:underline;cursor:pointer">$1</a>');
        results.push({doc:docName,title:sec.title,text:preview});
      }
    });
  }
  if(!results.length){r.innerHTML='<div class="empty-state"><div class="ico">\ud83d\udd0d</div><div class="msg">未找到关于「'+esc(q)+'」的内容</div></div>';return}
  var h='<div class="ft-count">找到 '+results.length+' 条结果</div>';
  h+='<button class="ai-btn" id="aiBtn" onclick="doAIAnalyze(\''+esc(q)+'\')">\ud83e\udd16 AI智能分析</button>';
  h+='<div id="aiResult"></div>';
  h+='<div class="fulltext-results">';
  results.forEach(function(r){h+='<div class="ft-item"><div class="ft-title">'+esc(r.title)+'</div><div class="ft-source">'+esc(r.doc)+'</div><div class="ft-text">'+r.text+'</div></div>'});
  h+='</div>';r.innerHTML=h;
  // 保存原始结果供AI分析
  window._lastResults = results;
  window._lastQuery = q;
}

// AI分析
function doAIAnalyze(q){
  var btn=document.getElementById('aiBtn');
  if(!btn)return;
  btn.disabled=true;btn.textContent='\u23f3 AI分析中...';
  var ctx='';
  if(window._lastResults){
    window._lastResults.forEach(function(r){ctx+=r.title+'\n'+r.text.replace(/<[^>]+>/g,'')+'\n'});
  }
  fetch('/api/analyze',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({query:q,context:ctx})
  }).then(function(r){return r.json()}).then(function(d){
    var ar=document.getElementById('aiResult');
    ar.innerHTML='<div class="ai-card"><div class="ai-title">\ud83e\udd16 AI分析摘要</div><div class="ai-text">'+ (d.result||'无结果').replace(/\n/g,'<br>') +'</div></div>';
    btn.disabled=false;btn.textContent='\ud83e\udd16 AI智能分析';
  }).catch(function(e){
    document.getElementById('aiResult').innerHTML='<div class="ai-card" style="color:#f87171">AI分析失败: 请确保桌面工具站已启动(端口8888)且API Key已设置</div>';
    btn.disabled=false;btn.textContent='\ud83e\udd16 AI智能分析(重试)';
  });
}

function searchMDDocs(q){
  if(!DB.md_docs)return[];var results=[];
  var keywords=[q.replace(/路$/,''),q,q+'路'];
  for(var docName in DB.md_docs){var doc=DB.md_docs[docName];if(!doc.sections)continue;
    doc.sections.forEach(function(sec){var match=false;
      keywords.forEach(function(kw){if(sec.text.toLowerCase().indexOf(kw.toLowerCase())!==-1||sec.title.toLowerCase().indexOf(kw.toLowerCase())!==-1)match=true});
      if(match){var preview=sec.text;if(preview.length>250)preview=preview.substring(0,250)+'...';
        keywords.forEach(function(kw){preview=preview.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});
        results.push({doc:docName,title:sec.title,text:preview});
      }
    });
  }
  return results.slice(0,20);
}

function jumpToLine(lineNo){document.querySelector('.mode-tab:first-child').click();document.getElementById('q').value=lineNo;doLineQuery()}
function clearQuery(){document.getElementById("q").value="";document.getElementById("result").innerHTML="";document.getElementById("init").style.display="flex"}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
